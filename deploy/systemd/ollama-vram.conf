[Service]
# Drop-in for ollama.service. Install to:
#   /etc/systemd/system/ollama.service.d/vram.conf
# then: sudo systemctl daemon-reload
#
# Comments only versus what is installed on the host as of 2026-09-07 -- the two
# Environment= lines are byte-identical, so applying this changes no behaviour
# and needs no ollama restart. It is versioned here because the comment it
# replaces was wrong in a way that caused a production startup crash, and an
# uncommitted correction on one box would be lost the next time the unit is
# rebuilt.
#
# Unified-model setup: AgentNick:unified is the single always-resident brain for
# extraction + agentic + summaries, with one small helper (nuextract:3.8b) able
# to coexist for hybrid_v4 structural extraction.
#
# --- What the previous comment claimed, and why it mattered ---
# It read: ":latest(~10.7GB)+nuextract(~2.2GB)=~13GB on the 23GB A10G -- leaves
# headroom for the torch reranker and avoids the dual-AgentNick OOM."
# Every figure in that sentence was wrong, and the conclusion drawn from them
# is what made the API crash on startup.
#
# Measured 2026-09-07 on this host:
#   AgentNick:unified  30.5B params, Q4_K_M, an 18GB blob (`ollama list`)
#   resident           ~19.5GB, 49/49 layers on GPU:
#                        ~18GB   weights
#                        1.5GiB  KV cache (NUM_PARALLEL=2 x 8192 ctx, f16)
#                        150MiB  compute graph
#   card               23,028MiB total, leaving ~1.1GiB free
# `ollama list` also shows :latest is 18GB, not 10.7GB, so the old figure did not
# describe either tag.
#
# There is therefore NO headroom for the torch cross-encoder reranker, which asks
# for 2.07GiB, and there never was. It now detects the shortfall and loads on CPU
# (utils.gpu.load_cross_encoder, which logs when it does). Do not re-plan around
# 13GB.
#
# --- KEEP_ALIVE below is effectively dead ---
# src/services/ollama_client.py sends keep_alive per request (-1, from .env), and
# a per-request value overrides the server default. That is why `ollama ps`
# reports "Forever" rather than 5m. Changing this line alone unloads nothing;
# change OLLAMA_KEEP_ALIVE in .env as well if that is the intent.
#
# --- Previous versions, recorded before deleting the stray backups ---
# Two vram.conf.bak.<epoch> files sat in the drop-in directory. systemd loads
# only *.conf, so they were inert -- proven, not assumed: the running server
# reports KEEP_ALIVE=5m0s and MAX_LOADED_MODELS=3, which are vram.conf's values,
# not either backup's. They are transcribed here so removing them loses nothing.
#
#   vram.conf.bak.1776847178  (2026-04-22)
#       Environment="OLLAMA_NUM_PARALLEL=1"
#       Environment="OLLAMA_KEEP_ALIVE=24h"
#       Environment="OLLAMA_FLASH_ATTENTION=1"
#
#   vram.conf.bak.1781876280  (2026-06-19, the version replaced the same day)
#       Environment="OLLAMA_KEEP_ALIVE=-1"
#       Environment="OLLAMA_MAX_LOADED_MODELS=2"
#
# The April file is worth reading twice: FLASH_ATTENTION=1 was genuinely set on
# the server once, and NUM_PARALLEL was 1. Both were dropped by the June rewrite,
# silently -- nobody chose to turn flash attention off, it was simply not carried
# forward. That is also where .env's inert OLLAMA_FLASH_ATTENTION="1" comes from:
# it is the ghost of a setting that really was live, left behind in a file the
# server never reads. If flash attention is wanted again, it belongs HERE.
#
# --- Not set here, deliberately ---
# OLLAMA_FLASH_ATTENTION and OLLAMA_KV_CACHE_TYPE would cut the KV cache by
# roughly 750MiB each, and OLLAMA_NUM_PARALLEL=1 by another 750MiB. Together that
# is ~1.5GiB against the reranker's 2.07GiB -- probably still short, and
# KV-cache quantisation is a real precision reduction. Not worth trading
# accuracy or concurrency for memory nothing currently needs. Note .env's
# OLLAMA_FLASH_ATTENTION="1" never reached the server: it belongs in THIS file.
Environment="OLLAMA_KEEP_ALIVE=5m"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
