thresholds:                      # configurable defaults for review, not policy
  score_strong_min: 80           # scorecard at or above this is strong
  score_adequate_min: 60         # at or above this and below strong is adequate; below is weak
  market_gap_pct: 5              # price gap to market at or above this is room to gain
  lead_time_renegotiate_days_min: 60
  lead_time_renegotiate_days_max: 90
  lead_time_retender_days_min: 120
  lead_time_retender_days_max: 180
  scorecard_window_months: 24    # evidence window, 12 to 24 months
  buffer_business_days: 10       # plan must finish this long before the notice deadline
  escalate_days_to_deadline: 30
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "auto-renew*"
    - "auto renew*"
    - "notice deadline"
    - "notice period"
    - "non-renewal"
    - "roll over"
    - "rollover"
    - "re-tender"
    - "retender"
    - "exit strategy"
    - "exit plan"
    - "switching cost*"
    - "contract expir*"
    - "expiry"
    - "terminate the contract"
    - "what notice"
    - "give notice"
    - "notice do we"
    - "notice must we"
    - "expire and"
    - "renew the contract"
    - "renew this contract"
    - "renew the agreement"
    - "renew with"
    - "contract renewal*"
    - "renewal decision*"
    - "renewal date*"
    - "renewals due"
    - "up for renewal"
    - "renewing"
    - "should we renew"
    - "or renew"
    - "renewals"
    - "renew our"
    - "renew it"
    - "renew this"
    - "exit cost*"
    - "leave this vendor"
    - "leave the vendor"
    - "leave this supplier"
    - "renew or"
    - "renew, renegotiate"
    - "renewal or exit"
    - "renewal versus"
    - "renew the deal"
  support:                       # 1 point each
    - "contract"
    - "supplier"
    - "vendor"
    - "expire*"
    - "notice"
    - "switch"
    - "replace"
    - "performance"
    - "market"
    - "decision"
    - "timeline"
    - "re-source"
