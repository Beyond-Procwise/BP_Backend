- id: t1
  kind: typical
  prompt: "What happens after I submit a requisition?"
  expect: "Approval and receipt rules quoted from policy; stages in order with actor, record, stop and who clears; ungoverned stages labelled default; next step pointed to; nothing approved"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "Walk me through procure to pay here."
  expect: "Stages from requisition to payment as governed; where the three-way match sits; findings and holds explained with owners; glossary"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "Why is my order stuck?"
