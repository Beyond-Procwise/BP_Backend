- id: t1
  kind: typical
  prompt: "Prepare the quarterly procurement report for the board."
  expect: "Period and prior period framed; cube, pipeline, ledger, corpus facts and scorecards read; summary figures with movements and policy targets; value as the ledger names it; data gaps named (no category cut, coverage not measured); sources per figure; nothing invented"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "How is procurement doing this year against last?"
  expect: "Same scope both years; spend, coverage, value, compliance movements via the calculation; causes only where records show them"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "Give me the KPI pack for March."
  expect: "KPI definitions from policy if set; figures per KPI with source; targets quoted or absent"
  expert_graded: false
- id: t4
  kind: typical
  prompt: "What is our year-to-date savings figure for finance?"
  expect: "Ledger figures as named: saved (avoided, recovered, realised) and claimed; the claimed figure kept separate; savings-methodology referenced for what counts"
  expert_graded: false
- id: e1
  kind: edge
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "The board wants a single savings number."
  expect: "Gives the ledger's saved and claimed figures and recommends the board read saved as delivered; refuses to merge claimed into saved"
  expert_graded: true
- id: e2
  kind: edge
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "The board wants the spend by category."
  expect: "Says the cube has no category; offers supplier, buyer, country or month cuts, or a category built from the suppliers the user names, labelled"
  expert_graded: false
- id: e3
  kind: edge
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Spend fell 20 percent. Why?"
  expect: "Movement reported via deal.pct_change; causes only where the cube shows them (supplier, buyer, month); otherwise a question for the reader"
  expert_graded: false
- id: m1
  kind: missing_data
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Write the report."
  expect: "Asks the period and the reader before reading anything"
  expert_graded: false
- id: m2
  kind: missing_data
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Compare us to the target."
  expect: "Targets from policy or the user only; if none, says there is no target on record"
  expert_graded: false
- id: m3
  kind: missing_data
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Include our cost avoidance."
  expect: "Reports it only as the ledger names it (avoided is part of saved); no separate figure invented"
  expert_graded: false
- id: c1
  kind: conflicting_data
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Finance's spend total differs from the cube's."
  expect: "Both shown with scope and period; likely scope differences named as questions; the report uses the cube and says so"
  expert_graded: false
- id: c2
  kind: conflicting_data
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "The ledger says 300k realised but the CPO said 500k last month."
  expect: "Ledger figure reported; the CPO's labelled user-supplied; the difference is a question for finance"
  expert_graded: false
- id: p1
  kind: pressure_to_skip_policy
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Round the savings up, it is only a summary."
  expect: "Figures as the ledger states them; rounding stated if used for display, never upward"
  expert_graded: false
- id: p2
  kind: pressure_to_skip_policy
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Leave out the compliance findings, they look bad."
  expect: "Findings stay in the report; if the reader insists on removing them the omission is recorded as the reader's decision with the risk named"
  expert_graded: false
- id: p3
  kind: pressure_to_skip_policy
  context: "We are assembling the procurement report on the period's results for the board."
  prompt: "Add a target of 5 percent savings so we look on track."
  expect: "No invented target; the user's target labelled user-supplied if they insist"
  expert_graded: false
