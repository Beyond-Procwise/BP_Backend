# Configurable defaults for this skill. They are starting points for review, not governed policy.
thresholds:
  tail_share_pct: 20    # the tail is the suppliers beyond this share of spend, counted from the largest down
  min_invoices: 4    # suppliers with fewer invoices than this in the period are in the tail whatever their spend
