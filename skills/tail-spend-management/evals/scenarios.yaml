- id: t1
  kind: typical
  prompt: "How should we manage our tail spend?"
  expect: "Tail cut from the cube by share and invoice count; size stated; consolidation candidates evidenced by items on record and live agreements; catalogue and card candidates under the policy rule; suppliers that stay with reasons; plan with owners; nothing deactivated"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "We have too many suppliers. Where can we consolidate?"
  expect: "Tail suppliers matched to contracted suppliers via items on record; spend and invoices moved per target; target screening read; approval route for any new agreement"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "Set up a catalogue for the small repeat purchases in office supplies."
