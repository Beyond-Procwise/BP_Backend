# Configurable defaults for this skill. They are starting points for review, not governed policy.
status: dormant                # drafted, checked, not routed, listed or usable until this line goes (services.skills.loader)
thresholds:
  late_days: 2    # days past the expected date before an order is red, when policy states none
  contract_horizon_days: 90    # days before expiry at which an unread contract is an alert
unavailable_tools:
  - track_shipment
  - query_wms
  - query_erp
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "control tower"
    - "what needs attention"
    - "needs attention today"
    - "attention list"
    - "what is at risk today"
    - "at risk this week"
    - "alerts for"
    - "set up alerts"
    - "alert thresholds"
    - "monitoring thresholds"
    - "supply chain dashboard"
    - "live view of"
    - "what is late today"
    - "orders at risk"
    - "shipments at risk"
    - "exceptions today"
    - "daily exceptions"
  support:                       # 1 point each
    - "alert*"
    - "monitor*"
    - "today"
    - "late"
    - "risk"
