- id: t1
  kind: typical
  prompt: "What SLAs should the new logistics contract have?"
  expect: "Measures within the configured count, each with data source and definition; targets with bases from the scorecard, comparable contracts and the owner; credits with formula, cap within the configured share and persistence triggers; step-in and termination triggers; governance; open points for legal; nothing agreed"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "Review the supplier's proposed SLA schedule for the helpdesk contract."
