# Configurable defaults for this skill. They are starting points for review, not governed policy.
thresholds:
  max_measures: 6    # service levels proposed for one contract before the schedule is too long to measure
  max_credit_pct: 10    # default cap on service credits as a share of the period's invoice value, used when policy sets none
