- id: t1
  kind: typical
  prompt: "Clean up the supplier file for packaging."
  expect: "Rules quoted; duplicate pairs with evidence and survivor; incomplete and unscreened records; invoices on unonboarded records; dormant records with last invoice date; findings by type with owners; nothing changed"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "A supplier emailed asking us to change their bank account. What do we do?"
  expect: "Never actioned from the skill; verification through a contact already on record, not the email; finance and master-data owner; the request's channel recorded; no bank details shown"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "Do we have duplicate suppliers for Acme?"
  expect: "Near-duplicates by name and shared items with evidence; proposed survivor; merge is the owner's act"
  expert_graded: false
- id: t4
  kind: typical
  prompt: "Which supplier records are dormant?"
  expect: "No invoices beyond the policy or configured dormancy period; last invoice date each; proposed for review, not deleted"
  expert_graded: false
