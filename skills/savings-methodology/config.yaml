thresholds:
  realised_vs_plan_variance_pct: 10     # above this, re-review the saving
  baseline_window_months: 12            # trailing window for a weighted-average baseline
  last_price_max_age_months: 18
  finance_review_min_annualised: 100000 # in the reporting currency, per initiative
  escalate_above_annualised: 1000000
unavailable_tools:
  - commodity_index_lookup
  - build_spend_cube
  - build_xlsx
  - build_docx
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "saving*"
    - "saved"
    - "cost avoidance"
    - "price freeze"
    - "baseline*"
    - "hard saving*"
    - "soft saving*"
    - "avoided increase*"
    - "double count*"
    - "savings claim*"
  support:                       # 1 point each
    - "finance"
    - "claim"
    - "claimed"
    - "payment terms"
    - "neutralis*"
    - "index"
    - "volume"
    - "price"
    - "realised"
    - "validate"
    - "count"
    - "cost"
