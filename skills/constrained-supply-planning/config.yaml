# Configurable defaults for this skill. They are starting points for review, not governed policy.
status: dormant                # drafted, checked, not routed, listed or usable until this line goes (services.skills.loader)
thresholds:
  allocation_trigger_pct: 5    # a shortfall above this share of demand is allocated explicitly by rule
unavailable_tools:
  - run_mrp
  - check_capacity
  - simulate_scenario
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "can we meet the demand"
    - "can demand be met"
    - "meet the demand"
    - "supply plan"
    - "constrained plan"
    - "constrained supply"
    - "supply constraint*"
    - "capacity constraint*"
    - "capacity shortfall"
    - "allocate the shortage"
    - "allocate the shortfall"
    - "allocation rule*"
    - "ration the supply"
    - "rationing"
    - "feasible plan"
    - "against capacity"
    - "plan supply for"
  support:                       # 1 point each
    - "capacity"
    - "shortfall"
    - "allocation"
    - "supply"
    - "lead time*"
