- id: t1
  kind: typical
  prompt: "Here is a list of 60 items with no movement for a year. What do we do with them?"
  expect: "Classified by the policy's or default days; values, shares and carrying cost via the registry; dispositions from clauses (quoted) and records (sites or suppliers that still buy them); recommendation per item with recovery, write-down, approval and owner; prevention note; nothing written down or scrapped"
  expert_graded: true
- id: t2
