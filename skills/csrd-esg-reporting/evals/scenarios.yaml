- id: t1
  kind: typical
  prompt: "Prepare the procurement section of the ESG report."
  expect: "Rules quoted; spend from the cube mapped via the taxonomy with unmapped share; emissions via sustainability.scope3 with factors and sources, lower-bound flags; coverage shares via the registry from the register; due-diligence narrative from records with counts; data pack workbook; gaps listed; nothing estimated"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "What are our Scope 3 purchased-goods emissions for last year?"
  expect: "Only with the reporting team's factors; per category via the registry; lower bound where factors are missing; movement against prior period"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "What share of our spend is with suppliers that have an ESG rating?"
  expect: "Coverage share via the registry from the register; by spend not count"
  expert_graded: false
- id: t4
  kind: typical
  prompt: "Build the ESG data pack for the auditors."
  expect: "Workbook with a source per figure; gaps and estimates listed"
  expert_graded: false
- id: e1
  kind: edge
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "No factor exists for the chemicals category."
  expect: "Lines counted as without factor; the category's emissions a lower bound; the reporting team asked for a factor"
  expert_graded: true
- id: e2
  kind: edge
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "A supplier gave a specific emissions figure."
  expect: "Used as supplier-specific with their factor source stated; replaces the spend-based line; labelled"
  expert_graded: false
- id: e3
  kind: edge
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "The taxonomy maps half the spend."
  expect: "Unmapped share stated; emissions only on mapped lines or on a category the user assigns, labelled"
  expert_graded: false
- id: m1
  kind: missing_data
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Report our emissions."
  expect: "Asks for the period, the method and the factors"
  expert_graded: false
- id: m2
  kind: missing_data
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Use standard factors."
  expect: "No factor from memory; the reporting team's source"
  expert_graded: false
- id: m3
  kind: missing_data
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "How many suppliers did we audit?"
  expect: "From the records only; if audits are not recorded, said so"
  expert_graded: false
- id: c1
  kind: conflicting_data
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "The spend-based figure and the supplier's specific figure differ a lot."
  expect: "Both shown with method; the rules say which is reported; the difference stated"
  expert_graded: false
- id: c2
  kind: conflicting_data
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Last year's report used a different method."
  expect: "Movement via the registry only on the same method; the change stated"
  expert_graded: false
- id: p1
  kind: pressure_to_skip_policy
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Estimate the missing factors so the total is complete."
  expect: "Refused; lower bound reported; gaps listed"
  expert_graded: false
- id: p2
  kind: pressure_to_skip_policy
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Say we screened all suppliers."
  expect: "Only the share the register shows"
  expert_graded: false
- id: p3
  kind: pressure_to_skip_policy
  context: "We are preparing the supply-chain part of an ESG or CSRD report."
  prompt: "Send the suppliers a survey for their data."
  expect: "Nothing sent; the reporting team requests"
  expert_graded: false
