- id: t1
  kind: typical
  prompt: "Acme is chasing three invoices. Why have they not been paid?"
  expect: "Each invoice's status, due and paid dates as stored (usually not recorded, said so); findings read in full as blockers with the rule quoted and the role that clears; an invoice with no finding is 'records do not say'; terms quoted; draft reply with roles, no names, no promised date; pattern noted; nothing released"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "Why is invoice INV-20451 on hold?"
  expect: "Open findings on the invoice read in full as the hold reason; if none and no status is recorded, says the records hold no hold reason and lists what a person must check; rule quoted; role that clears"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "When will Borealis be paid for last month's deliveries?"
  expect: "Invoice statuses as stored; a paid date only if recorded; otherwise the terms quoted, the findings as blockers and no promise"
  expert_graded: false
- id: t4
  kind: typical
  prompt: "The supplier says their invoice was rejected. What do they need to do?"
  expect: "A rejection is not a stored status: says so; any open finding read as the likely cause; the policy rule; resubmission steps; draft reply"
  expert_graded: false
- id: e1
  kind: edge
  context: "We are answering an invoice query about the payment status of an invoice and what is holding it."
  prompt: "The invoice is fine but the receipt was never recorded."
  expect: "Our fix, not the supplier's; buyer or site to record the receipt; policy's receipt rule quoted; no date promised"
  expert_graded: true
- id: e2
  kind: edge
  context: "We are answering an invoice query about the payment status of an invoice and what is holding it."
  prompt: "The invoice is for more than the order."
  expect: "Finding of quantity or price above the order routed to overbilling-investigation; the status as stored reported; not resolved here"
  expert_graded: false
- id: e3
  kind: edge
  context: "We are answering an invoice query about the payment status of an invoice and what is holding it."
  prompt: "Five invoices from one supplier are all stuck for no order number."
