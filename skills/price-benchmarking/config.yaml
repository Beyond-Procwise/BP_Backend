# Configurable defaults for the price benchmark. They are starting points for review, not governed policy.
thresholds:
  similarity_min: 0.6          # name similarity at or above which an own-history match is considered
  min_peer_prices: 3           # comparable peer prices below which no verdict is given
  in_line_band_pct: 5          # gap to the reference inside which the price is "in line"
  evidence_max_age_days: 365   # evidence older than this is caveated as old
unavailable_tools:
  - build_xlsx
  - render_chart
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "fair price"
    - "good price"
    - "price check"
    - "price comparison"
    - "overpaying"
    - "paying too much"
    - "too expensive"
    - "competitive price"
    - "price competitive"
    - "market rate"
    - "going rate"
    - "in line with the market"
    - "what we paid before"
    - "paid last time"
    - "price history"
    - "reasonable price"
    - "price reasonable"
    - "what did we pay for"
    - "what did we pay per"
    - "benchmark the price"
    - "benchmark this price"
    - "benchmark the quote"
    - "price benchmark*"
    - "benchmarked price"
    - "benchmark against the market"
    - "benchmark the price*"
    - "benchmark this price"
    - "benchmark the quote*"
    - "benchmark this quote"
    - "benchmark our price*"
    - "benchmark against the market"
