# Configurable defaults for this skill. They are starting points for review, not governed policy.
status: dormant                # drafted, checked, not routed, listed or usable until this line goes (services.skills.loader)
thresholds:
  pattern_window_days: 90    # days within which repeated exceptions of one kind for one supplier or buyer are a pattern
unavailable_tools:
  - duplicate_invoices
  - release_hold
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "match exception*"
    - "clear the exception"
    - "resolve the exception"
    - "work the exception"
    - "clear the block"
    - "clear the blocked invoice"
    - "resolve the blocked invoice"
    - "why does the invoice not match"
    - "does not match the order"
    - "does not match the receipt"
    - "three-way match exception"
    - "three way match exception"
    - "mismatch between the invoice"
    - "invoice mismatch"
    - "receipt without an order"
    - "receipt with no order"
    - "duplicate payment*"
    - "paid twice"
    - "invoiced twice"
  support:                       # 1 point each
    - "exception"
    - "invoice"
    - "receipt"
    - "order"
    - "match"
