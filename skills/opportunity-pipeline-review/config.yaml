# Configurable defaults for the pipeline review. They are starting points for review, not governed policy:
# what counts as a saving and who may record one come from policy and the ledger's own rule.
thresholds:
  default_period_months: 12    # trailing window for realised value when the user gives none
  stalled_days: 60             # a lever with no recorded movement for this many days is stalled
  escalate_value: 25000        # a stalled lever with recorded value above this (reporting currency) is escalated
  top_n: 10                    # asks listed in detail
unavailable_tools:
  - build_xlsx
  - render_chart
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "value pipeline"
    - "opportunity pipeline"
    - "pipeline of opportunities"
    - "value delivered"
    - "delivered so far"
    - "value ledger"
    - "what the ledger says"
    - "ledger says"
    - "open opportunities"
    - "opportunities are open"
    - "opportunities across"
    - "which opportunities"
    - "pursue next"
    - "should we pursue"
    - "what to pursue"
    - "still claimed"
    - "realised versus claimed"
    - "value realised"
    - "value realized"
    - "stalled opportunit*"
    - "stalled lever*"
    - "opportunities stalled"
    - "which levers are open"
    - "levers are open"
    - "open levers"
    - "levers are stuck"
    - "levers open"
  support:                       # 1 point each
    - "pipeline"
    - "ledger"
    - "opportunit*"
