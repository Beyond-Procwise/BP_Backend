thresholds:
  close_decision_shift_pp: 5       # a weight change this big that flips rank 1 makes it a close decision
  screening_max_age_days: 30       # a sanctions or risk check older than this is stale
unavailable_tools:
  - screen_sanctions
  - financial_health_score
  - esg_rating_lookup
  - forced_labour_screen
  - savings_tracker
  - route_approval
  - build_docx
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "award*"
    - "winning bidder*"
    - "bidder*"
    - "tender*"
    - "winner*"
    - "evaluation committee"
    - "sourcing committee"
    - "close call"
    - "first and second place"
    - "decision paper"
    - "regret letter*"
    - "who should win"
  support:                       # 1 point each
    - "bid"
    - "bids"
    - "score"
    - "scored"
    - "scoring"
    - "contract"
    - "recommend*"
    - "split"
    - "supplier"
    - "committee"
    - "quality"
    - "price"
    - "decision"
    - "evaluat*"
