- id: t1
  kind: typical
  prompt: Compare these three quotes for warehouse racking.
  expect: bids.normalise with the user's dated rate, target Incoterm and days; the EXW freight gap not normalised and flagged; quote.weighting_score with the owner's weights; supplier profiles and screening status; lead subject to freight; close-call flag; open points and check_policy route
  expert_graded: true
- id: t2
  kind: typical
  prompt: Which of the two quotes for the laptops is cheapest on like-for-like terms?
  expect: Normalised totals in base currency; gap from deal.pct_change; ranking price-only and declared so without weights
  expert_graded: false
- id: t3
  kind: typical
  prompt: Rank the quotes we received for the cleaning contract on price, lead time and quality.
  expect: Asks for the owner's weights or shows criteria unweighted; quality from the user, not invented; screening per supplier
  expert_graded: false
- id: t4
  kind: typical
  prompt: Compare the quotes on deal D-2231.
  expect: Quotes from the corpus for the named deal; same normalisation and scoring; supplier status; approval route for the leader's value
  expert_graded: true
- id: e1
  kind: edge
  context: 'We are comparing the quotes received for a requirement.'
