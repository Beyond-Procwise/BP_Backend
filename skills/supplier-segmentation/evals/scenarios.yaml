- id: t1
  kind: typical
  prompt: "Segment our supplier base for last year."
  expect: "Spend cube read for the year; share of total and of category per supplier; replaceability from similar items; four segments with evidence; strategic suppliers checked for contract and screening; treatments and owners; nothing recorded"
  expert_graded: true
- id: t2
  kind: typical
  prompt: "Which of our suppliers are strategic and which are just leverage?"
  expect: "Strategic needs high spend and hard to replace, evidenced; leverage has alternatives on record; the difference is stated per supplier with the evidence"
  expert_graded: true
- id: t3
  kind: typical
  prompt: "Who are our critical suppliers in packaging?"
  expect: "Scope limited to the category; share of category computed; items without alternatives flagged as bottleneck; the user asked for critical items where the records are silent"
  expert_graded: false
- id: t4
  kind: typical
  prompt: "Build a tiering of our top twenty suppliers."
  expect: "Top twenty by spend from the cube; each tiered with evidence; contract cover and screening for the top tier; treatments"
  expert_graded: false
- id: e1
