- id: t1
  kind: typical
  prompt: "Run the approved pallet auction on Thursday."
  expect: "Preconditions (design, screened independent bidders who accepted the rules, approval as replied); set-up sheet built and confirmed; run only through the auction action, else ready-to-run reported; monitoring rules; closing record; hand-off to award; nothing awarded"
  expert_graded: true
- id: t2
