  prompt: Has Clearwater Logistics been overbilling us?
  expect: Open findings as the starting list; matched lines and price variance from the scorecard; quantity reconciliation per line; no receipts recorded stated as our gap; amount from the calculations per currency; query drafted; approval route for a hold
  expert_graded: true
