# Org-tunable settings for procurement-policy-compliance. SKILL.md refers to these by key.
thresholds:
  split_window_days: 30          # rolling window for split-order detection
  split_near_threshold_pct: 10   # "just below a limit" band, percent
  split_min_orders: 3            # orders inside the band that raise the signal
governed_policies:
  approval_limit: approval_threshold_policy   # the only governed approval limit that exists today
ungoverned_rules:                # no bp_policy row yet -> verdict INSUFFICIENT_INFO, never a guess
  - competitive_bid_thresholds
  - delegation_of_authority_by_category
  - preferred_supplier_rules
  - conflict_of_interest_rules
  - waiver_rules
authoritative_reply_tool: check_policy   # the verify step shows this tool's reply_text as the answer, unchanged
unavailable_tools:
  - query_erp
  - build_docx
rule_policy_keywords:            # a rule counts as governed when an active policy slug contains one of these
  competitive_bid_thresholds: [bid, tender, quote_threshold]
  delegation_of_authority_by_category: [delegation, authority_matrix, doa]
  preferred_supplier_rules: [preferred_supplier, mandated_supplier]
  conflict_of_interest_rules: [conflict_of_interest, coi]
  waiver_rules: [waiver]
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "approval limit*"
    - "approval threshold*"
    - "delegated authority"
    - "delegation of authority"
    - "approver*"
    - "who approves"
    - "who must approve"
    - "who needs to approve"
    - "split order*"
    - "split purchase*"
    - "splitt*"
    - "compliance check*"
    - "compliant"
    - "approve my own"
    - "own requisition"
    - "self approv*"
    - "sole source"
    - "waiver*"
    - "allowed under"
    - "under our policy"
    - "under policy"
    - "against policy"
    - "against our policy"
    - "within my authority"
    - "within delegated"
    - "competitive bid*"
    - "avoid approval"
    - "what approval"
    - "need approval"
    - "needs approval"
  support:                       # 1 point each
    - "policy"
    - "approve"
    - "approval"
    - "requisition"
    - "requisitions"
    - "purchase order"
    - "threshold"
    - "limit"
    - "authority"
    - "compliance"
    - "allowed"
    - "permit*"
    - "sign off"
    - "signed off"
