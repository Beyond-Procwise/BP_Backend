# Configurable defaults for supplier offboarding. They are starting points for review, not governed policy:
# the approval route for a termination payment or a run-off order comes from policy.
thresholds:
  notice_buffer_days: 5          # business days of buffer before the notice deadline the plan builds in
  min_transition_days: 30        # days of overlap with the replacement unless the clause states another period
unavailable_tools:
  - send_message
  - build_docx
routing:                         # how the orchestrator decides this skill covers a request (see orchestration/skill_router.py)
  strong:                        # 3 points each; a trailing * matches any ending
    - "offboard*"
    - "off-board*"
    - "stop using"
    - "stop buying from"
    - "transition away"
    - "move away from"
    - "wind down"
    - "winding down"
    - "wind-down"
    - "decommission*"
    - "leave the supplier"
    - "leaving the supplier"
    - "exit the supplier"
    - "exiting the supplier"
    - "exit from"
    - "handover from"
    - "hand over from"
    - "run-off order*"
    - "last order"
    - "final order"
    - "drop the supplier"
    - "dropping the supplier"
    - "part ways"
    - "disengage*"
  support:                       # 1 point each
    - "transition"
    - "handover"
    - "replacement"
    - "data return"
    - "access"
