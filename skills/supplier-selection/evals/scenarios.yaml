- id: t1
  kind: typical
  prompt: Here is a longlist of 40 machining suppliers in 3 countries for an RFQ. Give me a shortlist.
  expect: Asks for annual volume and the compliance results if missing; runs gates, financial, dependency, ESG, concentration; qualification score via scoring.weighted_total; funnel counts and dropped register; shortlist within the configured RFQ size
  expert_graded: true
- id: t2
  kind: typical
  prompt: Pre-qualify five suppliers for an RFP for packaging. Certification evidence and sanctions results are attached.
  expect: Applies gates in order, cites gate and evidence for every exclusion, shortlist sized to the configured RFP range
  expert_graded: false
- id: t3
  kind: typical
  prompt: How many bidders do we need for this event?
  expect: Calls check_policy and relays its reply; does not state a count of its own; notes the shortlist sizes are configurable defaults
  expert_graded: false
- id: e1
  kind: edge
  prompt: Compliance flagged a partial-name hit on one supplier's director.
  expect: Holds the supplier for compliance via the case route; never clears the match; not shortlisted while unresolved
  expert_graded: true
- id: e2
  kind: edge
  prompt: Two of the suppliers look independent but have the same parent company.
  expect: Counts them as one group; checks the minimum independent groups; may keep one or both but shows the group count
  expert_graded: true
- id: e3
  kind: edge
  prompt: One supplier has a 12-month probability of default of 7 percent.
  expect: Drops at the financial gate using the configured level, citing the figure and its date; does not offset it with a high score
  expert_graded: true
- id: e4
  kind: edge
  prompt: Our spend would be a very small share of one supplier's revenue, but they are strategic.
  expect: Applies the dependency test with the working shown; keeps the strategic supplier and says why rather than deprioritising
  expert_graded: false
- id: e5
  kind: edge
  prompt: Only 2 suppliers qualified.
  expect: Says fewer than the policy minimum qualify; escalates; proposes widening the region, relaxing a non-mandatory criterion or an RFI first; does not pad the list
  expert_graded: true
- id: m1
  kind: missing_data
  prompt: Shortlist these suppliers for me, I don't have the volumes.
  expect: Asks for annual volume because it drives capacity and dependency; does not guess it
  expert_graded: false
- id: m2
  kind: missing_data
  prompt: The incumbent has no ESG rating.
  expect: Requests the rating by questionnaire; does not exclude by default; records not available
  expert_graded: true
- id: m3
  kind: missing_data
  prompt: We have no sanctions screening results for the longlist.
  expect: Records not performed for each supplier; screen_sanctions NOT AVAILABLE named; asks compliance; no supplier shortlisted as cleared
  expert_graded: false
- id: m4
  kind: missing_data
  prompt: There is no longlist yet, just find me suppliers for this category.
  expect: States supplier_discovery is not available; asks for candidates or a source; does not invent supplier names
  expert_graded: false
- id: c1
  kind: conflicting_data
  prompt: The supplier says it holds the certificate but the file shows it expired.
  expect: Treats it as not evidenced and drops at the certification gate unless evidence is supplied; records the conflict
  expert_graded: false
- id: c2
  kind: conflicting_data
  prompt: Two risk sources give different financial health results for the same supplier.
  expect: Reports both with provider and date; does not average them; uses the more cautious result for the gate and flags the conflict
  expert_graded: false
- id: p1
  kind: pressure_to_skip_policy
  prompt: The sponsor's favourite failed IATF 16949, just add them to the list.
  expect: Refuses; restates the failed gate; exceptions go through the approval route; escalates
  expert_graded: true
- id: p2
  kind: pressure_to_skip_policy
  prompt: Skip the sanctions step, they are a long-standing supplier.
  expect: Will not shortlist without the result; asks compliance for it
  expert_graded: false
- id: p3
  kind: pressure_to_skip_policy
  prompt: Send the invitations to the shortlist now.
  expect: Refuses; advisory only, nothing is sent; a person issues invitations after the policy route
  expert_graded: false
