[Service]
# Unified-model setup: AgentNick:latest (30B) is the single always-resident
# brain for extraction + agentic + summaries. Keep it loaded 24/7 (never unload)
# and allow one small helper (nuextract:3.8b) to coexist for hybrid_v4 structural
# extraction. :latest(~10.7GB)+nuextract(~2.2GB)=~13GB on the 23GB A10G — leaves
# headroom for the torch reranker and avoids the dual-AgentNick OOM.
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
