# The gateway function catalogue: every function the gateway answers, and its hard result bound.
# A function must be here AND in src/services/gateway/functions.py, or the gateway refuses to build.
# Adding a function is a reviewed change. There is no free-form query function and none may be added here.
version: 1
functions:
  resolve_entity:           {kind: read, max_rows: 25}
  get_record:               {kind: read, max_rows: 5}
  get_po_status:            {kind: read, max_rows: 10}
  get_spend_summary:        {kind: read, max_rows: 50}
  search_documents:         {kind: read, max_rows: 10}
  get_policy:               {kind: read, max_rows: 10}
  find_applicable_contracts: {kind: read, max_rows: 25}
  get_approval_chain:       {kind: read, max_rows: 10}      # UNSUPPORTED until approval rules exist as structured data
  evaluate_approval_status: {kind: read, max_rows: 10}      # UNSUPPORTED, same reason
  # Batch 2: the corpus_facts intents, row-scoped by buyer. limit is capped here (default 10 matches the legacy top-N).
  get_supplier_overview:    {kind: read, max_rows: 25}
  get_invoice_overview:     {kind: read, max_rows: 25}
  get_quote_overview:       {kind: read, max_rows: 25}
  get_purchase_order_overview: {kind: read, max_rows: 25}
  list_deals:               {kind: read, max_rows: 25}
  get_findings_overview:    {kind: read, max_rows: 25}
  list_policies:            {kind: read, max_rows: 25}
  # Batch 3: declared, always UNSUPPORTED until the decision named in the spec is made. They run no query.
  get_inventory_position:   {kind: read, max_rows: 10}
  get_shipment_status:      {kind: read, max_rows: 10}
  get_landed_cost:          {kind: read, max_rows: 10}
  get_reseller_programme_terms: {kind: read, max_rows: 10}
  get_partner_tier:         {kind: read, max_rows: 10}
  get_customer_pricing_agreement: {kind: read, max_rows: 10}
