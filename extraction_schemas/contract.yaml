doc_type: contract
db_table: proc.bp_contracts
db_lines_table: null

fields:
  - name: contract_id
    type: string
    required: true
    db_column: contract_id
    canonical_labels:
      - "Contract Number"
      - "Contract No"
      - "Contract #"
      - "Agreement Number"
      - "Agreement No"
      - "Contract Reference"
      - "Contract ID"
      - "Reference Number"
      - "Ref No"
      - "Document Number"
      - "Agreement Reference"
    patterns:
      - name: anchored_contract_no
        anchor: '(?i)\bcontract\s*(?:number|no\.?|reference|ref\.?|#)\s*[:\-]\s*'
        value: '([A-Z][A-Z0-9\-\/\.]{2,30}|\d{4,12}[A-Z0-9\-\/\.]{0,20})'
        max_span_after_anchor_chars: 60
        prior_confidence: 0.92
      - name: anchored_agreement_no
        anchor: '(?i)\bagreement\s*(?:number|no\.?|reference|ref\.?|#)\s*[:\-]\s*'
        value: '([A-Z][A-Z0-9\-\/\.]{2,30}|\d{4,12}[A-Z0-9\-\/\.]{0,20})'
        max_span_after_anchor_chars: 60
        prior_confidence: 0.88
    extractors:
      - qwen_vlm
    judge:
      tiebreaker: true
      grounded_last_resort: true
      ner_type_check: "none"
    invariants: []

