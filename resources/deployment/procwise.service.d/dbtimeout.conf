[Service]
# Fail fast on DB connects when the database is down (psycopg2 floors this at 2s).
# Read by base_agent.get_db_connection and services/db.get_conn (code default 5).
Environment="DB_CONNECT_TIMEOUT=1"
# Margin for a DB-down (REDUCED-mode) boot to fast-fail all DB connects and bind
# its port (~24s observed). Default is 2min; this raises it so a slow boot is
# never killed mid-startup. Normal (DB up) boot is fast.
TimeoutStartSec=300
