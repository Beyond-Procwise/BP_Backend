  quality:
    - "The event matches the approved design line for line."
    - "No rule changes after open."
    - "Every bid is recorded with its time and bidder."
    - "Nothing is awarded; nothing is reported as run without the action's record."
  escalation: "Escalate to the category lead where a precondition fails or a rule problem appears after open, to compliance where a bidder's screening lapses, and to legal where a bidder disputes the record."
