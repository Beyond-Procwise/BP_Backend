- name: e-auction-execution
  status: dormant
  title: E-Auction Execution
  description: "Carry out an e-auction that has been designed and approved - confirm the design, the qualified bidders and the approval are on record, set the event up on the platform exactly as designed, open and close it on the published times, watch it for rule breaches, record every bid and the closing position, and hand the result to the award decision. Use when asked to set up, run, open or close an auction. Dormant until an auction tool exists; until then the skill prepares the set-up sheet for a person to run it. Not for the design (e-auction-design) or the award (award-recommendation)."
  purpose: "Run the event the bidders were promised: the published rules, the published times, every bid recorded, no change mid-event, and a closing record that the award can rest on. The skill runs the event through the platform's auction action when it exists; it never extends, reopens or edits an event on its own."
  use_when: "Use when the auction design is approved, the bidders are qualified, and the user asks to set it up, run it, open it, monitor it or close it."
  not_for: "Not for deciding whether to auction or how (e-auction-design), for the award after close (award-recommendation), for inviting bidders (supplier-selection) or for a negotiation (negotiation-planning)."
  inputs:
    - "The approved design: lots, format, starting price basis, decrement, duration, extension rule, award basis, from e-auction-design."
    - "The qualified bidders with screening status and their acceptance of the rules sheet."
    - "The approval for the event's value."
  tools:
    - "get_policy: for the auction rules (minimum bidders, disclosure, what may change after open, award basis)"
    - "check_policy: for the approval the event's value needs, as replied"
    - "screening_summary: for each bidder's screening; an unscreened bidder does not bid"
    - "supplier_lookup: for each bidder's record"
    - "build_xlsx: to produce the set-up sheet (lots, bidders, prices, times, rules) and, after close, the bid record"
    - "run_calculation: with `bids.normalise` to put bids on one basis and `deal.pct_change` for the movement from the starting price"
  unavailable:
    - "run_e_auction: the auction action does not exist yet; the skill prepares the set-up sheet exactly as designed and a person runs the event on the sourcing platform"
    - "send_message: bidders are not messaged by the skill; the auction action, when it exists, notifies them under the policy gate"
  workflow:
    - "Confirm the preconditions: the approved design, at least the policy's minimum of qualified, screened, independent bidders who accepted the rules sheet, and the approval as `tool:check_policy` replied; a missing precondition stops the set-up and is named first."
    - "Set up exactly as designed: lots, format, starting or ceiling price with its source, decrement, open and close times with the extension rule, award basis; produce the set-up sheet with `tool:build_xlsx` and have the user confirm it before anything opens."
    - "Open on the published time through the auction action; no change to any rule after open. A rule problem after open means pause and refer, never a quiet edit."
    - "Monitor: bids recorded as they land; a bid below the decrement or from an unqualified bidder flagged; extensions only as the published rule allows; no contact with a single bidder during the event."
    - "Close on the published time or extension; record the closing position per lot: every bid with time and bidder, the leading bid, the movement from the starting price via `deal.pct_change`, bids put on one basis via `bids.normalise` where the design allows."
    - "Hand the record to award-recommendation; the auction result is an input to the award, not the award. Keep the full bid record for `config.thresholds.record_retention_days` days at least."
  heuristics:
    - "The published rules are a promise; the event keeps every one of them."
    - "No change after open; a problem after open is a pause and a referral."
    - "Every bid is a record with a time; the leading bid is not the award."
    - "Talk to all bidders or none during the event."
  policy_hooks: "Auction rules come from `tool:get_policy` and are quoted; the approval comes from `tool:check_policy` as replied. The auction action runs under the agent-policy gate with the user's name; the skill never opens, extends, reopens or closes an event by any other route, never contacts a bidder, and never awards."
  outputs:
