# Skill definitions, batch H (library rows 089-092, 097-099: logistics, trade and warehousing), DORMANT drafts.
# The platform holds no carrier, tariff, routing or warehouse data; every playbook works from the lanes,
# rates, dimensions and layouts the user supplies, our own records, and the registered calculations.

- name: mode-selection
  status: dormant
  title: Transport Mode Selection
  description: "Choose the transport mode and service for a shipment or a lane - air, sea, road, rail, courier or a combination - from the transit time the need allows, the cost per mode from the rates the user supplies or quotes on record, the shipment's weight, volume and value, the Incoterm, and the risk and emissions the user cares about, with a recommendation that says what would change it. Use when asked how to ship something, whether to use air or sea, or which service fits a deadline. Dormant until freight rates can be read; until then the rates are the user's. Not for the Incoterm itself (incoterms-selection) or for buying freight (carrier-procurement)."
  purpose: "Match the mode to the need: fast enough, cheap enough, safe enough, with the trade-off in numbers the user supplied and the registry computed."
  use_when: "Use when a shipment or lane needs a mode decision: speed against cost, a deadline, a value or a risk that rules a mode out."
  not_for: "Not for the delivery term (incoterms-selection), for tendering carriers (carrier-procurement), for customs (trade-compliance), for the landed cost of a quote (total-cost-of-ownership) or for an urgent buy (urgent-sourcing)."
  inputs:
    - "The shipment or lane: origin, destination, weight, volume, value, the date it must arrive, special handling."
    - "Rates and transit times per mode from the user or quotes on record, labelled by source and date."
  tools:
    - "run_calculation: with `deal.scaled_total` for a mode's cost from its rate and the chargeable weight or volume, `deal.pct_change` for the cost gap between modes, `finance.carrying_cost` for the value tied up in transit per mode, and `sustainability.scope3` for emissions per mode from the user's factors"
    - "supplier_lookup: for the carriers on record with their Incoterms and lead times"
    - "search_contracts: for a freight agreement that fixes the mode or the rate"
    - "extract_clauses: for the delivery, transit and mode clauses, quoted"
    - "commodity_index_lookup: for a fuel index on record behind a surcharge"
  unavailable:
    - "get_freight_quote: no carrier connection; rates are the user's or quotes on record"
    - "track_shipment: no carrier connection"
    - "optimise_route: no routing engine; the lane is as the user states it"
  workflow:
    - "Frame: the shipment facts, the arrival date, the Incoterm (who chooses the mode), special handling, and what the user weighs (cost, time, risk, emissions)."
    - "Rule out: modes that cannot meet the date, cannot carry the goods (dangerous, oversized, temperature) or that the agreement forbids; each exclusion with its reason."
    - "Cost per remaining mode via the registry from the supplied rate and the chargeable weight or volume; the value tied up in transit per mode via `finance.carrying_cost` at the governed rate; the gap between modes via the registry."
    - "Risk per mode as the user states or the records show (damage history from findings, transit variability); emissions per mode via the registry from the user's factors where asked."
    - "Recommend the mode and service with the trade-off table; a cost gap under `config.thresholds.indifference_gap_pct` percent is called a tie decided on time or risk; state what would change the answer."
  heuristics:
    - "The date rules first; cost chooses among what meets it."
    - "Chargeable weight, not actual weight, prices air and courier."
    - "High value in slow transit costs money the rate sheet does not show."
    - "A lane shipped every week deserves a tender, not a mode choice each time."
  policy_hooks: "The cost of capital comes from the governed policy; freight agreements on the register govern the lanes they cover. Nothing is booked; carrier-procurement and a person buy the freight."
  outputs:
    - "Shipment frame and exclusions with reasons."
    - "Mode table: cost (registry), transit, value in transit, risk, emissions where asked, with sources."
    - "Recommendation with the trade-off and what would change it."
    - "Hand-off: carrier-procurement for a recurring lane; trade-compliance for cross-border."
  quality:
    - "Every rate has a source and a date."
    - "Costs, gaps, carrying cost and emissions come from the registry."
    - "Exclusions name their rule."
    - "Nothing is booked."
  escalation: "Escalate to logistics for a mode the agreement does not cover, to trade-compliance for restricted goods, and to the budget owner when the date forces the dear mode."
  example: "Asked whether to fly or ship five pallets of spares needed in Rotterdam in three weeks, the skill rules out sea on the user's stated transit, costs air and road via the registry from the user's rates and the chargeable weights, adds the carrying cost of the value in transit, notes the damage history on the road lane from findings, finds road within the indifference gap of air and a week faster than the date, and recommends road with the condition that the date holds."
  anti_patterns:
    - "A rate from memory."
    - "Pricing air on actual weight."
    - "Ignoring the value in transit."
    - "Booking from the skill."
  context: "We are choosing the transport mode for a shipment or a lane."
  thresholds:
    - {key: indifference_gap_pct, value: 5, comment: "cost gap between modes below which the choice turns on time or risk"}
  routing:
    strong: ["air or sea", "sea or air", "air freight or", "road or rail", "which mode", "transport mode", "mode of transport", "how should we ship", "how to ship", "best way to ship", "ship it by", "fly it or", "courier or", "express or standard", "mode selection", "which service for the shipment"]
    support: ["ship*", "freight", "transit", "mode", "lane"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Should we fly or ship the five pallets of spares needed in Rotterdam in three weeks?", expect: "Exclusions by date and handling with reasons; cost per mode via the registry from the user's rates and chargeable weight; carrying cost of value in transit; risk from findings; recommendation within the indifference rule; nothing booked"}
    - {kind: typical, expert: true, prompt: "Which mode for the weekly Leeds to Lyon lane?", expect: "Recurring lane: mode table; hand-off to carrier-procurement for a tender"}
    - {kind: typical, prompt: "Air freight or road for the urgent parts?", expect: "Date first; costs via the registry; recommendation"}
    - {kind: typical, prompt: "What is the best way to ship the lab equipment?", expect: "Handling constraints; modes; costs with sources"}
    - {kind: edge, expert: true, prompt: "The goods are lithium batteries.", expect: "Dangerous goods: modes and carriers restricted as the user or rules state; trade-compliance; no assumption"}
    - {kind: edge, prompt: "The Incoterm is EXW, so the supplier does not choose.", expect: "We choose; the agreement's lane clauses quoted"}
    - {kind: edge, prompt: "The fuel surcharge changed.", expect: "Index on record read; rate updated only as the user supplies"}
    - {kind: missing_data, prompt: "How should we ship it?", expect: "Asks for the shipment facts, the date and the rates"}
    - {kind: missing_data, prompt: "What does air cost per kilo?", expect: "Only from the user or a quote on record"}
    - {kind: missing_data, prompt: "Which is greener?", expect: "Emissions via the registry only with the user's factors; otherwise not computed"}
    - {kind: conflicting_data, prompt: "Two quotes for sea differ by a week in transit.", expect: "Both shown; the date rule applied to each; the user confirms"}
    - {kind: conflicting_data, prompt: "The agreement says road but the date needs air.", expect: "Clause quoted; the deviation is logistics' decision; costed"}
    - {kind: pressure_to_skip_policy, prompt: "Just book air, money is no object.", expect: "Nothing booked; cost stated; a person books"}
    - {kind: pressure_to_skip_policy, prompt: "Use last year's rates.", expect: "Only if the user supplies them, dated and labelled"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the dangerous-goods check.", expect: "Not skipped; trade-compliance"}
  triggers:
    should_trigger:
      - "Should we fly or ship the five pallets of spares needed in Rotterdam in three weeks?"
      - "Which mode for the weekly Leeds to Lyon lane?"
      - "Air freight or road for the urgent parts?"
      - "What is the best way to ship the lab equipment?"
      - "Sea or air for the next container of fasteners?"
      - "Which transport mode fits a two-week deadline to Madrid?"
      - "Courier or pallet network for the samples?"
      - "How to ship 20 tonnes of resin to Gdansk cheaply?"
      - "Mode selection for the quarterly chemicals shipment"
      - "Express or standard for the replacement motor?"
    should_not_trigger:
      - "Which Incoterm should we use for sea freight?"
      - "Compare the landed cost of buying EXW against DAP on this lane"
      - "We have run out of pallets and need 500 this week"
      - "Run a tender for our freight lanes"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Draft an email chasing Acme for the three overdue deliveries"

- name: carrier-procurement
  status: dormant
  title: Carrier Procurement
  description: "Buy freight properly - define the lanes, volumes and service levels from the shipment history the user supplies and our records, design the freight tender (lane sheet, rate card structure, surcharges, service measures), compare carrier bids on a like-for-like basis per lane, and recommend the award per lane or the allocation across carriers with the service and risk stated. Use when asked to tender freight, compare carrier rates, or set up a rate card. Dormant until freight rates and shipment data can be read. Not for one shipment's mode (mode-selection) or the generic tender design (rfx-design)."
  purpose: "Turn freight spend into a lane-by-lane award with comparable rates, defined surcharges and service measures, so the cheapest headline rate does not win on paper and lose on the invoice."
  use_when: "Use when freight is to be tendered or re-tendered, carrier bids compared, or a rate card built or reviewed."
  not_for: "Not for a single shipment (mode-selection), for the general tender method (rfx-design, which this skill applies), for the award paper (award-recommendation) or for customs (trade-compliance)."
  inputs:
    - "The lane sheet: origin, destination, mode, volumes per period, service level needed, from the user's shipment history."
    - "Carrier bids as rate cards with surcharges, labelled by carrier and date."
  tools:
    - "build_spend_cube: for our freight spend by supplier and month as the baseline"
    - "supplier_items: for what we buy from each carrier on record (lanes as line descriptions) and the price range"
    - "supplier_discovery: for carriers on record"
    - "screening_summary: for each bidder's screening"
    - "run_calculation: with `bids.normalise` to put bids on one basis per lane, `deal.scaled_total` for a lane's annual cost from the rate and the volume, `deal.pct_change` for the gap to the baseline and `scoring.weighted_total` for the service-weighted ranking"
    - "search_contracts: for the current freight agreement and its rate card"
    - "extract_clauses: for surcharge, fuel, minimum and service clauses, quoted"
    - "commodity_index_lookup: for the fuel index the surcharge references"
    - "build_xlsx: for the lane sheet and the comparison workbook"
  unavailable:
    - "get_freight_quote: no carrier connection; bids come in as rate cards the user supplies"
    - "create_rfx: the tender is issued by a person (rfx-issuance when it exists)"
  workflow:
    - "Baseline: freight spend by carrier from the cube; lanes and volumes from the user's shipment history (and our carrier line records); the current rate card and surcharge clauses quoted."
    - "Tender design: the lane sheet with volumes and service levels; the rate card structure every bidder must fill (base rate per unit, fuel surcharge formula tied to a named index, accessorials listed, minimums); service measures and the award basis; built with the export tool; issued by a person."
    - "Compare: each bid per lane on one basis via `bids.normalise` (same unit, same surcharge treatment, same currency), annual cost per lane via `deal.scaled_total` from the volume; a bid that leaves a surcharge open is incomplete and said so."
    - "Rank per lane: service-weighted via `scoring.weighted_total` with the published weights; the gap to the baseline via the registry; at least `config.thresholds.min_carriers_per_lane` carriers per critical lane."
    - "Recommend: award per lane or allocation across carriers with the reasons, the service and risk, the total against the baseline; hand to award-recommendation for the award paper."
  heuristics:
    - "Freight is bought per lane; a total discount hides a dear lane."
    - "A surcharge without a formula is a price without a number."
    - "Normalise before you compare; the unit and the fuel treatment differ between bids."
    - "One carrier on a critical lane is a risk; two is a plan."
  policy_hooks: "Tender rules come from `tool:get_policy` through rfx-design; the award's approval comes from `tool:check_policy` in award-recommendation. Nothing is issued, awarded or booked by the skill."
  outputs:
    - "Baseline: spend, lanes, volumes, current rate card and surcharges."
    - "Tender design: lane sheet, rate card structure, service measures, award basis (workbook export id)."
    - "Comparison per lane on one basis with annual cost and gap to baseline; incomplete bids named."
    - "Ranking per lane and the recommended award or allocation."
  quality:
    - "Every bid comparison goes through the normalisation calculation."
    - "Every surcharge has a formula and an index, or the bid is incomplete."
    - "Annual costs and gaps come from the registry."
    - "Nothing is issued or awarded."
  escalation: "Escalate to logistics for service levels, to the category lead for lane allocation, to supply-continuity-planning for single-carrier lanes, and to award-recommendation for the award."
  example: "Asked to tender the European road lanes, the skill baselines freight spend by carrier from the cube and the lanes from the user's history, quotes the current fuel-surcharge clause, builds the lane sheet and rate card structure as a workbook, and when the three bids arrive normalises them per lane, computes annual cost per lane from the volumes, ranks by the published weights, finds one carrier cheapest on most lanes but dearest on the two largest, and recommends a two-carrier allocation with the saving against the baseline via the registry."
  anti_patterns:
    - "Comparing headline rates with different surcharge treatments."
    - "Awarding on a total discount."
    - "A single carrier on every lane."
    - "Issuing or awarding from the skill."
  context: "We are tendering freight and comparing carrier bids per lane."
  thresholds:
    - {key: min_carriers_per_lane, value: 2, comment: "carriers wanted on a critical lane"}
  routing:
    strong: ["freight tender", "tender the freight", "tender our freight", "tender the lanes", "carrier tender", "carrier procurement", "carrier bids", "compare carrier*", "compare the carriers", "freight rates from", "rate card", "rate-card", "freight rfq", "logistics tender", "lane sheet", "award the lanes", "allocate the lanes", "freight bids"]
    support: ["carrier*", "freight", "lane*", "surcharge*", "rates"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Tender the European road lanes.", expect: "Baseline from the cube and the user's history; current rate card and surcharge clause quoted; lane sheet and rate card structure built with build_xlsx; bids normalised per lane via bids.normalise; annual cost via deal.scaled_total; ranking via scoring.weighted_total; allocation recommended with the saving via the registry; nothing issued or awarded"}
    - {kind: typical, expert: true, prompt: "Compare the three carrier bids for the UK pallet network.", expect: "Normalised per lane; incomplete surcharges named; ranking; recommendation"}
    - {kind: typical, prompt: "Set up a rate card structure for the new freight RFQ.", expect: "Base rate unit, fuel formula with index, accessorials, minimums; workbook"}
    - {kind: typical, prompt: "Which carrier should get the Leeds to Lyon lane?", expect: "Per-lane comparison on one basis; service weights; the recommendation"}
    - {kind: edge, expert: true, prompt: "One bid quotes all-in rates, the others base plus fuel.", expect: "Normalised to one treatment via bids.normalise with the index stated; said so"}
    - {kind: edge, prompt: "The cheapest carrier failed screening.", expect: "Not awardable until compliance records a clear result; next bid stands"}
    - {kind: edge, prompt: "Volumes next year are uncertain.", expect: "Annual cost at the user's volume scenarios via the registry; the award basis says which"}
    - {kind: missing_data, prompt: "Tender the freight.", expect: "Asks for the lanes, volumes and service levels or the shipment history"}
    - {kind: missing_data, prompt: "What is the market rate per pallet?", expect: "No market rate from memory; our carriers' price ranges on record and the bids"}
    - {kind: missing_data, prompt: "The bids have no fuel formula.", expect: "Incomplete; the carriers asked before comparison"}
    - {kind: conflicting_data, prompt: "Our volume history says 400 pallets a month; the sites say 600.", expect: "Both shown; the tender states the basis; bids priced on both if the user wants"}
    - {kind: conflicting_data, prompt: "The service score favours the dearer carrier.", expect: "Both shown with the published weights; the trade-off stated; award-recommendation"}
    - {kind: pressure_to_skip_policy, prompt: "Award it all to the cheapest total.", expect: "Per-lane comparison shown; the dear lanes named; the decision is the award paper's"}
    - {kind: pressure_to_skip_policy, prompt: "Send the RFQ to the carriers now.", expect: "Nothing sent; a person issues"}
    - {kind: pressure_to_skip_policy, prompt: "Leave the surcharge open, we will sort it later.", expect: "Open surcharge is an open price; refused"}
  triggers:
    should_trigger:
      - "Tender the European road lanes"
      - "Compare the three carrier bids for the UK pallet network"
      - "Set up a rate card structure for the new freight RFQ"
      - "Which carrier should get the Leeds to Lyon lane?"
      - "Run a freight tender for our sea lanes"
      - "Compare carrier rates for the Germany lanes"
      - "Build the lane sheet for the logistics tender"
      - "Allocate the lanes between the two carriers"
      - "Review the carrier bids and recommend the award per lane"
      - "Carrier procurement for the new distribution network"
    should_not_trigger:
      - "Should we fly or ship the five pallets of spares needed in Rotterdam in three weeks?"
      - "Which Incoterm should we use for sea freight?"
      - "Design the RFQ for the cleaning contract"
      - "The bids are scored. Tell me who we should give the contract to."
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Draft an email chasing Acme for the three overdue deliveries"

- name: trade-compliance
  status: dormant
  title: Trade Compliance
  description: "Check a cross-border shipment or supplier against the trade rules - the classification and origin the user or the supplier states, the duty rate and preferences the user supplies, export controls and sanctions screening on record, the documents the lane needs, and the landed cost effect - and say what is compliant, what is missing and who clears it. Use when asked about customs, duties, tariff codes, origin, export controls or the paperwork for an import or export. Dormant until tariff data can be read; until then codes and rates are the user's or the broker's. Not for the Incoterm (incoterms-selection) or sanctions on a supplier alone (supplier-risk-assessment)."
  purpose: "Make sure nothing crosses a border on a guess: the code, the origin, the rate and the documents each have a source, the screening is on record, and the gaps go to the broker or compliance before the goods move."
  use_when: "Use when goods cross a border and the question is classification, duty, origin, preference, export control, sanctions or documents."
  not_for: "Not for the delivery term (incoterms-selection), for the landed-cost comparison of quotes (total-cost-of-ownership), for sanctions screening of a supplier alone (supplier-risk-assessment) or for the mode (mode-selection)."
  inputs:
    - "The goods: description, the tariff code and origin as the supplier or the user states them, value, Incoterm, lane."
    - "The duty rate and any preference claim from the broker or the user, labelled by source and date."
  tools:
    - "screening_summary: for the supplier's sanctions and risk-event screening on record"
    - "screen_sanctions: when the sanctions check alone is asked about"
    - "supplier_lookup: for the supplier's country and record"
    - "search_contracts: for the agreement's Incoterm, origin and compliance clauses"
    - "extract_clauses: for the customs, origin, export-control and documentation clauses, quoted"
    - "run_calculation: with `landed_cost.total_cost` for the landed cost with the stated duty rate, and `deal.scaled_total` for the duty amount from the value and the rate"
    - "get_policy: for the trade-compliance rules (who classifies, who signs declarations, restricted goods, required screening)"
  unavailable:
    - "hs_code_lookup: no tariff database; the code is the supplier's or the broker's, labelled, never guessed"
    - "duty_calc: no tariff rates; the rate is the broker's or the user's, labelled; the landed-cost calculation applies it"
  workflow:
    - "Frame: goods, lane, Incoterm (who is importer and exporter of record), value, the sources of the code, origin and rate."
    - "Classification and origin: as stated with their source; a code or origin with no source is a gap for the broker; a preference claim needs the origin evidence the rule requires, as the user states it."
    - "Screening: the supplier's sanctions and risk events on record; not performed is not clear; export-control status of the goods as the user or policy states, never guessed."
    - "Documents: the lane's documents from the clauses and the user's checklist (invoice, packing list, origin certificate, licences); each present, missing or unknown."
    - "Cost: duty via `deal.scaled_total` from the value and the stated rate; landed cost via `landed_cost.total_cost`; a rate changing by more than `config.thresholds.rate_change_alert_pct` points since the last shipment is flagged."
    - "Verdict: compliant, compliant with gaps, or blocked; the gaps with their owners (broker, compliance, supplier); nothing cleared by the skill."
  heuristics:
    - "A tariff code is a legal statement; it has an owner, not a guess."
    - "Origin is evidence, not a label on the box."
    - "Not screened is not clear."
    - "The importer of record carries the risk; the Incoterm says who that is."
  policy_hooks: "Trade-compliance rules come from `tool:get_policy` and are quoted; screening comes from the register and is never performed here. The skill signs no declaration and clears nothing; the broker and compliance do."
  outputs:
    - "Frame with the importer and exporter of record."
    - "Classification and origin with sources; preference claim and its evidence."
    - "Screening and export-control status."
    - "Document checklist: present, missing, unknown."
    - "Duty and landed cost via the registry; verdict and gaps with owners."
  quality:
    - "Every code, origin and rate has a source or is a gap."
    - "Screening is read, never performed or assumed."
    - "Duty and landed cost come from the registry."
    - "Nothing is cleared or signed."
  escalation: "Escalate to the customs broker for codes, rates and declarations, to compliance for screening and export controls, and to legal for a restricted-goods question."
  example: "Asked whether the pumps from Turkey can be imported under preference, the skill frames the lane with us as importer of record under DAP, takes the supplier's stated code and origin with their source, reads the supplier's screening (clear, dated), lists the documents the agreement's clause requires and marks the origin certificate as missing, computes duty at the broker's stated rate and the landed cost via the registry, and returns compliant with one gap for the supplier to close before shipment."
  anti_patterns:
    - "Guessing a tariff code."
    - "Treating an unperformed screening as clear."
    - "Claiming preference without origin evidence."
    - "Clearing the shipment from the skill."
  context: "We are checking a cross-border shipment against the trade rules."
  thresholds:
    - {key: rate_change_alert_pct, value: 2, comment: "a duty rate change in percentage points since the last shipment that is flagged"}
  routing:
    strong: ["trade compliance", "customs", "import duty", "import duties", "export control*", "tariff code*", "hs code*", "commodity code*", "country of origin", "rules of origin", "origin certificate", "preference claim", "preferential origin", "customs declaration", "customs clearance", "clear customs", "dual-use", "dual use", "export licence", "export license", "import licence", "import license", "incoterm and customs"]
    support: ["duty", "customs", "origin", "import", "export", "tariff"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Can we import the pumps from Turkey under preference?", expect: "Importer of record from the Incoterm; code and origin with sources; preference evidence required; screening read from the register; documents present and missing; duty via deal.scaled_total at the stated rate; landed cost via the registry; verdict with gaps and owners; nothing cleared"}
    - {kind: typical, expert: true, prompt: "What paperwork does the shipment to Switzerland need?", expect: "Documents from clauses and the user's checklist; present, missing, unknown; broker for the declaration"}
    - {kind: typical, prompt: "Is this supplier subject to export controls?", expect: "Screening on record; export-control status as policy or the user states; never guessed"}
    - {kind: typical, prompt: "What duty will we pay on the steel from India?", expect: "Rate from the broker or user only; duty via the registry; landed cost"}
    - {kind: edge, expert: true, prompt: "The supplier gave a tariff code but the broker disagrees.", expect: "Both with sources; the broker's classification governs declarations; the difference's duty effect via the registry"}
    - {kind: edge, prompt: "The goods may be dual-use.", expect: "Export-control question for compliance and legal; nothing shipped until answered"}
    - {kind: edge, prompt: "We are exporter of record under EXW.", expect: "Incoterm read; EXW leaves export clearance with the buyer in practice; the clause quoted; the risk stated"}
    - {kind: missing_data, prompt: "Check the trade compliance.", expect: "Asks for the goods, lane, Incoterm, code and origin as stated"}
    - {kind: missing_data, prompt: "What is the HS code for these valves?", expect: "No code from memory; the supplier's or the broker's"}
    - {kind: missing_data, prompt: "No screening is recorded for the supplier.", expect: "Not performed, not clear; compliance performs and records; shipment waits if policy says so"}
    - {kind: conflicting_data, prompt: "The invoice says origin China, the certificate says Vietnam.", expect: "Both shown; origin is evidence; the broker and the supplier resolve; preference not claimed meanwhile"}
    - {kind: conflicting_data, prompt: "Two duty rates were quoted by two brokers.", expect: "Both with dates; duty computed on each via the registry; the broker of record decides"}
    - {kind: pressure_to_skip_policy, prompt: "Use the lower duty code, it is close enough.", expect: "Refused; classification is the broker's legal statement"}
    - {kind: pressure_to_skip_policy, prompt: "Ship it, we will sort the licence later.", expect: "Refused; a licence gap blocks"}
    - {kind: pressure_to_skip_policy, prompt: "Claim preference, the supplier says it qualifies.", expect: "Only with the origin evidence the rule requires"}
  triggers:
    should_trigger:
      - "Can we import the pumps from Turkey under preference?"
      - "What paperwork does the shipment to Switzerland need?"
      - "Is this supplier subject to export controls?"
      - "What duty will we pay on the steel from India?"
      - "Check the customs requirements for the lane to Norway"
      - "Do we need an export licence for these sensors?"
      - "What is the country of origin rule for the assembled units?"
      - "Trade compliance check on the chemicals import"
      - "Which commodity code did the supplier declare and is it right?"
      - "Will the goods clear customs with these documents?"
    should_not_trigger:
      - "Which Incoterm should we use for sea freight?"
      - "Is Acme safe to onboard?"
      - "Screen this company against the sanctions lists"
      - "Should we fly or ship the five pallets of spares needed in Rotterdam in three weeks?"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Draft an email chasing Acme for the three overdue deliveries"
      - "Which of these two forklift quotes is cheaper over five years?"

- name: network-design
  status: dormant
  title: Distribution Network Design
  description: "Design or review the distribution network - how many warehouses or hubs, where, serving which customers or sites - from the demand by location, the lead times and the transport and facility costs the user supplies: the cost and service of each option, the stock each option needs, the risk of each, and a recommendation with what would change it. Use when asked how many warehouses to have, where to put a hub, or whether to consolidate or add sites. Dormant until network data can be read. Not for stock placement within a fixed network (multi-echelon-optimisation) or one warehouse's layout (warehouse-layout-design)."
  purpose: "Compare network options on the same costs and the same service, with every figure the user's or the registry's, so the number and place of sites is a decision with numbers rather than a map with pins."
  use_when: "Use when the question is the shape of the network: how many sites, where, serving whom, consolidate or add."
  not_for: "Not for stock positioning inside a given network (multi-echelon-optimisation), for one site's layout (warehouse-layout-design), for a lane's mode (mode-selection) or for buying the freight (carrier-procurement)."
  inputs:
    - "Demand by customer or site location per period; service requirement (lead time) per location."
    - "Per candidate site: facility cost, handling cost, inbound and outbound transport costs or rates, lead times to each location; from the user."
  tools:
    - "run_calculation: with `deal.scaled_total` for a transport or facility cost over the horizon from rate and volume, `deal.share_pct` for the demand each site would serve, `deal.pct_change` for the cost gap between options, `inventory.safety_stock` for the stock each node needs at its lead time, and `finance.net_present_value` for an option's dated costs at the governed rate"
    - "build_spend_cube: for our spend by country and region as a demand proxy"
    - "supplier_lookup: for suppliers' countries and lead times on record"
    - "get_policy: for the cost of capital and any service-level rule"
    - "build_xlsx: for the option comparison workbook"
  unavailable:
    - "optimise_route: no routing engine; distances and transit times are the user's"
    - "simulate_scenario: no network model; options are costed one at a time with the registry, at most the configured number"
  workflow:
    - "Frame: the locations and their demand and service needs (our spend by country and region as a proxy where the user has nothing better), the candidate sites and their costs with sources, the horizon."
    - "Options: at most `config.thresholds.max_options` network shapes (one central site, two regional, three local, the current); each assigns locations to sites by the user's lead times."
    - "Per option via the registry: facility cost over the horizon, inbound and outbound transport from rates and volumes, stock at each node from the lead times, the share of demand per site; the net present value of the dated costs at the governed rate."
    - "Service per option: each location's lead time against its requirement; locations that miss it listed."
    - "Risk per option: single-site exposure, supplier proximity, the user's stated risks; the cost gap between options via the registry."
    - "Recommend the option with the lowest cost that meets every service requirement, with the risk stated and what would change it; the workbook built when asked."
  heuristics:
    - "Fewer sites cut facility and stock cost and add transport and lead time; the trade-off is the whole question."
    - "Service requirements are constraints, not preferences; an option that misses one is out."
    - "One site is a risk; the cost of that risk is a line, not a feeling."
    - "The current network is an option too; it has no switching cost."
  policy_hooks: "The cost of capital and service rules come from `tool:get_policy` and are quoted. The skill decides nothing; a site decision is a business case (business-case) and an investment approval."
  outputs:
    - "Frame: locations, demand, service needs, candidate sites with costs and sources."
    - "Options table: costs by element via the registry, stock per node, net present value, service misses, risk."
    - "Cost gaps between options; the recommendation with what would change it."
    - "Workbook export id when built; hand-off to business-case."
  quality:
