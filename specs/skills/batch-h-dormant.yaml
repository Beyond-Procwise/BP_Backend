    - "Frame: the period, the activities, the volumes per period and activity as supplied, the productivity rates with their source and date, the roster, the absence rate, the rules."
    - "Hours per activity per period via the registry from volume and hours per unit; total hours; heads per shift from hours and shift length with absence added as the user's rate; each figure's inputs shown."
