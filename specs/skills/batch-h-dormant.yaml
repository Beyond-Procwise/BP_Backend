  example: "Asked to lay out the new spares warehouse, the skill classifies the two thousand items by picks via the registry, finds a small class carrying most picks, assigns shelving near dispatch for them and pallet racking behind for the bulk, computes the locations each class needs from the user's stock and footprints, finds the building at a utilisation above the flag at policy stock levels, draws the flow from the receiving door through quarantine, storage and picking to dispatch, states the golden-zone and family slotting principles, and flags the congestion for operations and inventory-policy-setting."
