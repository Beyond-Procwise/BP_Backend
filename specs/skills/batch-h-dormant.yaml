- name: warehouse-layout-design
  status: dormant
  title: Warehouse Layout Design
  description: "Design or review a warehouse layout - the zones (receiving, storage by velocity, picking, packing, dispatch, returns), the storage modes per item class, the flow between zones, the capacity in pallets or locations against the stock the user holds, and the pick-path and slotting principles - from the volumes, SKU profile, dimensions and equipment the user supplies. Use when asked how to lay out a warehouse, where to put fast movers, or whether the space fits the stock. Dormant until warehouse data can be read. Not for the network (network-design) or staffing (labour-planning)."
  purpose: "Give the site a layout that fits its flow and its stock: fast movers near dispatch, storage modes matched to item classes, capacity checked in numbers, and the principles a slotting tool would later apply."
  use_when: "Use when a warehouse is being set up, re-laid out or checked for capacity and flow."
  not_for: "Not for how many warehouses (network-design), for staffing the shifts (labour-planning), for stock policy (inventory-policy-setting) or for returns handling rules (returns-reverse-logistics)."
  inputs:
    - "The building: floor area, clear height, doors, columns, from the user."
    - "The SKU profile: items with dimensions, weight, velocity (picks and units per period), storage needs; stock on hand or the policy's stock; from the user."
    - "Equipment and handling constraints."
  tools:
    - "run_calculation: with `inventory.abc_xyz` for velocity classes from the user's pick series, `deal.scaled_total` for locations or pallet positions needed per class from stock and footprint, and `deal.share_pct` for each class's share of picks and of space"
    - "supplier_items: for our order quantities per item as a velocity proxy where the user has no pick data"
    - "get_policy: for safety, segregation and storage rules if governed"
    - "render_chart: for a share-of-picks or share-of-space chart when asked"
  unavailable:
    - "query_wms: no warehouse connection; stock and picks are the user's"
    - "optimise_slotting: no slotting engine; slotting principles are stated per class, not computed per location"
    - "optimise_pick_path: no pick-path engine; the path principle is stated"
  workflow:
    - "Frame: the building, the SKU profile, the stock, the flow (inbound to outbound), the constraints (safety, segregation, temperature) from policy or the user."
    - "Classify velocity via `inventory.abc_xyz` from the pick series (or our order quantities as a proxy, labelled); share of picks per class via the registry."
    - "Storage mode per class: pallet racking, shelving, flow rack, floor stack, by dimensions, weight and velocity; locations needed per class via the registry from stock and footprint; total against the building's capacity; a utilisation above `config.thresholds.max_utilisation_pct` percent is flagged as congested."
    - "Zones and flow: receiving and dispatch placement by doors, picking near dispatch, fast movers closest, bulk storage behind, returns and quarantine segregated; the flow drawn as a sequence."
    - "Slotting and pick-path principles per class (golden zone for A, ergonomics for heavy, families together); stated for the WMS to apply."
    - "Output the layout description, the capacity table, the flagged constraints, and the chart when asked."
  heuristics:
    - "Picks drive layout; pallets drive capacity."
    - "The golden zone (waist to shoulder) is for the fastest movers, not the biggest."
    - "Receiving and dispatch should not share a door unless the volume is tiny."
    - "Above the utilisation flag, every move costs two."
  policy_hooks: "Safety, segregation and storage rules come from `tool:get_policy` and are quoted. The skill designs on paper; nothing is slotted, moved or built."
  outputs:
