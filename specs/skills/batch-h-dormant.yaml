  tools:
    - "run_calculation: with `finance.average_per_period` for the rate per hour from a period's units and hours, `deal.scaled_total` for hours needed from volume and the inverse rate (hours per unit the user states), heads from hours and shift length, and cost from hours and rate, `deal.pct_change` for the gap to the roster and `deal.share_pct` for an activity's share of hours"
    - "get_policy: for working-time, overtime and temporary-labour rules if governed"
    - "build_xlsx: for the staffing plan workbook"
  unavailable:
    - "query_wms: no warehouse connection; volumes and productivity are the user's"
    - "statistical_forecast: no planning engine; the volume forecast is the user's (or forecast.exponential_smoothing on a series they supply, through run_calculation)"
