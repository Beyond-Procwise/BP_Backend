    - "Every location's service is checked per option."
    - "The current network is costed as an option."
    - "Nothing is decided."
  escalation: "Escalate to logistics for lead times and rates, to finance for facility costs and the rate, to supply-continuity-planning for single-site risk, and to business-case for the investment decision."
  example: "Asked whether two regional warehouses would beat the single central one, the skill takes demand by region from the user (with our spend by region as a check), costs both options via the registry from the user's facility, handling and transport figures, computes the stock each node needs at its lead time, finds the two-site option dearer on facilities but cheaper on outbound transport and stock with a net present value a stated share lower, checks that every region meets its lead time under both, and recommends two sites with the single-site risk stated and the switching cost as the user gives it."
