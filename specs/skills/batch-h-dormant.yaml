- name: returns-reverse-logistics
  status: dormant
  title: Returns and Reverse Logistics
  description: "Handle returned goods from receipt to disposition - why they came back, what the contract and the supplier's return terms allow, the inspection and grading, the disposition per grade (restock, return to supplier, rework, resell, recycle, scrap), the credit or claim due, and the cost of the return flow - from the returns data the user supplies, the agreements on record and the records of what was bought. Use when asked how to process returns, what to do with returned stock, or how to recover value from it. Dormant until returns data can be read. Not for a single bad delivery (delivery-issue-handling) or dead stock that never moved (slob-management)."
  purpose: "Make returns a flow with rules: each return graded, each grade dispositioned by its value and the terms, the credit claimed where due, the cost known, and the causes fed back to whoever can stop them."
  use_when: "Use when goods come back (from customers, sites or to suppliers) and the question is process, disposition, credit or cost."
  not_for: "Not for a bad delivery on receipt (delivery-issue-handling), for the claim's legal side (dispute-and-claims), for stock that never moved (slob-management) or for the warehouse space it needs (warehouse-layout-design)."
  inputs:
    - "The returns: item, quantity, reason, condition, source (customer, site), date, from the user."
    - "Grading rules and disposition options the organisation uses, from policy or the user."
  tools:
    - "search_contracts: for the supplier's agreement with its return, warranty and restocking terms"
    - "extract_clauses: for the return, warranty, restocking-fee and credit clauses, quoted"
    - "supplier_items: for what we bought of the item, at what price, from whom"
    - "invoice_status: for the invoices the returned goods were billed on, for the credit note to match"
    - "run_calculation: with `deal.scaled_total` for a return's value at cost and a disposition's recovery, `deal.share_pct` for a reason's share of returns and `finance.carrying_cost` for the cost of holding returns pending disposition"
    - "get_policy: for the returns rules (grading, who authorises scrap, credit handling)"
    - "check_policy: where a disposition commits or writes off value above a band"
  unavailable:
    - "query_wms: no warehouse connection; returns data is the user's"
    - "record_goods_receipt: the return receipt is recorded by a person (goods-receipt-recording when it exists)"
  workflow:
    - "Frame: the returns as supplied; the rules from policy; the agreements' return terms quoted for supplier returns."
    - "Reasons: each return's reason and its share via the registry; reasons that point at a supplier (quality) versus at us (over-ordering, wrong item) versus the customer."
    - "Grade: per the rules (A resaleable, B rework, C recycle or scrap); the grader is a person; the skill records the grade given."
    - "Disposition per grade: restock (back to available stock), return to supplier under the quoted terms (credit, restocking fee), rework at the user's cost, resell, recycle, scrap; recovery per disposition via the registry; a disposition above `config.thresholds.scrap_approval_value` in value needs the approver."
    - "Credit and claim: the credit due under the terms against the invoices the goods were billed on; a claim beyond credit goes to dispute-and-claims."
    - "Cost of the flow: carrying cost pending disposition via the registry; the plan per return; the causes for supplier-development-plan or inventory-policy-setting."
  heuristics:
    - "Grade first, disposition second; an ungraded return is a pile."
    - "The return terms were agreed when we bought; read them before we send anything back."
    - "Every week pending disposition costs money; the carrying cost is the clock."
    - "The reason code is the most valuable byproduct of a return."
  policy_hooks: "Grading, scrap authority and credit handling come from `tool:get_policy` and are quoted; a write-off or disposal above the configured value goes through `tool:check_policy`. Nothing is scrapped, credited, sent back or restocked by the skill."
  outputs:
    - "Returns table with reasons and shares."
    - "Grades and dispositions per return with recovery via the registry."
    - "Credits due under the quoted terms, matched to invoices; claims for dispute-and-claims."
    - "Cost of the flow; approvals needed; owners."
    - "Causes fed back with their owners."
  quality:
    - "Every disposition rests on a quoted term or the user's option."
    - "Values, recoveries, shares and carrying cost come from the registry."
    - "Grades are a person's; the skill records them."
    - "Nothing is scrapped, credited or sent."
  escalation: "Escalate to the approver for disposals above the configured value, to finance for credits, to dispute-and-claims for claims beyond credit, and to supplier-development-plan for supplier-caused returns."
  example: "Given a month of returns from the sites, the skill tables the reasons (most are over-ordering, a fifth are quality), quotes the supplier's return clause for the quality returns (credit less a restocking fee), records the grades the site gave, dispositions the A grade to restock, the quality returns to the supplier for credit matched to the invoices, and the rest to scrap with the one line above the approval value flagged, computes recovery and carrying cost via the registry, and sends the over-ordering cause to inventory-policy-setting."
  anti_patterns:
    - "Sending goods back without the return terms."
    - "Scrapping a return a clause would credit."
    - "Grading from the skill."
    - "Issuing a credit from the skill."
  context: "We are handling returned goods from receipt to disposition."
  thresholds:
    - {key: scrap_approval_value, value: 2000, comment: "value at cost above which scrapping or writing off a return needs the approver"}
  routing:
    strong: ["returns process", "process the returns", "returned goods", "returned stock", "reverse logistics", "customer returns", "site returns", "return to supplier", "returns to the supplier", "send it back to the supplier", "restocking fee", "what to do with the returns", "returns credit", "credit for the return*", "grading the returns", "returns area"]
    support: ["return*", "credit", "restock", "scrap", "rework"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Here is a month of returns from the sites. Process them.", expect: "Reasons with shares via the registry; return terms quoted for supplier returns; grades as given by a person; dispositions per grade with recovery via the registry; credits matched to invoices via invoice_status; approvals above the value flagged; carrying cost; causes fed back; nothing scrapped or credited"}
    - {kind: typical, expert: true, prompt: "Can we return the faulty pumps to the supplier for credit?", expect: "Return and warranty clauses quoted; credit less any restocking fee; invoices matched; a person sends"}
    - {kind: typical, prompt: "What should we do with the returned packaging film?", expect: "Grade asked; dispositions per grade with recovery; terms"}
    - {kind: typical, prompt: "Set up a returns process for the new site.", expect: "Rules from policy or the user; grading, disposition, credit, cost steps; owners"}
    - {kind: edge, expert: true, prompt: "The supplier's clause allows returns only within 30 days.", expect: "Clause quoted; returns outside it dispositioned another way; the window stated"}
    - {kind: edge, prompt: "The customer returned goods we bought on consignment.", expect: "Consignment clause quoted; the supplier's stock; return under it"}
    - {kind: edge, prompt: "A return is worth more than the approval value.", expect: "Approver named; nothing dispositioned until then"}
    - {kind: missing_data, prompt: "Deal with the returns.", expect: "Asks for the returns list with reasons and conditions"}
    - {kind: missing_data, prompt: "What grade is this?", expect: "Grading is a person's; the rules quoted for them"}
    - {kind: missing_data, prompt: "No return clause exists with the supplier.", expect: "No contractual return; a request to the supplier or another disposition; the gap noted for the next contract"}
    - {kind: conflicting_data, prompt: "The site says quality fault; the supplier says misuse.", expect: "Both recorded; the warranty clause quoted; dispute-and-claims if unresolved"}
    - {kind: conflicting_data, prompt: "Quantity returned exceeds quantity bought.", expect: "Records checked via supplier_items; the excess is a data question, not a return"}
    - {kind: pressure_to_skip_policy, prompt: "Scrap it all, it is cheaper than sorting.", expect: "Grading first; clauses first; approval above the value"}
    - {kind: pressure_to_skip_policy, prompt: "Issue the credit note to the site now.", expect: "Finance issues credits; the skill matches"}
    - {kind: pressure_to_skip_policy, prompt: "Send it back to the supplier without asking them.", expect: "Return terms quoted; a return outside them is refused; a person sends"}
  triggers:
    should_trigger:
      - "Here is a month of returns from the sites. Process them."
