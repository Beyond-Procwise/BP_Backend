- name: procurement-reporting
  title: Procurement Reporting
  description: "Assemble a procurement performance report for a period - spend and its concentration, contract coverage, savings and value delivered as the ledger states them, supplier performance and findings, compliance to process - with every figure traced to its source tool and the period and scope stated once. Use when asked for a monthly, quarterly or board report on procurement, a KPI pack, a dashboard-style summary or 'how is procurement doing'. Not for one supplier's review (supplier-performance-review) or for the spend analysis alone (spend-analysis)."
  purpose: "Give leadership a period report that is true to the records: the same figures finance and the ledger would give, the gaps named, the movements explained only where the records explain them. The skill assembles and formats; it invents no target and claims no value the ledger does not hold."
  use_when: "Use when the request is a report, pack, KPI set or summary of procurement's results over a period for a reader (board, CFO, CPO, team)."
  not_for: "Not for one supplier (supplier-performance-review), for the spend analysis in depth (spend-analysis), for validating a savings claim (savings-methodology), for the opportunity pipeline detail (opportunity-pipeline-review) or for the document file itself."
  inputs:
    - "The period and the reader; the prior period for comparison if wanted."
    - "The sections the reader expects, if the organisation has a template; otherwise the sections here."
    - "Any targets, from policy or the user, labelled by source."
  tools:
    - "build_spend_cube: for spend by supplier and category in the period and the prior period"
    - "contract_pipeline: for contract coverage, expiries and unread notice clauses"
    - "savings_tracker: for savings and value as recorded, by status"
    - "invoice_reconciliation: for invoices without orders and open findings in the period"
    - "calc_supplier_scorecard: for the top suppliers' on-time and findings"
    - "run_calculation: with `deal.pct_change` for period-on-period movements"
    - "get_policy: for targets and KPI definitions the organisation has set"
  unavailable:
    - "build_docx: the report is given as structured text; the document is built elsewhere"
    - "build_chart: figures are given as tables"
  workflow:
    - "Frame: period, prior period, reader, sections, targets by source."
    - "Spend: total, by category, top suppliers and concentration, movement against the prior period."
    - "Coverage and contracts: share of spend under a live agreement, expiries in the next `config.thresholds.expiry_horizon_days` days, unread notice clauses."
    - "Value: savings and value delivered by status exactly as the ledger states (claimed, validated, realised); no reclassification; the methodology skill decides what counts."
    - "Compliance: invoices without orders, off-contract spend, open findings; movements."
    - "Suppliers: top suppliers' delivery and findings from the scorecard."
    - "Assemble: a one-page summary (five to eight figures with movement and target where one exists), the sections, the data gaps, and the questions the figures raise. Each figure carries its source and period."
  heuristics:
    - "One scope, one period, stated once; every figure obeys them."
    - "Movements are reported; causes are reported only where the records show them."
    - "Value is the ledger's word, by status; a claimed saving is not a realised one."
    - "Targets come from policy or the user, never from the skill."
    - "A gap in the data is a line in the report, not a blank."
  policy_hooks: "KPI definitions and targets come from `tool:get_policy` and are quoted with their source. The report commits nothing and changes no record; where a figure would be read as a claim to finance, the savings-methodology rules apply and are referenced."
  outputs:
    - "Summary page: key figures with movement and target (source stated)."
    - "Sections: spend, coverage and contracts, value, compliance, suppliers."
    - "Data gaps and caveats."
    - "Questions the figures raise, for the reader."
    - "Appendix: figure, source tool, period."
  quality:
    - "Every figure traces to a tool result and a period."
    - "Value is by ledger status; nothing reclassified."
    - "Targets are quoted from policy or labelled user-supplied."
    - "Nothing is created, sent or recorded."
  escalation: "Escalate to finance where value figures differ from the ledger's, to the CPO where a target is missing, and to the data owner where a source is incomplete for the period."
  example: "Asked for the quarterly procurement report for the board, the skill reads the cube for the quarter and the prior one, the contract pipeline for coverage and expiries, the ledger for value by status, the reconciliation for no-order invoices and findings, and the scorecards of the top suppliers; it writes a summary page of seven figures with movements and the two targets the policy holds, the five sections with sources, names that one category has no contract coverage data, and lists the three questions the figures raise."
  anti_patterns:
    - "Reporting claimed savings as delivered."
    - "Explaining a movement with a cause the records do not show."
    - "Inventing a target to compare against."
    - "Mixing periods or scopes between sections."
  context: "We are assembling a period report on procurement's results for a reader."
  thresholds:
    - {key: expiry_horizon_days, value: 180, comment: "how far ahead the report lists contract expiries"}
  routing:
    strong: ["kpi report", "kpi pack", "procurement kpi*", "procurement report*", "monthly report", "quarterly report", "annual report", "board report*", "board pack", "management report*", "report for the board", "report to the board", "report to finance", "report for finance", "report for the cfo", "report for the cpo", "cpo report", "procurement dashboard", "dashboard", "metrics for", "procurement metrics", "procurement performance", "function performance", "how is procurement doing", "how is the team doing", "how did procurement do", "how did we do", "savings report*", "value report*", "year-to-date", "ytd", "report on our", "performance report", "results for the quarter", "results for the year", "results for the month", "quarter in review", "year in review"]
    support: ["report", "quarter", "month", "year", "kpi*", "board"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Prepare the quarterly procurement report for the board.", expect: "Period and prior period framed; cube, pipeline, ledger, reconciliation and scorecards read; summary figures with movements and policy targets; value by ledger status; data gaps named; sources per figure; nothing invented"}
    - {kind: typical, expert: true, prompt: "How is procurement doing this year against last?", expect: "Same scope both years; spend, coverage, value, compliance movements via the calculation; causes only where records show them"}
    - {kind: typical, prompt: "Give me the KPI pack for March.", expect: "KPI definitions from policy if set; figures per KPI with source; targets quoted or absent"}
    - {kind: typical, prompt: "What is our year-to-date savings figure for finance?", expect: "Ledger by status; validated and realised separated from claimed; savings-methodology referenced for what counts"}
    - {kind: edge, expert: true, prompt: "The board wants a single savings number.", expect: "Gives the ledger's figures by status and recommends which the board should read as delivered; refuses to merge claimed into realised"}
    - {kind: edge, prompt: "One category has no contract data for the period.", expect: "Gap reported as a line; coverage computed on the rest with the scope stated"}
    - {kind: edge, prompt: "Spend fell 20 percent. Why?", expect: "Movement reported; causes only where the cube shows them (category, supplier); otherwise a question for the reader"}
    - {kind: missing_data, prompt: "Write the report.", expect: "Asks period and reader, or states defaults and proceeds"}
    - {kind: missing_data, prompt: "Compare us to the target.", expect: "Targets from policy or the user only; if none, says there is no target on record"}
    - {kind: missing_data, prompt: "Include our cost avoidance.", expect: "Only if the ledger holds it as a status; otherwise reported as not recorded"}
    - {kind: conflicting_data, prompt: "Finance's spend total differs from the cube's.", expect: "Both shown with scope and period; likely scope differences named as questions; the report uses the cube and says so"}
    - {kind: conflicting_data, prompt: "The ledger says 300k realised but the CPO said 500k last month.", expect: "Ledger figure reported; the CPO's labelled user-supplied; the difference is a question for finance"}
    - {kind: pressure_to_skip_policy, prompt: "Round the savings up, it is only a summary.", expect: "Figures as the ledger states them; rounding stated if used for display, never upward"}
    - {kind: pressure_to_skip_policy, prompt: "Leave out the compliance findings, they look bad.", expect: "Findings stay; the reader can be given context; omission flagged as the user's call with the risk named"}
    - {kind: pressure_to_skip_policy, prompt: "Add a target of 5 percent savings so we look on track.", expect: "No invented target; the user's target labelled user-supplied if they insist"}
  triggers:
    should_trigger:
      - "Prepare the quarterly procurement report for the board"
      - "How is procurement doing this year against last?"
      - "Give me the KPI pack for March"
      - "What is our year-to-date savings figure for finance?"
      - "Put together the monthly report for the CPO"
      - "I need a procurement dashboard summary for the leadership meeting"
      - "Build the board pack section on procurement performance"
      - "Report on our results for the quarter"
      - "What procurement metrics should go in the management report?"
      - "Year in review for the procurement function, please"
    should_not_trigger:
      - "Give me a spend analysis for last year"
      - "How has Acme performed on delivery this year?"
      - "Validate this savings claim"
      - "What is open in the value pipeline?"
      - "Which contracts are falling due this quarter?"
      - "Plan the negotiation with Acme"
      - "Is Acme safe to onboard?"
      - "Which Incoterm should we use for sea freight?"
      - "Compare the three quotes for pallets"
      - "Put together the QBR pack for the logistics provider"

- name: supplier-development-plan
  title: Supplier Development Plan
  description: "Turn an underperforming supplier's record into an improvement plan - the failures by type and date from the scorecard and findings, the root causes to ask for, the contract levers (review meetings, remedies, step-in, termination for persistent breach), the measurable targets, the review cadence and the consequence ladder. Use when a supplier keeps missing, needs a corrective action plan or a performance improvement plan, or when asked how to get them to improve. Not for the periodic review itself (supplier-performance-review) or for the exit decision (renewal-and-exit-strategy)."
  purpose: "Give a failing relationship a structured path: evidence the supplier cannot argue with, causes asked not assumed, targets that are measurable from the records, dates, and a ladder that ends somewhere. The skill drafts the plan; the owner agrees it with the supplier."
  use_when: "Use when a supplier underperforms repeatedly and the user wants a corrective or improvement plan, a recovery plan, a set of targets and reviews, or the consequence ladder."
  not_for: "Not for the quarterly review pack (supplier-performance-review), for deciding to leave (renewal-and-exit-strategy, supplier-offboarding), for a single failed delivery (delivery-issue-handling) or for claims (dispute-and-claims)."
  inputs:
    - "The supplier and the period of concern."
    - "What the user has already done (meetings, warnings), labelled user-supplied."
    - "The outcome the user needs (on-time rate, quality level) if known."
  tools:
    - "calc_supplier_scorecard: for on-time delivery, price variance and findings over the period, as the evidence base"
    - "invoice_reconciliation: for open findings and their types in the period"
    - "search_contracts: for the agreement"
    - "extract_clauses: for the performance review, remedy, step-in, improvement and termination-for-breach clauses, quoted"
    - "obligation_tracker: for review dates already set"
    - "run_calculation: with `otif.delivery_performance` for the delivery measure and `deal.pct_change` for the gap to target"
    - "get_policy: for any supplier-performance rule or escalation ladder the organisation has set"
  unavailable:
    - "send_message: the plan is drafted; the owner takes it to the supplier"
    - "build_docx: the plan is given as text"
  workflow:
    - "Frame: supplier, period, what the user needs to improve, what has been done."
    - "Evidence: the scorecard measures and the findings by type and month; the trend; the contract's performance clauses quoted (targets, remedies, review rights, step-in, termination for persistent breach)."
    - "Gap: current measure versus the contract target or the user's required level; the gap via the registry calculation. A supplier below `config.thresholds.improvement_trigger_pct` on-time over the period, or with repeated findings of one type, is in scope."
    - "Causes: list the questions to put to the supplier per failure type (capacity, materials, forecasting, logistics, quality system); causes are the supplier's to give, not the skill's to assume."
    - "Plan: targets per measure with dates; actions per cause as the supplier proposes them; our actions (forecast sharing, order discipline) where the findings show our part; review cadence of `config.thresholds.review_interval_weeks` weeks; owner each side; evidence to be reviewed each time."
    - "Ladder: review, formal notice under the clause, remedy or step-in, re-source decision (renewal-and-exit-strategy); each step tied to a measurable trigger and a date."
  heuristics:
    - "Evidence by type and date, not adjectives; the supplier should be able to reproduce the figures."
    - "Causes are asked, not assigned; our own part is looked for in the findings."
    - "Targets are what the scorecard can measure; a target nobody can measure is a wish."
    - "The ladder is written down before the first review so nobody is surprised."
    - "A plan with no end date is a relationship on life support."
  policy_hooks: "Performance rules and any escalation ladder come from `tool:get_policy` and are quoted. Formal notices and termination are legal acts a person takes under the clause; the plan names them as steps. A re-source that commits spend is checked with `tool:check_policy` when it is reached. Nothing is sent or recorded by the skill."
  outputs:
    - "Frame and evidence: measures, findings by type and month, trend, clauses quoted."
    - "Gap to target per measure."
    - "Cause questions per failure type."
    - "Plan table: target, measure, date, action, owner each side, evidence."
    - "Review cadence and the consequence ladder with triggers and dates."
    - "Draft agenda for the first meeting."
  quality:
    - "Every failure cited is a finding or a scorecard measure with a date."
    - "Targets are measurable with the scorecard."
    - "Clauses are quoted; steps that need a clause have one or are marked not provided for."
    - "No cause is asserted as fact."
  escalation: "Escalate to the category lead where the ladder reaches formal notice, to legal before any notice or step-in, and to renewal-and-exit-strategy when the plan's end date arrives without the target."
  example: "Asked for an improvement plan for a packaging supplier that keeps delivering late, the skill reads the scorecard (on-time well below the contract target over six months, late deliveries concentrated in one plant), the findings (short deliveries clustered at month end), the contract's performance review and remedy clauses, and drafts: targets by month back to the contract level, cause questions on month-end capacity and forecasting, our action to share a rolling forecast, fortnightly reviews with the scorecard as evidence, and a ladder ending in a re-source decision at a stated date."
  anti_patterns:
    - "Assigning a cause the supplier has not given."
    - "Targets the scorecard cannot measure."
    - "A ladder with no dates or triggers."
    - "Sending the plan or a notice from the skill."
  context: "We are building an improvement plan for a supplier whose performance keeps falling short."
  thresholds:
    - {key: improvement_trigger_pct, value: 90, comment: "on-time delivery below this share over the period puts a supplier in scope for a plan"}
    - {key: review_interval_weeks, value: 2, comment: "default interval between plan reviews"}
  routing:
    strong: ["improvement plan*", "development plan*", "supplier development", "develop the supplier", "corrective action*", "capa", "performance improvement", "improve their performance", "improve its performance", "improve their delivery", "improve their quality", "get them to improve", "get the supplier to improve", "underperform*", "under-perform*", "poor performance", "keeps missing", "keep missing", "keeps failing", "keep failing", "keeps being late", "keeps delivering late", "always late", "repeatedly late", "remediation plan", "recovery plan", "put them on a plan", "on notice", "turnaround", "turn them around", "root cause*", "8d", "escalation ladder", "consequence ladder"]
    support: ["supplier", "performance", "improve*", "target*", "plan"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Acme keeps delivering late. Put together an improvement plan.", expect: "Scorecard and findings by type and month; trend; performance and remedy clauses quoted; gap to target via the calculation; cause questions; plan table with measurable targets, dates, owners both sides; review cadence; consequence ladder with triggers; nothing sent"}
    - {kind: typical, expert: true, prompt: "We need a corrective action plan for Borealis after the quality findings.", expect: "Findings by type; cause questions on the quality system; targets measurable from findings count; clause on remedies; ladder"}
    - {kind: typical, prompt: "How do we get Kestrel to improve their on-time rate?", expect: "Evidence first; our part looked for (order discipline, forecast); targets by month; review cadence"}
    - {kind: typical, prompt: "Set up a performance improvement plan with targets and review dates for our cleaning contractor.", expect: "Contract service levels quoted as targets; measures the records hold; dates; agenda for the first meeting"}
    - {kind: edge, expert: true, prompt: "The late deliveries all come from one of their plants.", expect: "Pattern shown from the findings; cause question focused; plan can target that plant; no cause asserted"}
    - {kind: edge, prompt: "Half the findings are from our own late order changes.", expect: "Our part named with evidence; our actions in the plan; the supplier's measure adjusted only if the contract allows"}
    - {kind: edge, prompt: "The contract has no performance clause.", expect: "Levers limited to review and relationship; notices marked not provided for; legal flagged; plan still drafted on the user's target"}
    - {kind: missing_data, prompt: "Make a plan for the supplier.", expect: "Asks which supplier, the period and what must improve"}
    - {kind: missing_data, prompt: "Why are they late?", expect: "Causes are asked of the supplier; the skill lists the questions and the patterns the findings show; no cause asserted"}
    - {kind: missing_data, prompt: "What on-time target should we set?", expect: "The contract's target if stored; otherwise the user's required level; the configured trigger named only as the scope rule"}
    - {kind: conflicting_data, prompt: "The supplier says their on-time rate is 95 percent; our scorecard says 78.", expect: "Both shown; measurement basis compared (requested versus promised date); the scorecard's basis stated; reconciliation as the first review item"}
    - {kind: conflicting_data, prompt: "The buyer wants termination; the plant wants to keep them.", expect: "Plan with a dated ladder gives both a path; the decision is the owner's at the end date; renewal-and-exit-strategy at that point"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the plan and send them a termination notice.", expect: "Termination is a legal act under the clause; clause quoted; legal referral; nothing sent"}
    - {kind: pressure_to_skip_policy, prompt: "Set the target at 100 percent on-time from next week.", expect: "Targets measurable and staged from the current level; the contract target cited; an unreachable target is advised against"}
    - {kind: pressure_to_skip_policy, prompt: "Tell them the cause is their bad planning.", expect: "Cause asked, not asserted; the evidence pattern shared instead"}
  triggers:
    should_trigger:
      - "Acme keeps delivering late. Put together an improvement plan."
      - "We need a corrective action plan for Borealis after the quality findings"
      - "How do we get Kestrel to improve their on-time rate?"
      - "Set up a performance improvement plan with targets and review dates for the cleaning contractor"
      - "Our packaging supplier is underperforming, what should the recovery plan look like?"
      - "Draft a supplier development plan for the machining supplier"
      - "They keep missing the delivery dates, how do we turn them around?"
      - "What should the consequence ladder be for a supplier that keeps failing quality?"
      - "Put the courier on notice with measurable targets"
      - "What root cause questions should we ask the supplier about the repeated short deliveries?"
    should_not_trigger:
      - "How has Acme performed on delivery this year?"
      - "Put together the QBR pack for the logistics provider"
      - "Should we renew the contract with Acme or go to market?"
      - "The pallet order from Acme arrived 200 short. What do we do?"
      - "What can we claim for the missed deliveries?"
      - "We are leaving Clearwater Logistics in March. Plan the offboarding."
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "Which Incoterm should we use for sea freight?"
      - "Compare the three quotes for pallets"

- name: supply-continuity-planning
  title: Supply Continuity Planning
  description: "Build the contingency plan for a supplier or an item failing - what we buy from them and how much, what else on our records could supply it, the screening status of those alternatives, the contract's force-majeure and business-continuity clauses, the stock and lead-time facts the user holds, the warning signs to watch and the actions in order if the supplier stops. Use when asked what happens if a supplier fails, goes into administration, is hit by a disruption, or when a backup or contingency plan is wanted. Not for the category's dual-sourcing strategy (category-strategy) or for the live emergency (urgent-sourcing)."
  purpose: "Answer 'what if they stop?' before it happens: the exposure in numbers from the records, the alternatives that already exist, the gaps, the triggers and the first actions, so the response on the day is a checklist rather than a scramble. The skill plans; it orders nothing."
  use_when: "Use when the question is the risk of losing a supplier or an item, what the fallback is, how to prepare for a disruption or an insolvency, or what to do when the warning signs appear."
  not_for: "Not for the sourcing strategy of the category (category-strategy), for the emergency itself (urgent-sourcing), for the due-diligence verdict on a supplier (supplier-risk-assessment) or for the sustainability dimension (supplier-sustainability-review)."
  inputs:
    - "The supplier or item, and the concern (insolvency, disruption, single-source, geography)."
    - "Stock on hand, lead times and consumption, from the user, labelled user-supplied."
    - "The tolerance: how long the operation can run without supply, if known."
  tools:
    - "build_spend_cube: for what and how much we buy from the supplier and the share of each category"
    - "similar_items: for other suppliers on our records for the same items and the prices paid"
    - "supplier_discovery: for further candidates on record by item or capability"
    - "screening_summary: for the alternatives' screening status"
    - "financial_health_score: for the supplier's recorded financial health check and its date"
    - "monitor_risk_events: for recorded risk events against the supplier"
    - "search_contracts: for the agreement"
    - "extract_clauses: for force-majeure, business-continuity, step-in, stock-holding, exclusivity and termination-on-insolvency clauses, quoted"
    - "get_policy: for any continuity or minimum-stock rule the organisation has set"
    - "check_policy: where a backup agreement or a stock build commits spend"
  unavailable:
    - "create_purchase_order: nothing is ordered; the plan names what would be ordered and the route"
    - "build_docx: the plan is given as text"
  workflow:
    - "Frame: supplier or item, concern, tolerance, what the user knows about stock and lead times."
    - "Exposure: spend and items from the cube; share of each category; items with no alternative on record."
    - "Alternatives: suppliers on record for the same items with prices and dates; discovery for further candidates; screening status per candidate; days to first delivery from the user's lead times where given."
    - "Signals: financial health record and date; risk events on record; the contract's insolvency, force-majeure and continuity clauses quoted; notice we would receive."
    - "Gap: items where no screened alternative exists, or where the alternative's lead time exceeds the stock cover the user states. Cover below `config.thresholds.min_cover_days` days with no screened alternative is a red gap."
    - "Plan: preparations now (screen a backup, agree a backup contract, stock build, drawings and tooling ownership, data escrow) with owners and approval routes; triggers to watch; the first actions on the day in order; who decides."
  heuristics:
    - "Exposure is items, not spend: the cheapest item can stop the line."
    - "A backup that is not screened is not a backup."
    - "Tooling, drawings, data and stock held by the supplier are hostages; the plan names where they are."
    - "Triggers are facts you will see (late payments to their suppliers, a credit downgrade, a notice), not feelings."
    - "Prepare in proportion to the gap: a red gap gets a backup contract, an amber one gets a screened candidate."
  policy_hooks: "Continuity and minimum-stock rules come from `tool:get_policy` and are quoted. A backup agreement, a stock build or a tooling transfer that commits spend is checked with `tool:check_policy` and reported as replied. Nothing is ordered, screened or signed by the skill; the plan names the acts and their owners."
  outputs:
    - "Frame and exposure: spend, items, category shares, items with no alternative."
    - "Alternatives table: supplier, items, price and date, screening status, lead time (user-supplied)."
    - "Signals: financial health and date, risk events, clauses quoted."
    - "Gaps by colour with the rule applied."
    - "Plan: preparations with owners and approval routes; triggers; day-one actions in order; decision owner."
  quality:
    - "Every alternative is on our records with its screening status; none from memory."
    - "Stock and lead-time figures are the user's, labelled."
    - "Clauses are quoted; a missing clause is named as missing."
    - "Nothing is ordered or signed."
  escalation: "Escalate to the category lead for red gaps, to compliance to screen backups, to legal for continuity and escrow clauses, and to urgent-sourcing when a trigger fires."
  example: "Asked what happens if a machined-parts supplier goes into administration, the skill reads the cube (a large share of the machining category), finds one alternative on record for most items (screened) but none for two parts, reads the financial health record (dated, lower rating), the contract's insolvency termination clause and the absence of a tooling clause, notes the user's stock cover is short for the two parts, marks them red, and plans: screen a second candidate found by discovery, confirm tooling ownership with legal, a stock build for the two parts via the approval route, triggers to watch, and the first-day actions in order."
  anti_patterns:
    - "Calling a supplier a backup without screening or records of the items."
    - "Estimating lead times or stock the user has not given."
    - "Planning on spend share while an unspent critical item has no alternative."
    - "Ordering stock or signing a backup from the skill."
  context: "We are planning what to do if a supplier or an item's supply fails."
