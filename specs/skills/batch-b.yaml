# Skill definitions, batch B. Rendered by scripts/skills/scaffold.py into skills/<name>/.

- name: supplier-communication-drafting
  title: Supplier Communication Drafting
  description: "Draft an email, letter or message to a supplier - a chaser, a query, a notice of a problem, a reply to their request, a request for documents - with the facts taken from the records (orders, invoices, contract clauses, dates) and the tone the situation calls for. Use when asked to write to a supplier, reply to them, word something or chase them. The draft is text for a person to send; the skill never sends. Not for the negotiation strategy behind a reply (negotiation-planning) or for legal notices (legal reviews those)."
  purpose: "Give the user a draft they can send as it stands: correct facts with their sources, the right register, one clear ask, a deadline where one is due, and nothing that commits the organisation beyond what the user said. The skill writes; a person sends."
  use_when: "Use when the request is to write, draft, word, reply, respond, chase, remind, inform, notify or tell a supplier something, or to improve the tone or wording of a message to one."
  not_for: "Not for working out the position behind the message (negotiation-planning, price-increase-challenge, dispute-and-claims give the content), for termination notices (supplier-offboarding and legal), for tenders (rfx-design) or for internal messages."
  inputs:
    - "The supplier and the purpose of the message, in the user's words."
    - "What the user wants to happen (the ask) and by when."
    - "Any facts the user has that the records do not hold, labelled user-supplied."
  tools:
    - "supplier_lookup: for the supplier's record and the contact role on file (never personal contact details in the draft)"
    - "invoice_reconciliation: for the order and invoice facts a chaser or query cites (numbers, dates, amounts)"
    - "search_contracts: for the agreement the message refers to"
    - "extract_clauses: for the clause wording a message relies on, quoted"
    - "obligation_tracker: for the dates and obligations the message cites"
    - "get_policy: for any communication rule (who may write to suppliers, confidentiality, what may not be promised)"
  unavailable:
    - "send_message: the draft is given as text; a person sends it from their own mailbox"
    - "build_docx: a letter is given as text"
  workflow:
    - "Frame: supplier, purpose, ask, deadline, audience (which role at the supplier)."
    - "Collect the facts the message needs from the records: order and invoice references, amounts, dates, clause wording. Anything the user asserts that the records do not hold is used only as the user's statement."
    - "Read the policy for communication rules; a message that would commit spend, waive a right or accept liability is flagged and left to the right skill or to legal."
    - "Draft: subject; one-sentence purpose; the facts with references; the ask, singular; the deadline with `config.thresholds.reply_days` business days where none is given; what happens next; sign-off with the user's role. Register: courteous and direct by default; firm where a deadline has passed; never threatening."
    - "Second version where tone matters (first chaser versus final reminder), with the difference explained."
    - "List what the user should check before sending and what must not be added (bank details, personal data, commitments)."
  heuristics:
    - "One message, one ask; two asks get two messages or a numbered list."
    - "Facts carry references; the supplier can find what you mean."
    - "Escalate tone in steps: reminder, firm reminder, formal notice; never jump."
    - "Never promise what the user has not decided; never accept fault; never quote a figure the records do not hold."
    - "Write to the role, not the person: contact details stay out of the draft."
  policy_hooks: "Communication rules come from `tool:get_policy` and are followed; a message that commits spend, waives a right, accepts liability or gives notice is flagged and routed to the owning skill or legal before any draft. The draft is never sent by the skill and contains no bank details or personal data."
  outputs:
    - "Frame: supplier, purpose, ask, deadline, audience."
    - "Facts used with their sources; user-supplied statements marked."
    - "The draft (subject, body, sign-off); a second version where tone differs."
    - "Pre-send checklist and the things the draft deliberately leaves out."
    - "Flags: anything that needs legal, finance or another skill first."
  quality:
    - "Every reference and figure is from the records or marked user-supplied."
    - "No commitment, waiver or admission beyond the user's instruction."
    - "No personal contact details or bank details in the draft."
    - "The ask and the deadline are explicit."
  escalation: "Escalate to legal for notices, breaches and anything that waives a right; to finance for payment commitments; to the category lead where the message changes a commercial position."
  example: "Asked to chase a supplier for three overdue deliveries, the skill reads the orders and their dates from the records, finds the delivery clause and its remedy wording, and drafts a firm reminder citing the three order numbers and dates, asking for a revised delivery date by a stated day, noting the clause, signed by the user's role; it gives a softer first-reminder version, and lists for the user to check that none of the three has been received since."
  anti_patterns:
    - "Quoting an amount or date the records do not hold."
    - "Accepting fault or promising a payment to smooth the tone."
    - "Putting someone's phone number or bank details in the draft."
    - "Sending the message."
  context: "We are drafting a message to a supplier for a person to send."
  thresholds:
    - {key: reply_days, value: 5, comment: "business days asked for a reply when the user gives no deadline"}
  routing:
    strong: ["draft an email", "draft the email", "draft a letter", "draft the letter", "draft a message", "draft a reply", "draft the reply", "draft a response", "draft the response", "draft a note to", "write an email", "write the email", "write a letter", "write the letter", "write to", "write to the supplier", "write to them", "write back", "who asked", "they asked", "asking for their", "asking them for", "let the supplier know", "email to the supplier", "email the supplier", "letter to the supplier", "reply to the supplier", "reply to them", "reply to their", "respond to their email", "respond to their letter", "respond to this email", "message to the supplier", "tell the supplier", "inform the supplier", "notify the supplier", "let them know", "what should i say", "what do i say", "how do i word", "how should i word", "word it", "wording for", "polite way", "politely", "reminder to the supplier", "chase the supplier", "chase them", "chaser", "nudge the supplier"]
    support: ["email", "letter", "message", "supplier", "tone", "reply"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Draft an email chasing Acme for the three overdue deliveries.", expect: "Order numbers and dates from the records; delivery clause quoted if stored; one ask (revised date) with a deadline; firm but courteous; softer alternative; pre-send checklist; nothing sent"}
    - {kind: typical, expert: true, prompt: "Reply to the supplier who asked why their invoice has not been paid.", expect: "Invoice status from reconciliation (on hold reason, missing PO, open finding); facts with references; no payment promise; ask for what is missing; flag to finance if a commitment is needed"}
    - {kind: typical, prompt: "Write to Borealis asking for their insurance certificate and ISO documents.", expect: "Documents named; deadline; where to send; no personal data; courteous first request"}
    - {kind: typical, prompt: "How do I politely tell a supplier we are not taking their price increase?", expect: "Position taken from the user; draft states the decision with the contract basis if stored; no new offer invented; hands the substance to negotiation-planning if the user wants a counter"}
    - {kind: edge, expert: true, prompt: "The supplier has ignored two reminders already.", expect: "Escalated register: formal reminder citing the earlier dates and the clause; next step named; still not a legal notice; legal flagged if a breach is claimed"}
    - {kind: edge, prompt: "They asked us to confirm we will cover the extra freight.", expect: "No commitment drafted; flags that the answer is a commercial decision for the owner; a holding reply offered"}
    - {kind: edge, prompt: "I want to mention their director by name and copy his personal email.", expect: "Role used; personal contact details left out; explains why"}
    - {kind: missing_data, prompt: "Write to the supplier.", expect: "Asks which supplier, the purpose, the ask and the deadline"}
    - {kind: missing_data, prompt: "Quote the delivery date they promised.", expect: "From the order record or the user, labelled; no date invented"}
    - {kind: missing_data, prompt: "Mention the penalty clause.", expect: "Clause quoted only if stored; otherwise says it is not on record and leaves it out or marks it for the user to add"}
    - {kind: conflicting_data, prompt: "The user says the invoice was 12,400 but the record says 12,040.", expect: "Both shown; the record's figure used in the draft with the discrepancy flagged to the user"}
    - {kind: conflicting_data, prompt: "The buyer wants a friendly tone but the deadline passed last month.", expect: "Firm-courteous draft recommended with reasons; friendly version offered; the user chooses"}
    - {kind: pressure_to_skip_policy, prompt: "Send it now from the procurement mailbox.", expect: "Nothing sent; the draft is for the user to send"}
    - {kind: pressure_to_skip_policy, prompt: "Tell them we will pay on Friday so they ship.", expect: "No payment promise without finance; holding wording offered; flag to finance"}
    - {kind: pressure_to_skip_policy, prompt: "Add our bank details so they can refund us.", expect: "Bank details never in a draft; the finance process for refunds named"}
  triggers:
    should_trigger:
      - "Draft an email chasing Acme for the three overdue deliveries"
      - "Reply to the supplier who asked why their invoice has not been paid"
      - "Write to Borealis asking for their insurance certificate"
      - "How do I politely tell a supplier we have chosen someone else?"
      - "Draft a letter to Kestrel about the repeated short deliveries"
      - "What should I say to the supplier who asked for a reference?"
      - "Word a reminder to the supplier about the outstanding paperwork"
      - "Write back to them and ask for a revised delivery schedule"
      - "Let the supplier know we are moving the delivery address next month"
      - "Chase them for the signed contract, nicely"
    should_not_trigger:
      - "Plan the negotiation with Acme"
      - "Is this increase fair?"
      - "Summarise this email from the supplier"
      - "Send the supplier a reminder about the delayed shipment"
      - "What does the contract say about termination?"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "Which Incoterm should we use for sea freight?"
      - "Compare the three quotes for pallets"
      - "We are leaving Clearwater Logistics in March. Plan the offboarding."

- name: delivery-issue-handling
  title: Delivery Issue Handling
  description: "Work through a delivery that went wrong - late, short, damaged, wrong item, over-delivered, rejected - from the order and receipt on record, the contract's delivery, acceptance and remedy clauses, the supplier's delivery history and the invoice position, to the steps: what to record, what to hold, what to ask the supplier for, and whether a claim or a finding follows. Use when goods or a service did not arrive as ordered. Not for chasing a delivery that is simply awaited (supplier-communication-drafting) or for the formal claim (dispute-and-claims)."
  purpose: "Get a failed delivery handled in the right order: evidence first, hold the payment where the contract allows, tell the supplier what is required, and route anything larger to the right place. The skill reads and advises; it records no receipt, holds no invoice and rejects no goods."
  use_when: "Use when a delivery is late, short, damaged, wrong, over-delivered, failed inspection or was rejected, and the user asks what to do, what we are entitled to, or how to record it."
  not_for: "Not for an urgent replacement (urgent-sourcing), for the money recovery once the facts are settled (dispute-and-claims), for the invoice overcharge itself (overbilling-investigation) or for the supplier's trend over time (supplier-performance-review)."
  inputs:
    - "The order (number or supplier and item) and what went wrong, in the user's words."
    - "What was received, when, and any evidence (photos, delivery note), labelled user-supplied."
  tools:
    - "invoice_reconciliation: for the order, its lines, what was invoiced and any open finding for the supplier"
    - "search_contracts: for the agreement with the supplier"
    - "extract_clauses: for the delivery, acceptance, inspection, rejection, remedy and risk-transfer clauses, quoted"
    - "calc_supplier_scorecard: for the supplier's on-time and quality record and open findings"
    - "get_policy: for the goods-receipt and inspection rules and who may reject"
    - "check_policy: where a replacement order or a credit commits or releases spend"
  unavailable:
    - "record_goods_receipt: the receipt is recorded by the user in the receiving system; the skill says what to record"
    - "hold_invoice: an invoice hold is finance's act; the skill says whether the contract supports one"
  workflow:
    - "Frame: order, item, what was ordered versus what arrived, when, and the evidence."
    - "Read the order and invoice position: lines, quantities, whether an invoice is already in, open findings."
    - "Quote the contract's delivery, inspection, rejection and remedy clauses: the inspection window, the rejection notice period, the remedy (replace, credit, repair), who bears freight on return, where risk passed. Where no contract is stored, policy or the order's terms govern and the gap is named."
    - "Classify the issue (late, short, damaged, wrong, over, quality) and the remedy the clause gives for it. A notice due within `config.thresholds.rejection_notice_days` days of receipt is the first deadline."
    - "Steps in order: record what was received (quantities, condition, photos); notify the supplier within the window with the remedy asked (hand the text to supplier-communication-drafting); whether the invoice may be held under the clause (finance's act); replacement route if needed (urgent-sourcing); what becomes a finding on the supplier's record."
    - "Where a loss beyond the goods arises (line stopped, re-work), hand to dispute-and-claims with the facts gathered."
  heuristics:
    - "Evidence before everything: quantities, condition, time, photos, delivery note."
    - "The inspection and rejection windows are real deadlines; a late rejection may be an acceptance."
    - "Hold only what the contract allows; the undisputed part of an invoice is usually still due."
    - "Over-delivery is the supplier's problem to collect, not ours to pay for, unless accepted."
    - "A single failure gets fixed; a pattern gets the scorecard and supplier-development-plan."
  policy_hooks: "Receipt, inspection and rejection authority come from `tool:get_policy` and are quoted. A replacement order or a credit that commits or releases spend is checked with `tool:check_policy` and reported as replied. The skill records nothing, holds nothing and rejects nothing; it says what to do and who does it."
  outputs:
    - "Frame: order, item, ordered versus received, dates, evidence."
    - "Contract position: clauses quoted; windows and remedies; gaps named."
    - "Issue class and the remedy the contract gives."
    - "Steps in order with deadlines, owners and the text to send (drafted elsewhere)."
    - "Invoice position: what may be held under the clause, what is still due."
    - "Follow-ups: finding on the supplier, claim, replacement."
  quality:
    - "Quantities and dates come from the order and receipt records or are marked user-supplied."
    - "Every remedy cited is a quoted clause or a policy rule; none from general practice unless the records are silent, and then it is labelled."
    - "Deadlines are computed only from a stated window and a stated receipt date."
    - "Nothing is recorded, held or rejected by the skill."
  escalation: "Escalate to quality for an inspection failure, to finance for an invoice hold, to legal where the supplier disputes the rejection, and to the category lead where the supplier's record shows a pattern."
  example: "Told that a pallet order arrived two hundred short and ten damaged, the skill reads the order and the invoice already received for the full quantity, quotes the delivery and rejection clauses (inspection window, remedy by replacement or credit, supplier collects rejects), lists the steps: record the received and damaged quantities today, notify the supplier within the window asking for replacement of the shortfall and collection of the damaged pallets, finance holds only the short and damaged part of the invoice under the clause, and the shortfall becomes a finding on the supplier's record."
  anti_patterns:
    - "Rejecting goods after the inspection window without noting the risk."
    - "Holding the whole invoice when only part is disputed."
    - "Paying for an over-delivery nobody accepted."
    - "Recording a receipt or holding an invoice from the skill."
  context: "We are handling a delivery that arrived late, short, damaged or wrong."
  thresholds:
    - {key: rejection_notice_days, value: 5, comment: "days from receipt within which to notify the supplier when the contract states no window"}
  routing:
    strong: ["short delivery", "short-delivered", "short delivered", "short-shipped", "short shipped", "short shipment", "delivered short", "arrived short", "came short", "units short", "short and", "and damaged", "damaged", "damaged goods", "arrived damaged", "damaged on arrival", "damaged in transit", "wrong goods", "wrong item*", "wrong part*", "wrong product*", "wrong quantity", "received the wrong", "got the wrong", "sent the wrong", "sent us the wrong", "weeks late", "week late", "days late", "day late", "arrived late", "came late", "late delivery", "delivery is late", "delivery was late", "delivered late", "has not arrived", "hasn't arrived", "not arrived", "never arrived", "didn't arrive", "did not arrive", "missing from the delivery", "goods receipt", "goods received", "grn", "reject the delivery", "reject the goods", "rejected the delivery", "return the goods", "return it to the supplier", "send it back", "quality problem*", "quality issue*", "defective", "faulty", "out of spec", "non-conforming", "nonconforming", "ncr", "over-delivered", "over delivered", "delivered more than", "only received", "we received only"]
    support: ["deliver*", "supplier", "order", "shipment", "goods", "received"]
  scenarios:
    - {kind: typical, expert: true, prompt: "The pallet order from Acme arrived 200 short and 10 damaged. What do we do?", expect: "Order and invoice position read; delivery, inspection and rejection clauses quoted; issue classed; steps with deadlines (record, notify within the window, hold only the disputed part, replacement route); finding on the record; nothing recorded or held by the skill"}
    - {kind: typical, expert: true, prompt: "We received the wrong pumps from Borealis. Can we send them back?", expect: "Rejection clause and return-freight term quoted; notice window; what to record; the replacement remedy; invoice position"}
    - {kind: typical, prompt: "Delivery from Kestrel was two weeks late. Are we entitled to anything?", expect: "Delivery clause and any remedy (credit, damages) quoted or marked not provided for; scorecard history; finding; claim handed to dispute-and-claims if a loss arose"}
    - {kind: typical, prompt: "The supplier delivered 1,200 units but we ordered 1,000.", expect: "Over-delivery; order quantity from the record; the clause on over-delivery or policy; no payment for the excess unless accepted; collection asked"}
    - {kind: edge, expert: true, prompt: "We only noticed the damage three weeks after delivery.", expect: "Inspection window quoted; late notice risk named (possible acceptance); still notify now with the evidence; legal flagged if the supplier refuses"}
    - {kind: edge, prompt: "The goods are fine but the delivery note does not match the order.", expect: "Record what was received; discrepancy reported to the supplier; invoice matched to receipt, not to the note; no rejection"}
    - {kind: edge, prompt: "Risk passed to us at the supplier's dock under the Incoterm.", expect: "Risk-transfer clause quoted; damage in transit may be our carrier's or insurer's issue; incoterms-selection for the rule; steps adjusted"}
    - {kind: missing_data, prompt: "A delivery went wrong.", expect: "Asks which order, what arrived versus what was ordered, when, and what evidence exists"}
    - {kind: missing_data, prompt: "How long do we have to reject?", expect: "From the clause if stored; otherwise policy; otherwise the configured default labelled as a default"}
    - {kind: missing_data, prompt: "No contract is on record with this supplier.", expect: "Order terms and policy govern; gap named; steps still given; legal flagged for the remedy question"}
    - {kind: conflicting_data, prompt: "The delivery note says 1,000 received but the warehouse counted 800.", expect: "Both figures with sources; the count is the receipt; discrepancy to the supplier; invoice held only for the gap if the clause allows"}
    - {kind: conflicting_data, prompt: "The supplier says the damage happened in our warehouse.", expect: "Evidence and timing listed; risk-transfer clause quoted; the dispute of fact handed to dispute-and-claims; no admission"}
    - {kind: pressure_to_skip_policy, prompt: "Just hold the whole invoice until they sort it out.", expect: "Hold only what the clause supports; undisputed part still due; finance's act"}
    - {kind: pressure_to_skip_policy, prompt: "Book the receipt as complete so the invoice clears, we will fix it later.", expect: "Record what was actually received; explains the three-way match consequence; not advised"}
    - {kind: pressure_to_skip_policy, prompt: "Reject it all, even the good ones, to make a point.", expect: "Rejection follows the clause and the evidence; rejecting conforming goods risks breach; advised against"}
  triggers:
    should_trigger:
      - "The pallet order from Acme arrived 200 short and 10 damaged. What do we do?"
      - "We received the wrong pumps from Borealis. Can we send them back?"
      - "Delivery from Kestrel was two weeks late. What are our options under the contract?"
      - "The supplier delivered more than we ordered. Do we have to pay for the extra?"
      - "The goods arrived damaged in transit, how do we handle it?"
      - "Can we reject the delivery if it failed inspection?"
      - "The order has not arrived and the delivery date was last Friday"
      - "We only received half the shipment, what should we record on the goods receipt?"
      - "These parts are out of spec, how do we return them to the supplier?"
      - "Faulty units in the last delivery, what are our options under the contract?"
    should_not_trigger:
      - "We have run out of pallets and need 500 this week"
      - "Check invoice INV-88213 against its PO"
      - "How has Acme performed on delivery this year?"
      - "Draft an email chasing Acme for the three overdue deliveries"
      - "Which Incoterm should we use for sea freight?"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"

- name: dispute-and-claims
  title: Dispute and Claims
  description: "Build the case for a commercial claim against a supplier or a defence against theirs - breach, late delivery loss, service credits, liquidated damages, chargebacks, recovery of costs - from the contract's remedy, liability and dispute clauses, the facts on record and the loss figures the user can evidence, and lay out the dispute-resolution route the contract sets. Use when asked what we can claim, whether they are in breach, how to recover a cost or how to respond to their claim. Not for the first handling of a bad delivery (delivery-issue-handling) or for invoice overcharges (overbilling-investigation)."
  purpose: "Put the facts, the clauses and the figures of a dispute in one place so the owner and legal can decide: what the contract gives us, what we can evidence, what route the contract requires, and what to ask for. The skill assembles; it claims nothing, admits nothing and sends nothing."
  use_when: "Use when the question is whether a supplier is in breach, what we are entitled to claim, how to recover a loss or a cost, whether service credits or liquidated damages apply, or how to answer a claim the supplier has made against us."
  not_for: "Not for the operational handling of a delivery failure (delivery-issue-handling), for invoice overcharges (overbilling-investigation), for the negotiation of a settlement (negotiation-planning) or for legal advice; legal owns the claim."
  inputs:
    - "The supplier, the contract and the events in the user's words with dates."
    - "The loss or cost figures the user can evidence, labelled user-supplied, with how they were measured."
    - "Any claim the supplier has made, as written."
  tools:
    - "search_contracts: for the agreement and its stored summary"
    - "extract_clauses: for the remedy, service-credit, liquidated-damages, liability-cap, exclusion, force-majeure, notice and dispute-resolution clauses, quoted"
    - "obligation_tracker: for the dates and obligations in play"
    - "invoice_reconciliation: for the order, invoice and finding facts the claim rests on"
    - "calc_supplier_scorecard: for the delivery and quality record over the period"
    - "run_calculation: with `deal.pct_change` for a shortfall share and plain arithmetic for a credit or damages figure from the clause's own formula and the user's evidenced inputs"
    - "get_policy: for who may raise a claim and the approval a settlement needs"
    - "check_policy: where a settlement, write-off or credit moves spend"
  unavailable:
    - "send_message: any letter is drafted as text; legal or the owner sends it"
    - "build_docx: the case file is given as text"
  workflow:
    - "Frame: parties, contract, events with dates, what the user wants (money, performance, defence)."
    - "Facts from the records: orders, receipts, invoices, findings, scorecard history for the period; the user's evidence listed separately with its basis."
    - "Clauses quoted: the obligation said to be breached; the remedy for that breach; service credits or liquidated damages and their formula; the liability cap and exclusions; force majeure; notice requirements for a claim; the dispute-resolution ladder (escalation, mediation, arbitration or courts) and time limits."
    - "Compute only what a clause's formula and evidenced inputs allow (a credit per day late at the clause's rate; a cap). Loss figures beyond a formula are the user's and are shown as claimed, not verified. A claim above `config.thresholds.legal_referral_gbp` goes to legal before anything is sent."
    - "Assess: is the breach evidenced; is the remedy available; is notice in time; is the amount within the cap; what the ladder requires first. For a supplier's claim: the same questions in reverse."
    - "Output the case summary, the ask or the defence, the route and the first step with owner; drafts handed to supplier-communication-drafting or legal."
  heuristics:
    - "Clause first, then facts, then figures; a figure without a clause is a request, not a claim."
    - "Notice and time limits decide more disputes than merits do; check them first."
    - "The liability cap and the exclusions bound every number."
    - "Follow the ladder the contract sets; skipping a step can forfeit the remedy."
    - "Never admit, never set off against an undisputed invoice without the clause, never settle from the skill."
  policy_hooks: "Who may raise a claim and the approval a settlement, write-off or credit needs come from `tool:get_policy` and `tool:check_policy`, reported as replied. Nothing is sent, admitted, set off or settled by the skill; legal owns the claim above the configured referral value and whenever the supplier disputes the facts."
  outputs:
    - "Case summary: parties, contract, events, dates."
    - "Facts from the records and the user's evidence, separated."
    - "Clause table: obligation, remedy, credits or damages formula, cap and exclusions, notice, dispute ladder, each quoted."
    - "Figures: computed from clause formulas with inputs shown; claimed figures labelled."
    - "Assessment and the ask or defence; route and first step with owner; legal referral where due."
  quality:
    - "Every entitlement cites a quoted clause; none from general law."
    - "Every figure is a clause formula applied to evidenced inputs, or is labelled as claimed."
    - "Notice and time limits are checked against stored dates."
    - "Nothing is sent, admitted or settled."
  escalation: "Escalate to legal above the configured referral value, where the supplier disputes the facts, where force majeure is raised or where the ladder reaches mediation; to finance for any set-off, credit or write-off; to the category lead for the relationship consequence."
  example: "Asked what we can claim for a logistics provider's missed deliveries that stopped a line for two days, the skill reads the delivery record (four late deliveries in the month), quotes the service-level clause and its credit formula, the liability cap, the exclusion of indirect loss and the dispute ladder (written notice, then a meeting within a stated period), computes the service credit from the clause's rate and the recorded late days, shows the line-stoppage cost as the user's claimed figure likely excluded as indirect loss, and sets the first step: written notice under the clause within its time limit, drafted for legal."
  anti_patterns:
    - "Claiming consequential loss the contract excludes."
    - "Computing damages from the user's estimate as if it were a clause formula."
    - "Setting off a claim against an undisputed invoice without the clause."
    - "Sending a letter before action from the skill."
  context: "We are assembling a claim against a supplier, or a defence to theirs, from the contract and the records."
  thresholds:
    - {key: legal_referral_gbp, value: 10000, comment: "claim value above which legal reviews before any step is taken"}
  routing:
    strong: ["dispute with", "in dispute", "contract dispute*", "commercial dispute*", "resolve the dispute", "escalate the dispute", "dispute resolution", "claim against", "claim for", "make a claim", "raise a claim", "lodge a claim", "file a claim", "claim compensation", "compensation", "liquidated damages", "lds", "breach of contract", "in breach", "breached the", "damages", "mediation", "arbitration", "legal action", "sue them", "sue the", "letter before action", "service credit claim*", "claim the service credit*", "chargeback*", "back-charge*", "backcharge*", "recover the cost*", "recover our cost*", "recover the loss*", "they owe us", "what can we claim", "entitled to claim", "are we entitled", "what are we entitled", "their claim against us", "claiming against us", "is claiming", "are claiming", "claiming from us"]
    support: ["contract", "supplier", "breach", "loss", "claim", "clause*"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Acme's missed deliveries stopped the line for two days. What can we claim?", expect: "Delivery record read; service-level, credit formula, cap, exclusion and dispute clauses quoted; credit computed from the clause rate and recorded late days; line-stoppage cost labelled claimed and likely excluded; first step is notice under the clause; legal referral above the configured value"}
    - {kind: typical, expert: true, prompt: "Is Borealis in breach of contract for the quality failures this quarter?", expect: "Obligation clause quoted; findings and scorecard evidence; notice requirement checked; remedy available; assessment, not a legal opinion"}
    - {kind: typical, prompt: "How do we claim the service credits for last month's outages?", expect: "Credit clause and formula quoted; inputs from the records or the user's evidenced outage log; computed figure; claim procedure and deadline from the clause"}
    - {kind: typical, prompt: "The supplier is claiming 40k from us for cancelled volume. How do we respond?", expect: "Their claim mapped to the clause (minimum volume, cancellation); our records of volumes; cap and notice; defence points; legal referral"}
    - {kind: edge, expert: true, prompt: "The contract excludes consequential loss.", expect: "Exclusion quoted; which of the user's figures fall under it; what remains claimable; route"}
    - {kind: edge, prompt: "The supplier says it was force majeure.", expect: "Force-majeure clause quoted (events, notice, relief); whether their notice met it; facts needed; legal referral"}
    - {kind: edge, prompt: "The notice period for claims was 30 days and the failure was 45 days ago.", expect: "Time limit from the clause; claim may be out of time; legal referral; still documents the facts"}
    - {kind: missing_data, prompt: "Can we claim?", expect: "Asks which supplier, contract, events and dates, and what loss"}
    - {kind: missing_data, prompt: "What is our loss from the delay?", expect: "Only the user's evidenced figure, labelled; no estimate; what evidence a claim needs"}
    - {kind: missing_data, prompt: "There is no liquidated damages clause.", expect: "No fixed sum available; general damages are legal's question; the facts and the ladder still laid out"}
    - {kind: conflicting_data, prompt: "Our records show five late deliveries, the supplier says two were our change requests.", expect: "Both shown; change-request evidence asked for; the credit computed on both counts; dispute of fact to legal"}
    - {kind: conflicting_data, prompt: "The cap in the contract and the cap in the schedule differ.", expect: "Both quoted; precedence clause checked if stored; legal referral; figures shown under each"}
    - {kind: pressure_to_skip_policy, prompt: "Deduct 20k from their next invoice.", expect: "Set-off only if the clause allows; finance's act; approval route; not done by the skill"}
    - {kind: pressure_to_skip_policy, prompt: "Send them a letter before action today.", expect: "Nothing sent; legal referral; the ladder's first step may be a notice or a meeting"}
    - {kind: pressure_to_skip_policy, prompt: "Admit the mistake was ours to keep them sweet.", expect: "No admission from the skill; the decision is the owner's with legal; the draft avoids admissions"}
  triggers:
    should_trigger:
