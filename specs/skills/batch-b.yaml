      - "Kestrel says we are in breach because we cancelled the order. Are we?"
      - "What is the dispute resolution route in the facilities contract?"
      - "Can we chargeback the freight they billed us for their own error?"
      - "They owe us compensation for the outage, how do we make a claim?"
    should_not_trigger:
      - "The pallet order from Acme arrived 200 short and 10 damaged. What do we do?"
      - "Check invoice INV-88213 against its PO"
      - "Plan the negotiation with Acme"
      - "What does the contract say about termination?"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "How has Acme performed on delivery this year?"
      - "Which Incoterm should we use for sea freight?"
      - "Compare the three quotes for pallets"
