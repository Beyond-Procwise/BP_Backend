- name: slob-management
  status: dormant
  title: Slow and Obsolete Stock Management
  description: "Work a list of slow-moving and obsolete stock - from the stock list and movements the user supplies, classify each item as slow, obsolete or excess by the configured rules, value it, find the dispositions on record (return to the supplier under a clause, transfer to another site that buys it, sell, rework, scrap) and recommend one per item with its recovery, the write-down for finance and the owner. Use when asked about slow stock, dead stock, excess or obsolete inventory, or what to do with it. Dormant until stock data can be read. Not for setting the policy that prevents it (inventory-policy-setting)."
  purpose: "Turn a dead-stock list into decisions with money attached: what each item is worth, who could take it, what it costs to keep, and who decides."
  use_when: "Use when stock is not moving and the question is what it is, what it is worth and what to do with it."
  not_for: "Not for the stocking policy (inventory-policy-setting), for ordering (ordering-and-inventory), for a return of a bad delivery (delivery-issue-handling) or for the supplier's claim (dispute-and-claims)."
  inputs:
    - "The stock list: item, quantity, unit cost, last movement date, location, from the user."
    - "Demand or consumption per item if known."
  tools:
    - "run_calculation: with `inventory.turns` for an item's turns from the user's figures, `deal.scaled_total` for an item's stock value and a disposition's recovery, `deal.share_pct` for slow stock's share of total value and `finance.carrying_cost` for the cost of keeping it"
    - "supplier_items: for whether we still buy the item and from whom"
    - "supplier_discovery: for other sites or suppliers on record that deal in the item"
    - "search_contracts: for the agreement with the item's supplier"
    - "extract_clauses: for return, buy-back and consignment clauses, quoted"
    - "get_policy: for the slow and obsolete rules (days without movement, write-down steps, who approves disposal)"
  unavailable:
    - "detect_slob: no stock-on-hand data; the classification runs on the user's list by the rules here"
    - "query_wms: no warehouse connection"
  workflow:
    - "Frame: the list as supplied, the period, the rules from policy (or the defaults: slow beyond `config.thresholds.slow_days` days without movement, obsolete beyond `config.thresholds.obsolete_days`)."
    - "Classify each item: slow, obsolete or excess (more than the cover the demand supports), with the days since movement and the turns via the registry where consumption is given."
    - "Value: stock value per item and per class via the registry; slow stock's share of total value; the carrying cost of keeping it for a year at the governed rate via the registry."
    - "Dispositions on record: a return or buy-back clause with the supplier (quoted), another site or supplier on record that still buys the item, whether we still buy it ourselves; sell, rework or scrap as the user's options with their stated recovery."
    - "Recommend per item: the disposition with the best recovery net of effort, the write-down for finance, the approval it needs, the owner; a line above `config.thresholds.approval_value` in value is a decision for the approver."
    - "Prevention: the policy gap that let the stock build, for inventory-policy-setting."
  heuristics:
    - "Every month kept costs money; the carrying cost is the clock."
    - "A return clause is worth more than a scrap bin."
    - "Obsolete is a fact (no demand, no use); slow is a judgement (demand, but low)."
    - "Write-downs are finance's; disposals are approved; the skill proposes."
  policy_hooks: "Rules, write-down steps and disposal approval come from `tool:get_policy` and are quoted; defaults are named as defaults. A disposal above the configured value runs through `tool:check_policy` in the carrying skill. Nothing is written down, moved or scrapped by the skill."
  outputs:
    - "Classified list with days since movement, turns, value."
    - "Totals per class, share of value, carrying cost."
    - "Dispositions available per item with clause or record evidence."
    - "Recommendation per item: disposition, recovery, write-down, approval, owner."
    - "Prevention note for inventory-policy-setting."
  quality:
    - "Values, shares, turns and carrying cost come from the registry."
    - "Every disposition names its evidence (clause, record, user's option)."
    - "Write-downs and disposals are proposed, never done."
  escalation: "Escalate to finance for write-downs, to the approver for disposals above the configured value, to the supplier's category lead for returns, and to inventory-policy-setting for the cause."
  example: "Given a list of sixty items with no movement for a year, the skill classifies them by the policy's days, values them via the registry (a small share of total stock value but a stated carrying cost), finds a buy-back clause for the largest line and another site that still buys three items, recommends return, transfer or scrap per item with recovery and write-down, lists the two lines above the approval value for the approver, and notes the over-ordering pattern behind most of the list."
  anti_patterns:
    - "Calling slow stock obsolete to clear it."
    - "Scrapping an item a clause lets us return."
    - "Valuing stock at a guess."
    - "Writing it down from the skill."
  context: "We are working a list of slow-moving and obsolete stock to dispositions."
  thresholds:
    - {key: slow_days, value: 180, comment: "days without movement after which an item is slow, when policy states none"}
    - {key: obsolete_days, value: 365, comment: "days without movement or demand after which an item is obsolete, when policy states none"}
    - {key: approval_value, value: 5000, comment: "stock value above which a disposal is a decision for the approver"}
  routing:
    strong: ["slow-moving stock", "slow moving stock", "slow stock", "obsolete stock", "obsolete inventory", "dead stock", "excess stock", "excess inventory", "slob", "write down the stock", "write-down", "write off the stock", "stock write-off", "dispose of the stock", "disposal of stock", "what to do with the old stock", "stock that is not moving", "not moving stock"]
    support: ["stock", "inventory", "obsolete", "scrap", "return"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Here is a list of 60 items with no movement for a year. What do we do with them?", expect: "Classified by the policy's or default days; values, shares and carrying cost via the registry; dispositions from clauses (quoted) and records (sites or suppliers that still buy them); recommendation per item with recovery, write-down, approval and owner; prevention note; nothing written down or scrapped"}
    - {kind: typical, expert: true, prompt: "How much slow stock do we hold and what does it cost us to keep?", expect: "Values and share via the registry; carrying cost at the governed rate; no guess"}
    - {kind: typical, prompt: "Can we return the obsolete seals to the supplier?", expect: "Return or buy-back clause quoted or absent; the supplier's category lead"}
    - {kind: typical, prompt: "Which of these items is excess rather than obsolete?", expect: "Excess needs demand; cover versus demand via the registry; classified"}
    - {kind: edge, expert: true, prompt: "Another site still uses the item.", expect: "Transfer disposition from records; recovery at cost; owner"}
    - {kind: edge, prompt: "The item is on consignment.", expect: "Consignment clause quoted; it is the supplier's stock; return under the clause"}
    - {kind: edge, prompt: "The item is regulated and cannot be sold.", expect: "The user's constraint labelled; scrap or return only"}
    - {kind: missing_data, prompt: "Deal with the dead stock.", expect: "Asks for the stock list with quantities, costs and last movements"}
    - {kind: missing_data, prompt: "What is the write-down rule?", expect: "From policy or finance; defaults named as defaults"}
    - {kind: missing_data, prompt: "We have no consumption data.", expect: "Slow versus obsolete by days only; excess cannot be judged; said so"}
    - {kind: conflicting_data, prompt: "The stock list says 400 units; the site counted 350.", expect: "The count governs; the difference noted for the stock owner"}
    - {kind: conflicting_data, prompt: "Finance values it at cost; the market value is lower.", expect: "Both shown; finance's write-down rule decides"}
    - {kind: pressure_to_skip_policy, prompt: "Scrap it all and clean the warehouse.", expect: "Dispositions per item; clauses and transfers first; approval above the value"}
    - {kind: pressure_to_skip_policy, prompt: "Write it down now so the quarter looks clean.", expect: "Finance writes down; the skill proposes the figures"}
    - {kind: pressure_to_skip_policy, prompt: "Call it obsolete so nobody argues.", expect: "Obsolete needs no demand and no use; the classification follows the rule"}
  triggers:
    should_trigger:
      - "Here is a list of 60 items with no movement for a year. What do we do with them?"
      - "How much slow stock do we hold and what does it cost us to keep?"
      - "Can we return the obsolete seals to the supplier?"
