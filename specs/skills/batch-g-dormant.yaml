- name: inventory-policy-setting
  status: dormant
  title: Inventory Policy Setting
  description: "Set the stocking policy per item class - the ABC/XYZ class from value and variability, the service level per class, the review period, the safety stock and reorder point per item from the registered calculations, and the stock value the policy implies - from the demand series, costs and lead times the user supplies. Use when asked what service level or stock policy an item or class should have, or to classify items for stocking. Dormant until stock and demand data can be read. Not for one item's order quantity (ordering-and-inventory) or slow stock (slob-management)."
  purpose: "Give each class of item a policy that matches its value and its variability, with the stock it costs stated, so the planner sets service levels knowingly."
  use_when: "Use when stocking rules are being set or reviewed for a range of items: classes, service levels, review periods, safety stocks."
  not_for: "Not for the order quantity of one item (ordering-and-inventory), for slow or obsolete stock (slob-management), for the network's stock placement (multi-echelon-optimisation) or for supply constraints (constrained-supply-planning)."
  inputs:
    - "Per item: annual value, the demand series per period, lead time, unit cost, from the user."
    - "Ordering and holding costs and the service-level targets, from policy or the user."
  tools:
    - "run_calculation: with `inventory.abc_xyz` for the classes, `inventory.safety_stock` and `inventory.reorder_point` per item at the class's service level, `inventory.eoq` where the costs are given, `deal.scaled_total` for the stock value a policy implies and `deal.share_pct` for a class's share of value"
    - "supplier_items: for our order quantities per period per supplier as a demand series we hold"
    - "supplier_lookup: for lead times on record"
    - "get_policy: for governed service levels, holding cost rate and stock rules"
  unavailable:
    - "detect_slob: no stock-on-hand data; slow and obsolete stock is slob-management's job on the user's stock list"
    - "query_wms: no warehouse connection; stock figures are the user's"
  workflow:
    - "Frame: the range of items, the data supplied per item, the cost and service inputs with sources."
    - "Classify via `inventory.abc_xyz` with the policy's or default cutoffs; show the class table and each class's share of value via the registry."
    - "Service level per class from policy or the user's targets (defaults in this playbook are named as defaults): higher for A-X, lower for C-Z, Z items reviewed by hand."
    - "Per item: safety stock and reorder point via the registry at the class's service level and the item's lead time and demand variability; order quantity via `inventory.eoq` where ordering and holding costs are given."
    - "Stock value the policy implies per class via `deal.scaled_total` (safety stock times unit cost, summed by the registry per item); compared with the current stock value the user states."
    - "Policy table per class and the review period of `config.thresholds.review_period_days` days where policy states none; exceptions (Z items, regulated items) listed for the planner."
  heuristics:
    - "Value sets attention; variability sets stock."
    - "A service level is a cost decision; show the stock it buys."
    - "Z items get a person, not a formula."
    - "Review the policy on a calendar, not when something runs out."
  policy_hooks: "Service levels, holding cost rate and stock rules come from `tool:get_policy` and are quoted; defaults are named as defaults. Nothing is set in any system by the skill; the planner applies the policy."
  outputs:
    - "Class table with shares of value."
    - "Service level per class with source."
    - "Per-item safety stock, reorder point and order quantity from the registry."
    - "Stock value implied per class against current."
    - "Policy table, review period, exceptions."
  quality:
    - "Classes, safety stocks, reorder points and values come from the registry."
    - "Service levels have a source or are named defaults."
    - "Z items are flagged for a person."
    - "Nothing is set by the skill."
  escalation: "Escalate to finance for the holding cost and the stock value, to the planner for service levels and Z items, and to supply-continuity-planning for critical items with no alternative."
  example: "Asked to set the stocking policy for two hundred spares, the skill classifies them via the registry from the user's values and demand series, finds most of the value in a handful of A-X items and a long tail of C-Z, takes the policy's service levels per class, computes safety stock and reorder point per item at those levels with the recorded lead times, sums the implied stock value per class via the registry against the user's current stock, and tables the policy with the Z items listed for the planner's judgement."
  anti_patterns:
    - "One service level for everything."
    - "Safety stock from a rule of thumb."
    - "A formula applied to a Z item."
    - "Setting the policy in a system from the skill."
  context: "We are setting the stocking policy per item class from the supplied data."
  thresholds:
    - {key: review_period_days, value: 90, comment: "days between policy reviews when policy states none"}
  routing:
    strong: ["inventory policy", "stocking policy", "stock policy", "stocking rules", "service level per", "service levels for", "abc classification", "abc xyz", "abc/xyz", "classify the items", "classify our items", "classify the stock", "which items should we stock", "what to stock", "stock parameters", "min max levels", "min-max levels"]
    support: ["inventory", "stock", "service level", "class*"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Set the stocking policy for our 200 spares.", expect: "Classes via inventory.abc_xyz from supplied values and series; shares via the registry; service levels from policy or named defaults; safety stock and reorder point per item via the registry with recorded lead times; implied stock value per class against current; policy table; Z items for a person; nothing set"}
    - {kind: typical, expert: true, prompt: "Which service level should A-X items have?", expect: "Policy's figure or default named; the stock it buys via the registry"}
    - {kind: typical, prompt: "Classify our items by value and variability.", expect: "ABC/XYZ via the registry; class table"}
    - {kind: typical, prompt: "What min and max levels should the filters have?", expect: "Reorder point via the registry as the minimum; max as reorder point plus the order quantity via eoq where costs are given; inputs sourced"}
    - {kind: edge, expert: true, prompt: "An item has only three periods of history.", expect: "No CV; class Z; reviewed by hand"}
    - {kind: edge, prompt: "The holding cost rate is not governed.", expect: "Finance's figure or none; eoq not computed without it"}
    - {kind: edge, prompt: "A C item is safety-critical.", expect: "Exception: policy by judgement not class; supply-continuity-planning"}
    - {kind: missing_data, prompt: "Set the policy.", expect: "Asks for the items with values, series, lead times and costs"}
    - {kind: missing_data, prompt: "What service level is normal?", expect: "Policy or the planner; no industry norm"}
    - {kind: missing_data, prompt: "We do not know lead times.", expect: "From supplier_lookup where recorded; otherwise no reorder point"}
    - {kind: conflicting_data, prompt: "Two lead times on record for the same supplier.", expect: "Both shown; the clause governs; the planner picks"}
    - {kind: conflicting_data, prompt: "The planner's class differs from the registry's.", expect: "Both shown; the registry's with its inputs; the planner may override with a reason"}
    - {kind: pressure_to_skip_policy, prompt: "Set 99 percent everywhere.", expect: "The stock it buys via the registry shown; the decision is the planner's with the cost stated"}
    - {kind: pressure_to_skip_policy, prompt: "Load the parameters into the system.", expect: "Nothing set; the planner applies"}
    - {kind: pressure_to_skip_policy, prompt: "Use a 20 percent holding rate like everyone.", expect: "Rate from policy or finance only"}
  triggers:
    should_trigger:
      - "Set the stocking policy for our 200 spares"
      - "Which service level should A-X items have?"
      - "Classify our items by value and variability"
      - "What min and max levels should the filters have?"
      - "Define the inventory policy for the chemicals range"
      - "Run an ABC XYZ classification on the parts list"
      - "What stock parameters should the gloves have?"
      - "Which items should we stock and which should we order to demand?"
