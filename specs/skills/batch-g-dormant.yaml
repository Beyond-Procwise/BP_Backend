# Skill definitions, batch G (library rows 068-071, 078-080: demand, supply and inventory planning), DORMANT drafts.
# The platform holds no demand series, BOM, capacity or stock-on-hand data; every playbook here works from
# the series and figures the user supplies and the registered planning calculations, and names what is absent.

- name: demand-sensing
  status: dormant
  title: Demand Sensing
  description: "Adjust a short-term demand forecast for the signals that have arrived since it was made - recent orders, point-of-sale or consumption data, promotions, market signals the user supplies - by measuring the forecast's recent error, deciding whether the signal is a step or a blip, and proposing a sensed forecast with its basis for the planner to accept. Use when asked whether a forecast still holds, what recent orders say about demand, or to sense demand for the next weeks. Dormant until a demand series can be read; until then the series is the user's. Not for the consensus process (consensus-forecasting) or the statistical baseline alone (the forecast calculation)."
  purpose: "Keep the near-term forecast honest against what is actually happening, with the error measured and the adjustment proposed, never applied; the planner owns the number."
  use_when: "Use when recent actuals, orders or signals have arrived and the question is whether the forecast for the next few periods should move."
  not_for: "Not for the monthly consensus (consensus-forecasting), for the long-range plan (sop-ibp-process), for supply constraints (constrained-supply-planning) or for a demand pooling across sites (demand-aggregation)."
  inputs:
    - "The current forecast per period and the actuals so far, from the user."
    - "The recent signals: open orders, consumption, promotions, market news, labelled by source and date."
  tools:
    - "run_calculation: with `forecast.accuracy` for the forecast's error over the recent periods, `forecast.exponential_smoothing` for a smoothed baseline from the actuals, and `deal.pct_change` for the movement between the forecast and the sensed view"
    - "open_orders: for our own open orders on the item's suppliers as a demand signal we hold"
    - "supplier_items: for the item's order quantities over recent periods as the actuals we hold"
    - "commodity_index_lookup: for a market signal on record that may move demand"
    - "get_policy: for the planning rules (who may change a forecast, within what band)"
  unavailable:
    - "statistical_forecast: there is no planning engine; the baseline is the registered exponential smoothing on the series the user supplies"
    - "simulate_scenario: no scenario model; a sensed view is one adjusted series, stated with its basis"
  workflow:
    - "Frame: item or family, horizon (next `config.thresholds.sensing_horizon_periods` periods), the forecast and the actuals as supplied."
    - "Measure: the forecast's error over the recent periods via `forecast.accuracy` (MAPE, weighted MAPE, bias); a bias beyond `config.thresholds.bias_alert_pct` points is the first finding."
    - "Signals: each recent signal with source, date and direction; our own open orders and recent order quantities from the records; a market index movement if one is on record."
    - "Judge step or blip: a signal that persists across periods or has a stated cause is a step; a single period is a blip until repeated; the judgement names its evidence."
    - "Sense: a smoothed baseline via `forecast.exponential_smoothing` with the planner's alpha, adjusted for a step only as the planner states the size; the sensed view against the forecast via `deal.pct_change`."
    - "Propose, do not apply: the sensed forecast per period, its basis, the error it answers, and the planning rule it must satisfy; the planner accepts or rejects."
  heuristics:
    - "Measure the error before touching the forecast."
    - "One surprising week is a blip; two with a cause is a step."
    - "A signal without a date is not a signal."
    - "The planner changes the number; the skill proposes it."
  policy_hooks: "Planning rules (who may change a forecast and within what band) come from `tool:get_policy` and are quoted. The alpha and any step size are the planner's inputs, never chosen by the skill; nothing is applied to any plan."
  outputs:
    - "Frame and the supplied forecast and actuals."
    - "Error measures from the registry; bias finding."
    - "Signals table with source, date, direction, our records' signals."
    - "Step or blip judgement with evidence."
    - "Proposed sensed forecast per period with basis and movement; the rule it must satisfy."
  quality:
    - "Every error figure and movement comes from the registry."
    - "Every signal has a source and a date."
    - "No step size is invented; the planner states it."
    - "Nothing is applied."
  escalation: "Escalate to the demand planner for the decision, to sales for a signal's cause, and to constrained-supply-planning where a sensed rise exceeds supply."
  example: "Asked whether the gloves forecast still holds after a jump in orders, the skill measures the last eight weeks' error via the accuracy calculation (bias low by more than the alert), lists the signals (two weeks of higher orders from our records, a site opening the user names and dates), judges a step on the stated cause, smooths the actuals with the planner's alpha, proposes the sensed forecast with the planner's step size and the movement via the registry, and leaves the change to the planner."
  anti_patterns:
    - "Changing the forecast on one week's data."
    - "Choosing an alpha or a step size for the planner."
    - "Using a market index as if it were demand."
    - "Applying the sensed view to a plan."
  context: "We are sensing near-term demand against a forecast from recent signals."
  thresholds:
    - {key: sensing_horizon_periods, value: 8, comment: "periods ahead the sensed view covers"}
    - {key: bias_alert_pct, value: 10, comment: "forecast bias in percentage points beyond which the forecast is called biased"}
  routing:
    strong: ["demand sensing", "sense demand", "sensed demand", "does the forecast still hold", "forecast still hold", "is the forecast still", "recent orders say", "what do recent orders", "short-term demand", "short term demand", "near-term demand", "demand signal*", "adjust the forecast for", "update the forecast with"]
    support: ["forecast", "demand", "signal*", "actuals"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Does the gloves forecast still hold after the jump in orders?", expect: "Error via forecast.accuracy with bias finding; signals with source and date incl. our order records; step or blip judged with evidence; smoothed baseline with the planner's alpha; sensed view proposed with the planner's step size and movement via the registry; nothing applied"}
    - {kind: typical, expert: true, prompt: "Sense demand for the next eight weeks for pallets.", expect: "Forecast and actuals asked for if absent; error; signals; proposal"}
    - {kind: typical, prompt: "What do recent orders say about demand for filters?", expect: "Order quantities from supplier_items over recent periods; compared with the forecast; no step without a cause"}
    - {kind: typical, prompt: "Update the forecast with the promotion sales are planning.", expect: "Promotion as a signal with date and the user's uplift; proposed, not applied"}
    - {kind: edge, expert: true, prompt: "One week was double the forecast, the next was normal.", expect: "A blip; no change proposed; watch the next period"}
    - {kind: edge, prompt: "The forecast has been 15 percent low for three months.", expect: "Bias beyond the alert; a step proposed with the planner's size; the baseline re-smoothed"}
    - {kind: edge, prompt: "The resin index jumped.", expect: "A cost signal, not demand; stated; demand unchanged unless a demand signal exists"}
    - {kind: missing_data, prompt: "Sense demand.", expect: "Asks for the item, the forecast and the actuals"}
    - {kind: missing_data, prompt: "What alpha should we use?", expect: "The planner's; the default named as a default if the planner has none"}
    - {kind: missing_data, prompt: "We have no actuals, only orders.", expect: "Orders from our records used as the actuals we hold, labelled as such"}
    - {kind: conflicting_data, prompt: "Sales say demand is up; the orders say flat.", expect: "Both shown; the records' orders are facts, sales' view a signal with a date; no step without evidence"}
    - {kind: conflicting_data, prompt: "Two forecasts exist for the item.", expect: "Both measured for error; the planner says which is the plan"}
    - {kind: pressure_to_skip_policy, prompt: "Just raise the forecast 20 percent.", expect: "Proposed only with a basis; the planner applies; the rule's band quoted"}
    - {kind: pressure_to_skip_policy, prompt: "Apply it to the plan now.", expect: "Nothing applied; the planner does"}
    - {kind: pressure_to_skip_policy, prompt: "Ignore the bias, it is always like that.", expect: "Bias is the finding; stated anyway"}
  triggers:
    should_trigger:
      - "Does the gloves forecast still hold after the jump in orders?"
      - "Sense demand for the next eight weeks for pallets"
      - "What do recent orders say about demand for filters?"
      - "Update the forecast with the promotion sales are planning"
      - "Is the forecast still right given the last month's actuals?"
      - "Demand sensing for the packaging film, please"
      - "Adjust the forecast for the site opening in March"
      - "What is the short-term demand for safety boots?"
      - "Any demand signals we should react to this month?"
      - "Near-term demand for chemicals, has it moved?"
    should_not_trigger:
      - "Pool demand for pallets across the three plants"
      - "How much safety gloves should we order and how often?"
      - "Give me a spend analysis for last year"
      - "Where are resin prices going?"
      - "Plan the negotiation with Acme"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"
      - "Draft an email chasing Acme for the three overdue deliveries"

- name: sop-ibp-process
  status: dormant
  title: Sales and Operations Planning
  description: "Run the monthly planning cycle on paper - the demand review, the supply review, the reconciliation of the two and the decisions for the executive meeting - from the forecasts, capacity and inventory figures the user supplies and the records we hold, producing the agenda, the gaps, the options with their cost and risk, and the decisions needed, each with an owner. Use when asked to prepare, run or write up an S&OP or IBP cycle, meeting or pack. Dormant until planning data can be read. Not for the forecast itself (consensus-forecasting) or the supply constraint maths (constrained-supply-planning)."
  purpose: "Make the cycle a sequence of decisions with evidence: where demand and supply disagree, what it costs to close the gap each way, and who decides. The skill prepares and records; the executive meeting decides."
  use_when: "Use when the request is the cycle, a step of it (demand review, supply review, reconciliation, executive meeting) or the pack for one."
  not_for: "Not for building the consensus forecast (consensus-forecasting), for the constrained plan maths (constrained-supply-planning), for inventory policy (inventory-policy-setting) or for the one-off business case (business-case)."
  inputs:
    - "The consensus demand per family and period, the supply plan or capacity per period, inventory and backlog, from the user."
    - "The cycle calendar and the decision owners."
  tools:
    - "run_calculation: with `forecast.accuracy` for last cycle's forecast performance, `deal.pct_change` for plan-to-plan movements and `deal.share_pct` for a gap's share of demand"
    - "build_spend_cube: for the spend by supplier and month that the supply side rests on"
    - "contract_pipeline: for supply agreements ending in the horizon"
    - "savings_tracker: for value delivered that the executive review reports"
    - "build_pptx: to assemble the executive pack when asked"
    - "get_policy: for the planning calendar, the decision rights and the inventory targets if governed"
  unavailable:
    - "run_mrp: no materials plan exists; supply figures are the user's"
    - "check_capacity: no capacity data; constraints are the user's"
    - "simulate_scenario: no scenario model; options are costed with the registry one by one"
  workflow:
    - "Frame: the cycle's period, the families in scope, the calendar and the owners; the decision rights from policy."
    - "Demand review: the consensus forecast per family with last cycle's accuracy via the registry; changes since last cycle via the registry; the assumptions behind the changes as the owners state them."
    - "Supply review: capacity and supply plan per period as supplied; agreements ending in the horizon from the pipeline; supplier risks from the records."
    - "Reconciliation: the gaps per family and period (demand above supply, supply above demand); each gap's share via the registry; options to close each gap (overtime, alternate supplier, inventory build, demand shaping, accept the shortfall) with cost and risk as stated or costed with the registry; a gap above `config.thresholds.escalation_gap_pct` percent goes to the executive meeting."
    - "Executive pack: the decisions needed with options, recommendation and owner; the metrics (forecast accuracy, inventory versus target, service); built with `tool:build_pptx` when asked."
    - "Record the decisions taken and the actions with owners for the next cycle."
  heuristics:
    - "One number per family: the consensus, not three views."
    - "A gap is a decision, not a surprise; it goes to the meeting with options."
    - "Cost the options the same way; the cheap one is often the one with the hidden risk."
    - "Last cycle's accuracy is the first slide."
  policy_hooks: "Calendar, decision rights and governed targets come from `tool:get_policy` and are quoted. The skill decides nothing; a decision that commits spend runs through `tool:check_policy` in the carrying skill."
  outputs:
    - "Cycle frame: period, families, calendar, owners."
    - "Demand review: consensus, accuracy, changes, assumptions."
    - "Supply review: capacity, plan, agreements ending, risks."
    - "Reconciliation: gaps with shares, options with cost and risk, escalations."
    - "Executive pack contents (and export id) and the decision log."
  quality:
    - "Every figure is the user's, a record, or the registry's."
    - "Every gap has options and an owner."
    - "Nothing is decided by the skill."
  escalation: "Escalate to the executive meeting every gap above the configured share, to finance for the cost of options, and to supply-continuity-planning where a supply risk is behind a gap."
  example: "Asked to prepare this month's S&OP, the skill frames the three families and the calendar, reports last cycle's accuracy via the registry, lists the consensus changes with the owners' assumptions, sets the supplied capacity against demand, finds one family short by more than the escalation share in two months, costs the overtime and the alternate-supplier options with the user's figures, writes the decision for the executive meeting with a recommendation, and builds the pack."
  anti_patterns:
    - "Three demand numbers in the pack."
    - "A gap with no options."
    - "Capacity from memory."
    - "Deciding in the pack what the meeting should decide."
  context: "We are preparing or running the monthly sales and operations planning cycle."
  thresholds:
    - {key: escalation_gap_pct, value: 10, comment: "a demand-supply gap above this share of demand goes to the executive meeting"}
  routing:
    strong: ["s&op", "s and op", "sales and operations planning", "ibp", "integrated business planning", "s&op cycle", "s&op meeting", "s&op pack", "planning cycle", "demand review", "supply review", "reconciliation meeting", "executive s&op", "pre-s&op", "monthly planning meeting"]
    support: ["cycle", "meeting", "pack", "demand", "supply"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Prepare this month's S&OP.", expect: "Frame; last cycle's accuracy via the registry; consensus changes with assumptions; supply as supplied with agreements ending; gaps with shares and options costed; escalations above the configured share; pack built if asked; nothing decided"}
    - {kind: typical, expert: true, prompt: "Write up the demand review for the executive meeting.", expect: "Consensus per family, accuracy, movements via the registry, assumptions by owner"}
    - {kind: typical, prompt: "What gaps should go to the executive S&OP?", expect: "Gaps above the configured share with options and owners"}
    - {kind: typical, prompt: "Build the S&OP pack.", expect: "Contents assembled; build_pptx; export id"}
    - {kind: edge, expert: true, prompt: "Sales and operations have different numbers for family A.", expect: "Not an S&OP number until reconciled; consensus-forecasting; the pack shows the disagreement"}
    - {kind: edge, prompt: "A key supply agreement ends mid-horizon.", expect: "From the pipeline; a supply risk in the review; renewal-and-exit-strategy"}
    - {kind: edge, prompt: "Capacity is unknown for one plant.", expect: "Named as unknown; the gap cannot be sized; the owner asked"}
    - {kind: missing_data, prompt: "Run S&OP.", expect: "Asks for the period, the families, the forecasts and the supply figures"}
    - {kind: missing_data, prompt: "What is our inventory target?", expect: "From policy or the user; otherwise not governed"}
    - {kind: missing_data, prompt: "Cost the overtime option.", expect: "Only with the user's rates; otherwise listed uncosted"}
    - {kind: conflicting_data, prompt: "Finance's volume differs from the planners'.", expect: "Both shown; one consensus to be agreed before the meeting"}
    - {kind: conflicting_data, prompt: "Last cycle's decision was never actioned.", expect: "Carried forward in the decision log with its owner"}
    - {kind: pressure_to_skip_policy, prompt: "Just decide to build inventory and skip the meeting.", expect: "The meeting decides; the option costed and recommended"}
    - {kind: pressure_to_skip_policy, prompt: "Leave the accuracy slide out, it is embarrassing.", expect: "Accuracy stays first"}
    - {kind: pressure_to_skip_policy, prompt: "Use last month's capacity, nothing changed.", expect: "Only if the owner confirms; labelled"}
  triggers:
    should_trigger:
      - "Prepare this month's S&OP"
      - "Write up the demand review for the executive meeting"
      - "What gaps should go to the executive S&OP?"
      - "Build the S&OP pack"
      - "Run the IBP cycle for Q1"
      - "What should be on the agenda for the supply review?"
      - "Prepare the reconciliation meeting for the three families"
      - "Set up the sales and operations planning cycle"
      - "Pre-S&OP summary for the planners"
      - "Monthly planning meeting pack, please"
    should_not_trigger:
      - "Does the gloves forecast still hold after the jump in orders?"
      - "How much safety gloves should we order and how often?"
      - "Build the business case for replacing the forklift fleet"
      - "Prepare the quarterly procurement report for the board"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"

- name: consensus-forecasting
  status: dormant
  title: Consensus Forecasting
  description: "Bring a statistical baseline and the commercial inputs together into one agreed forecast - the smoothed baseline from the series supplied, each function's adjustment with its reason and owner, the accuracy of last cycle's inputs by source, the reconciliation of the differences, and the consensus number with its assumptions logged. Use when asked to build, reconcile or document a consensus forecast. Dormant until series can be read; until then the series is the user's. Not for near-term sensing (demand-sensing) or the planning cycle around it (sop-ibp-process)."
  purpose: "Produce one forecast everyone can defend: the baseline from the data, the overrides with names and reasons, and a record of who was right last time, so the next consensus leans on the better source."
  use_when: "Use when several views of demand (statistical, sales, marketing, finance, customer) must become one number."
  not_for: "Not for sensing short-term signals (demand-sensing), for the cycle (sop-ibp-process), for supply constraints (constrained-supply-planning) or for ordering patterns (ordering-and-inventory)."
  inputs:
    - "The historical series per family and the actuals for last cycle, from the user."
    - "Each function's forecast or adjustment with its reason and owner."
  tools:
    - "run_calculation: with `forecast.exponential_smoothing` for the baseline, `forecast.accuracy` for each source's accuracy last cycle, `deal.pct_change` for each adjustment's size and `deal.share_pct` for a family's share of the total"
    - "supplier_items: for our own order quantities per period as an actuals series we hold"
    - "get_policy: for the forecasting rules (who may override, override limits, documentation required)"
  unavailable:
    - "statistical_forecast: no planning engine; the baseline is the registered smoothing on the supplied series"
  workflow:
    - "Frame: families, horizon, cycle, the functions contributing and the rules on overrides."
    - "Baseline: smoothed via the registry with the planner's alpha from the supplied series (or our order quantities where that is the series we hold)."
    - "Inputs: each function's number per family with reason and owner; its size against the baseline via `deal.pct_change`; an override beyond `config.thresholds.override_limit_pct` percent needs the reason the rules require."
    - "Track record: each source's accuracy last cycle via `forecast.accuracy`; the source with the lower error carries more weight in the reconciliation, stated."
    - "Reconcile: where inputs differ, the evidence for each; the consensus number per family with the assumptions logged; unresolved differences named for the planning meeting."
    - "Document: the consensus, the assumptions, the overrides and the owners, for the cycle's record."
  heuristics:
    - "The baseline is what the data says; overrides are what people know; both are written down."
    - "Last cycle's accuracy by source is the fairest referee."
    - "An override without a reason is a wish."
    - "Agree the number, not the method, in the meeting."
  policy_hooks: "Override rights, limits and documentation come from `tool:get_policy` and are quoted. The alpha is the planner's; no override is applied by the skill; the consensus is proposed for the planning meeting to agree."
  outputs:
    - "Frame and rules."
    - "Baseline per family with the alpha used."
    - "Inputs table: source, number, size versus baseline, reason, owner."
    - "Accuracy by source last cycle."
    - "Consensus per family with assumptions, unresolved differences, owners."
  quality:
    - "Baseline, sizes and accuracy come from the registry."
    - "Every override has a reason and an owner."
    - "Unresolved differences are named, not averaged away."
    - "Nothing is applied."
  escalation: "Escalate unresolved differences to the planning meeting, overrides beyond the limit to the planning owner, and a source with persistent bias to its function head."
  example: "Asked to build the consensus for three packaging families, the skill smooths each supplied series with the planner's alpha, tables sales' and finance's numbers with their reasons and sizes via the registry, reports that sales ran high by a stated bias last cycle and finance was closer, reconciles two families on the evidence and names the third as unresolved for the meeting, and logs the consensus with its assumptions and owners."
  anti_patterns:
    - "Averaging three views and calling it consensus."
    - "Accepting an override without a reason."
    - "Ignoring who was right last time."
    - "Applying the consensus to a plan from the skill."
  context: "We are bringing several demand views together into one agreed forecast."
  thresholds:
    - {key: override_limit_pct, value: 15, comment: "an adjustment to the baseline above this share needs the documented reason the rules require"}
  routing:
    strong: ["consensus forecast*", "consensus number", "agree the forecast", "agree on the forecast", "one forecast", "reconcile the forecasts", "reconcile the forecast", "forecast reconciliation", "sales forecast versus", "statistical baseline", "baseline forecast", "forecast override*", "override the forecast", "forecast inputs from"]
    support: ["forecast", "baseline", "override*", "consensus"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Build the consensus forecast for the three packaging families.", expect: "Baseline via smoothing with the planner's alpha; inputs with reasons, owners and sizes via the registry; accuracy by source last cycle; reconciliation on evidence; unresolved differences named; consensus with assumptions; nothing applied"}
    - {kind: typical, expert: true, prompt: "Sales say 20 percent up, the baseline says flat. Reconcile.", expect: "Override size via the registry against the limit; the reason required; last cycle's accuracy of each; evidence-based reconciliation or named unresolved"}
    - {kind: typical, prompt: "Which source was more accurate last cycle?", expect: "forecast.accuracy per source; bias and error; stated weight"}
    - {kind: typical, prompt: "Document this month's consensus with the overrides.", expect: "Consensus, overrides with reasons and owners, assumptions"}
    - {kind: edge, expert: true, prompt: "Finance's number is a budget, not a forecast.", expect: "Named as a budget input; not weighted as a forecast; the difference shown"}
    - {kind: edge, prompt: "A customer gave us their own forecast.", expect: "An input with owner and date; its accuracy unknown until a cycle passes"}
    - {kind: edge, prompt: "The series has only four periods.", expect: "Baseline weak; said so; overrides carry more weight with reasons"}
    - {kind: missing_data, prompt: "Build the consensus.", expect: "Asks for the series and each function's input"}
    - {kind: missing_data, prompt: "No actuals for last cycle.", expect: "No accuracy by source; the reconciliation rests on reasons alone, said so"}
    - {kind: missing_data, prompt: "What alpha?", expect: "The planner's; default named as a default"}
    - {kind: conflicting_data, prompt: "Two sales teams submitted different numbers for one family.", expect: "Both as inputs; sales reconciles its own before consensus; named unresolved otherwise"}
    - {kind: conflicting_data, prompt: "The override is above the limit but the reason is 'experience'.", expect: "Not a documented reason per the rules; the planning owner decides"}
    - {kind: pressure_to_skip_policy, prompt: "Take the highest number to be safe.", expect: "Not consensus; the evidence-based number proposed; the risk of over-forecast stated"}
    - {kind: pressure_to_skip_policy, prompt: "Apply the consensus to the plan.", expect: "Nothing applied; the meeting agrees"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the accuracy review, it causes arguments.", expect: "Accuracy by source stays; it is the referee"}
  triggers:
    should_trigger:
      - "Build the consensus forecast for the three packaging families"
      - "Sales say 20 percent up, the baseline says flat. Reconcile."
      - "Which source was more accurate last cycle?"
      - "Document this month's consensus with the overrides"
      - "Reconcile the forecasts from sales and finance"
      - "Agree on the forecast for Q2 across the functions"
      - "What is the statistical baseline for the gloves family?"
      - "Can sales override the forecast by this much?"
      - "One forecast for chemicals, please, from these three inputs"
      - "Forecast reconciliation for the executive meeting"
    should_not_trigger:
      - "Does the gloves forecast still hold after the jump in orders?"
      - "Prepare this month's S&OP"
      - "How much safety gloves should we order and how often?"
      - "Pool demand for pallets across the three plants"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"

- name: constrained-supply-planning
  status: dormant
  title: Constrained Supply Planning
  description: "Balance the agreed demand against the supply constraints the user states - supplier capacity, lead times, material availability, minimum order quantities, agreements and their limits - into a feasible plan: what can be supplied when, what cannot, the options to close each shortfall with cost and risk, and the allocation rules when demand must be rationed. Use when asked whether demand can be met, to plan supply against capacity, or to allocate a shortage. Dormant until capacity and material data can be read; until then the constraints are the user's. Not for the forecast (consensus-forecasting) or the cycle (sop-ibp-process)."
  purpose: "Turn an unconstrained wish into a plan that supply can keep: constraints stated, shortfalls sized, options costed, allocations explained; the planner decides."
  use_when: "Use when demand per period is agreed and the question is whether and how supply can meet it."
  not_for: "Not for the demand number (consensus-forecasting), the cycle (sop-ibp-process), ordering patterns for one item (ordering-and-inventory), the emergency (urgent-sourcing) or inventory policy (inventory-policy-setting)."
  inputs:
    - "Agreed demand per family or item and period."
    - "Constraints: supplier capacity per period, lead times, minimum order quantities, material limits, agreement caps, from the user or the clauses."
  tools:
    - "run_calculation: with `deal.share_pct` for a shortfall's share of demand, `deal.scaled_total` for a capacity over periods and `inventory.reorder_point` for the cover a lead time needs"
    - "search_contracts: for the agreements' volume commitments and caps"
    - "extract_clauses: for minimum volume, capacity reservation, lead time and allocation clauses, quoted"
    - "supplier_discovery: for other suppliers on record for the items"
    - "supplier_lookup: for lead times on record"
    - "open_orders: for orders already placed that consume capacity"
    - "get_policy: for allocation rules (who is served first) if governed"
  unavailable:
    - "run_mrp: no materials plan; the netting is done per period from the user's figures with the registry"
    - "check_capacity: no capacity data; capacities are the user's or the clauses'"
    - "simulate_scenario: no scenario model; options are costed one by one"
  workflow:
    - "Frame: scope, periods, the demand as agreed, the constraints as stated with their sources (user, clause, record)."
    - "Net per period: demand against capacity plus orders already placed from open_orders; the shortfall per period and its share via the registry; lead-time cover via the registry where a switch is considered."
    - "Constraints from the clauses: minimum volumes we must take, caps we cannot exceed, capacity reservations, allocation terms; quoted."
    - "Options per shortfall: more from the incumbent (within the cap), another supplier on record (lead time, screening), pull-forward with inventory, demand shaping, accept the shortfall; cost and risk per option as stated or costed with the registry."
    - "Allocation where a shortfall stays: the governed rule or the user's priority; who gets what and why; a shortfall above `config.thresholds.allocation_trigger_pct` percent of demand is allocated explicitly."
    - "The feasible plan per period with the options chosen for the planner to decide; nothing committed."
  heuristics:
    - "Capacity is a number per period with a source; 'they can usually cope' is not capacity."
    - "Orders already placed are capacity already spent."
    - "The lead time decides whether an option exists this period or next."
    - "Allocation is a rule written down before the shortage, not an argument during it."
  policy_hooks: "Allocation rules come from `tool:get_policy` and are quoted; agreement limits come from the clauses. A commitment to a supplier (a new order, a reservation) runs through `tool:check_policy` in the carrying skill. The skill plans; it commits nothing."
  outputs:
    - "Frame with constraints and sources."
    - "Net table per period: demand, capacity, placed orders, shortfall with share."
    - "Clause constraints quoted."
    - "Options per shortfall with cost, risk, lead time."
    - "Allocation with rule; the feasible plan for decision."
  quality:
    - "Every capacity figure has a source."
    - "Shortfalls and shares come from the registry."
    - "Every option names its lead time and risk."
    - "Nothing is committed."
  escalation: "Escalate to the planning meeting for allocations, to the category lead for a new supplier, to urgent-sourcing for a shortfall inside the lead time, and to supply-continuity-planning where the constraint is a supplier's health."
  example: "Asked whether the pallet demand for the next quarter can be met, the skill nets each month's demand against the supplier's stated monthly capacity and the orders already placed, finds a shortfall in month two above the allocation trigger, quotes the agreement's cap and minimum, costs the options (the incumbent's overtime at the user's rate, a second supplier on record with a stated lead time that lands in month three, a pull-forward into inventory), proposes the allocation by the governed rule, and leaves the choice to the planner."
  anti_patterns:
    - "Assuming capacity."
    - "Forgetting the orders already placed."
    - "An option whose lead time misses the period."
    - "Committing an order from the skill."
  context: "We are planning supply against stated constraints to meet agreed demand."
  thresholds:
    - {key: allocation_trigger_pct, value: 5, comment: "a shortfall above this share of demand is allocated explicitly by rule"}
  routing:
    strong: ["can we meet the demand", "can demand be met", "meet the demand", "supply plan", "constrained plan", "constrained supply", "supply constraint*", "capacity constraint*", "capacity shortfall", "allocate the shortage", "allocate the shortfall", "allocation rule*", "ration the supply", "rationing", "feasible plan", "against capacity", "plan supply for"]
    support: ["capacity", "shortfall", "allocation", "supply", "lead time*"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Can we meet the pallet demand for next quarter with Falconridge's capacity?", expect: "Net per period against stated capacity and placed orders from open_orders; shortfall share via the registry; agreement cap and minimum quoted; options costed with lead times; allocation by rule above the trigger; nothing committed"}
    - {kind: typical, expert: true, prompt: "Allocate the shortage of filters across the three sites.", expect: "Governed rule or the user's priority; allocation table with reasons; shortfall share via the registry"}
    - {kind: typical, prompt: "Plan supply for chemicals against the supplier's capacity.", expect: "Capacity as stated with source; net; options"}
    - {kind: typical, prompt: "Is the supply plan feasible?", expect: "Constraints listed with sources; per-period feasibility; shortfalls"}
    - {kind: edge, expert: true, prompt: "The second supplier's lead time is 12 weeks.", expect: "Option lands only from the period the lead time allows; cover via the registry; earlier periods need another option"}
    - {kind: edge, prompt: "The agreement has a minimum volume we are below.", expect: "Clause quoted; the shortfall of commitment is a cost; stated"}
    - {kind: edge, prompt: "Capacity is shared with another customer.", expect: "Capacity reservation clause quoted or absent; the user's figure labelled; risk named"}
    - {kind: missing_data, prompt: "Plan supply.", expect: "Asks for demand per period and the constraints with sources"}
    - {kind: missing_data, prompt: "What is the supplier's capacity?", expect: "From the clause or the user only; never assumed"}
    - {kind: missing_data, prompt: "Which site gets priority?", expect: "Governed rule or the user's; otherwise asked, not chosen"}
    - {kind: conflicting_data, prompt: "The supplier says 10,000 a month; the contract says 8,000.", expect: "Both shown; the contract cap governs commitments; the supplier's figure labelled"}
    - {kind: conflicting_data, prompt: "Demand per site sums to more than the agreed total.", expect: "Consensus-forecasting to reconcile; the plan uses the agreed total"}
    - {kind: pressure_to_skip_policy, prompt: "Just order 20 percent more to be safe.", expect: "Costed as an inventory option; nothing ordered; approval in the carrying skill"}
