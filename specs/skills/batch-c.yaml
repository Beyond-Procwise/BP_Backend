# Skill definitions, batch C. Rendered by scripts/skills/scaffold.py into skills/<name>/.

- name: procurement-process-guide
  title: Procurement Process Guide
  description: "Explain how a procurement process works here, step by step, from the governed policy and the records - source to contract, procure to pay, what happens after a requisition, who approves at each stage, where the three-way match sits, what a finding or a hold means and who clears it. Use when someone asks how the process works, what the steps are, what happens next or why something is stuck in it. Not for whether a specific purchase is allowed (procurement-policy-compliance) or which channel to use for one item (buying-channel-guidance)."
  purpose: "Give a plain-language walk-through of the process as this organisation actually runs it, with the governed rules quoted where they exist and the platform's own records used to say where a specific item sits. The skill explains; it approves, clears and moves nothing."
  use_when: "Use when the request is an explanation: how does it work, what are the steps, what happens after, why is this stuck, who does what, what does this status mean."
  not_for: "Not for a ruling on a specific purchase (procurement-policy-compliance), for the channel for one item (buying-channel-guidance), for an exception (policy-exception-request), for an invoice's status (invoice-query-handling) or for training material in a document."
  inputs:
    - "The process or stage asked about, and the role of the asker if given."
    - "A specific item (requisition, order, invoice or contract) when the question is about where it sits."
  tools:
    - "get_policy: for the governed rules at each stage (approval bands, required quotes, receipt rules, payment terms) quoted"
    - "list_governance: for the policies and rules that exist, so the explanation names what governs and what does not"
    - "invoice_reconciliation: for where a specific order or invoice sits and any finding or hold on it"
    - "contract_pipeline: for where a specific contract sits in its life"
  unavailable:
    - "build_docx: the walk-through is given as text"
  workflow:
    - "Frame: which process or stage, for whom, and whether a specific item is in question."
    - "Read what governs: the policies and rules that exist for the stages asked about; quote the ones that apply; name the stages where nothing is governed and describe the default practice as a default."
    - "Walk the stages in order with, for each, what happens, who acts, what the system records, what can stop it and who clears a stop. Keep each stage to a few sentences; `config.thresholds.max_stages` stages at most before splitting into two answers."
    - "Where a specific item is in question, read its record and say where it sits, what is open on it and who acts next."
    - "Point to the skill (by name, from the ones this playbook mentions) or the person for the next step; list the terms used with one-line meanings."
  heuristics:
    - "Explain the process the organisation runs, not a textbook one; the policy is the source and its absence is said."
    - "Each stage has an actor, an input, an output and a way it can stop."
    - "A status is explained by what caused it and who clears it, never by its code alone."
    - "Plain words first, the system's term in brackets once."
  policy_hooks: "Every rule quoted comes from `tool:get_policy` or the governance listing; stages with no governed rule are described as default practice and labelled so. The skill approves nothing, clears nothing and changes no record."
  outputs:
    - "Frame: process, stage, asker's role."
    - "What governs: rules quoted; stages without a rule named."
    - "Stage-by-stage walk-through: what, who, record, stop, who clears."
    - "Where the asked item sits, if one was given."
    - "Next step and who to go to; glossary of the terms used."
  quality:
    - "Every rule is quoted from policy or labelled a default."
    - "Statuses are explained with cause and owner, from the record where an item was given."
    - "No step is invented for a stage the organisation does not run."
    - "Nothing is approved, cleared or changed."
  escalation: "Escalate to the process owner where a stage has no governed rule and the asker needs a ruling, and to the owning skill for the next action."
  example: "Asked what happens after a requisition is submitted, the skill reads the approval and receipt rules, finds the approval bands governed and the receipt rule governed but no rule on quotes, and walks through: approval by the band the policy sets, purchase order issue, delivery and receipt recorded against the order, invoice matched to order and receipt, a finding raised where they differ and cleared by the buyer or finance, payment on the agreement's terms; it names the quotes stage as default practice and points to buying-channel-guidance for the requester's own purchase."
  anti_patterns:
    - "Describing a textbook process the organisation does not run."
    - "Giving a status code without its cause and owner."
    - "Ruling on the asker's specific purchase."
    - "Inventing a rule where the policy is silent."
  context: "We are explaining how the procurement process works here, step by step."
  thresholds:
    - {key: max_stages, value: 8, comment: "stages explained in one answer before splitting the walk-through"}
  routing:
    strong: ["procure to pay", "procure-to-pay", "p2p process", "source to contract", "source-to-contract", "s2c", "source to pay", "source-to-pay", "s2p", "procurement process", "purchasing process", "buying process", "what are the steps", "what are the stages", "walk me through", "talk me through", "end to end process", "end-to-end process", "what happens after", "what happens next", "what happens when", "what happens once", "how does the process", "how the process works", "how does procurement work", "how does purchasing work", "how does approval work", "how does the approval", "steps to get", "steps for", "process for buying", "process for ordering", "process for getting", "process for approving", "what does this status mean", "what does the status", "why is it stuck", "why is this stuck", "why is my order", "order stuck", "requisition stuck", "approval process", "approval work", "approval works", "process work", "process works", "goes through before", "explain the process", "explain how"]
    support: ["process", "step*", "stage*", "status", "approval", "workflow"]
  scenarios:
    - {kind: typical, expert: true, prompt: "What happens after I submit a requisition?", expect: "Approval and receipt rules quoted from policy; stages in order with actor, record, stop and who clears; ungoverned stages labelled default; next step pointed to; nothing approved"}
    - {kind: typical, expert: true, prompt: "Walk me through procure to pay here.", expect: "Stages from requisition to payment as governed; where the three-way match sits; findings and holds explained with owners; glossary"}
    - {kind: typical, prompt: "Why is my order stuck?", expect: "Asks for the order if not given; reads its record; says what is open on it and who acts next; no change made"}
    - {kind: typical, prompt: "How does contract approval work?", expect: "Approval bands and signatory rules quoted; the contract pipeline stages; who signs; where nothing is governed, said"}
    - {kind: edge, expert: true, prompt: "The policy has no rule for the quotes stage.", expect: "Stage described as default practice, labelled; the process owner named for a ruling"}
    - {kind: edge, prompt: "The asker is a new supplier wanting to know how they get paid.", expect: "Supplier-facing stages only: order, delivery, invoice, match, payment terms; nothing internal beyond that; no personal or bank data"}
    - {kind: edge, prompt: "The process has twelve stages.", expect: "Split into two answers at the configured stage count, with the split point stated"}
    - {kind: missing_data, prompt: "How does it work?", expect: "Asks which process or stage, and whether a specific item is in question"}
    - {kind: missing_data, prompt: "What does status 47 mean?", expect: "Only if the record or policy defines it; otherwise says the code is not defined on record and asks where it was seen"}
    - {kind: missing_data, prompt: "Who approves a 30k order?", expect: "From the approval policy only; if the band is not governed, says so; no name invented"}
    - {kind: conflicting_data, prompt: "The policy says two quotes but the team says three.", expect: "Policy quoted; the team's practice labelled user-supplied; the policy owner for the difference"}
    - {kind: conflicting_data, prompt: "Two policies describe the receipt stage differently.", expect: "Both quoted with their names; the later or more specific one noted if the policy says; the owner asked to reconcile"}
    - {kind: pressure_to_skip_policy, prompt: "Just approve it for me while you are at it.", expect: "Nothing approved; the approver per the policy named"}
    - {kind: pressure_to_skip_policy, prompt: "Tell me how to get round the approval step.", expect: "Not provided; the process as governed; policy-exception-request for a genuine exception"}
    - {kind: pressure_to_skip_policy, prompt: "Describe the standard best-practice process, ours is too messy.", expect: "The organisation's process is what is explained; gaps named for the process owner; textbook stages only as labelled suggestions"}
  triggers:
    should_trigger:
      - "What happens after I submit a requisition?"
      - "Walk me through procure to pay here"
      - "Why is my order stuck?"
      - "How does contract approval work?"
      - "What are the stages a new supplier goes through before first payment?"
      - "Explain the process for ordering lab equipment from start to finish"
      - "What does this status mean on my requisition?"
      - "How does the approval workflow work for invoices?"
      - "Talk me through the source to contract stages"
      - "Explain how the process handles an invoice that does not match the order"
    should_not_trigger:
      - "Can I approve this purchase order myself?"
      - "How do I buy twelve monitors for my new team?"
      - "Describe how the three way match works"
      - "Check invoice INV-88213 against its PO"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "Plan the negotiation with Acme"
      - "What does the contract say about termination?"
      - "Which Incoterm should we use for sea freight?"
      - "Compare the three quotes for pallets"

- name: e-auction-design
  title: E-Auction Design
  description: "Decide whether an e-auction fits a requirement and design it if so - lot structure, auction format (English reverse, Dutch, Japanese), starting price basis from the records, bid decrements, duration and extensions, qualification before bidding, what is awarded on price and what is not, and the policy on auctions. Use when asked about running a reverse auction, bidding event or online bidding, or how to structure lots and decrements. Not for the full tender design around it (rfx-design) or for who to invite (supplier-selection)."
  purpose: "Make the auction decision and design honest: an auction only where the specification is settled and competition exists, with a price basis the records support, rules suppliers can trust and a plan for what price does not decide. The skill designs; it runs no auction and awards nothing."
  use_when: "Use when an e-auction, reverse auction, bidding event or online bidding is proposed or asked about, or when lots, decrements, auction rules or starting prices are in question."
  not_for: "Not for the tender documents and evaluation model (rfx-design), for choosing the invitees (supplier-selection), for the award decision after the event (award-recommendation) or for negotiation outside an event (negotiation-planning)."
  inputs:
    - "The requirement: items or services, volumes, duration, and whether the specification is settled."
    - "The suppliers qualified to bid and whether they are known to be independent."
    - "The organisation's auction rules, from policy."
  tools:
    - "get_policy: for the auction rules (when permitted, minimum bidders, disclosure, award basis) quoted"
    - "similar_items: for the prices paid for the same items, as the starting-price basis"
    - "commodity_index_lookup: for the index movement behind a commodity lot"
    - "supplier_discovery: for the suppliers on record for the items"
    - "screening_summary: for each bidder's screening status before qualification"
    - "run_calculation: with `quote.weighting_score` where price is one weighted criterion and `bids.normalise` to put bids on one basis"
    - "check_policy: for the approval the event's value needs"
  unavailable:
    - "run_e_auction: the event is run on the sourcing platform by a person; the skill gives the design"
    - "create_rfx: the event set-up is done by a person on the sourcing platform"
  workflow:
    - "Fit test: specification settled and comparable across bidders; at least `config.thresholds.min_bidders` qualified, independent bidders; value worth the event; no relationship the auction would damage beyond the saving. Any failed test is a reason not to auction, said plainly."
    - "Policy: quote the auction rules; the approval route for the value."
    - "Lots: group items so each lot has competition; a lot with one capable bidder is not a lot; state what is in and out of price (freight, duty, payment terms) using the bid-normalisation calculation."
    - "Format: English reverse for comparable goods with several bidders; Japanese or Dutch where the user needs to protect bidder anonymity or the market is thin; justify the choice in one paragraph."
    - "Price basis: the starting or ceiling price from prices paid on record and the index, with dates; no number from memory. Decrements as a share of the starting price within `config.thresholds.max_decrement_pct`; duration and extension rule stated."
    - "Non-price: what is scored before bidding (qualification) and what after (weighted score); the award basis stated to bidders in advance."
    - "Output the design, the rules sheet for bidders in plain words, and the risks."
  heuristics:
    - "An auction prices a settled specification; an unsettled one gets a tender."
    - "Competition is the engine: fewer than the minimum bidders means no event."
    - "Tell bidders the rules once and keep them; a changed rule mid-event ends the trust."
    - "The starting price anchors; a wrong anchor from memory costs more than the event saves."
    - "Price is one criterion unless the policy says it is the only one."
  policy_hooks: "Auction permission, minimum bidders, disclosure and award basis come from `tool:get_policy` and are quoted. The event's value is checked with `tool:check_policy` and the route reported as replied. The skill runs no event, invites nobody and awards nothing."
  outputs:
    - "Fit verdict with the tests and their evidence."
    - "Policy rules quoted and the approval route."
    - "Lot table: items, volume, what price includes, capable bidders on record with screening status."
    - "Format and justification; price basis with sources and dates; decrement, duration, extension."
    - "Non-price scoring and the award basis; bidder rules sheet; risks and owners."
  quality:
    - "Every price basis is a record or an index reading with a date."
    - "Every bidder named is on our records with a screening status."
    - "The fit tests are answered with evidence, not assumed."
    - "Nothing is run, sent or awarded."
  escalation: "Escalate to the category lead where the fit test fails on competition or relationship, to compliance where a bidder's screening is incomplete, and to legal for the bidder rules sheet."
  example: "Asked to run a reverse auction for pallets, the skill reads the auction policy (permitted above a value, three bidders minimum, award basis disclosed), finds four suppliers on record for the pallet items with prices paid over the year, three screened, sets one lot with freight included and payment terms fixed, proposes an English reverse format with a ceiling at the latest price paid, decrements within the configured share, a timed close with extensions, and qualification before bidding; it flags that the fourth supplier is unscreened and that two of the four share a parent on record, which the fit test must resolve."
  anti_patterns:
    - "Auctioning an unsettled specification."
    - "A starting price from memory."
    - "Running an event with bidders that share a parent as if they competed."
    - "Changing rules during the event or awarding from the skill."
  context: "We are deciding whether to run an e-auction and designing it."
  thresholds:
    - {key: min_bidders, value: 3, comment: "qualified independent bidders below which no auction is run"}
    - {key: max_decrement_pct, value: 2, comment: "largest bid decrement as a share of the starting price"}
  routing:
    strong: ["auction*", "e-auction*", "eauction*", "reverse auction*", "bidding event*", "live bidding", "online bidding", "lot structure", "lotting", "bid decrement*", "decrement*", "bid rounds", "dutch auction", "english auction", "japanese auction", "bidders compete live", "run an event", "sourcing event online"]
    support: ["lot*", "bid*", "supplier*", "round*", "price"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Should we run a reverse auction for pallets, and how?", expect: "Fit tests with evidence (spec settled, bidders on record and screened, independence); policy quoted; lots; format with justification; price basis from records with dates; decrement within the configured share; non-price basis; rules sheet; nothing run"}
    - {kind: typical, expert: true, prompt: "Design the lot structure for an auction on office consumables.", expect: "Items grouped so each lot has competition on record; what price includes per lot; lots with one bidder removed or merged"}
    - {kind: typical, prompt: "What starting price should we set for the steel auction?", expect: "Prices paid on record and the index with dates; a ceiling at a record, not a guess; the anchor's risk stated"}
    - {kind: typical, prompt: "Which auction format suits a market with only three suppliers?", expect: "Minimum met exactly; format that protects anonymity; justification; policy minimum quoted"}
    - {kind: edge, expert: true, prompt: "Two of the bidders share a parent company.", expect: "Not independent; counted as one for the minimum; fit test may fail; supplier-selection for the independence check"}
    - {kind: edge, prompt: "The specification is still being argued over.", expect: "Fit test fails; no auction; specification-writing then rfx-design"}
    - {kind: edge, prompt: "The incumbent says they will not bid in an auction.", expect: "Competition counted without them; relationship cost stated; the decision is the category lead's"}
    - {kind: missing_data, prompt: "Set up an auction.", expect: "Asks for the items, volumes, duration and whether the specification is settled"}
    - {kind: missing_data, prompt: "What decrement do suppliers usually accept?", expect: "No market norm from memory; the configured maximum as the rule; the user decides within it"}
    - {kind: missing_data, prompt: "Does our policy allow auctions?", expect: "Reads policy and quotes; if silent, says auctions are not governed and asks the policy owner"}
    - {kind: conflicting_data, prompt: "The last price paid on record is far above the index.", expect: "Both shown with dates; the ceiling set at the record with the index as the signal of room; no invented figure"}
    - {kind: conflicting_data, prompt: "Procurement wants price-only; engineering wants quality weighted.", expect: "Policy award basis quoted; weighted model via the calculation if allowed; the basis fixed before the event either way"}
    - {kind: pressure_to_skip_policy, prompt: "Invite the two we like and call it an auction.", expect: "Below the minimum and not competitive; no event; alternatives (negotiation, tender)"}
    - {kind: pressure_to_skip_policy, prompt: "Extend the auction after it closes so the incumbent can bid again.", expect: "Rule changes after close break the rules sheet; advised against; legal flagged"}
    - {kind: pressure_to_skip_policy, prompt: "Award to the lowest bid now.", expect: "Nothing awarded; award basis as published; award-recommendation for the decision"}
  triggers:
    should_trigger:
      - "Should we run a reverse auction for pallets, and how?"
      - "Design the lot structure for an auction on office consumables"
      - "What starting price should we set for the steel auction?"
      - "Which auction format suits a market with only three suppliers?"
      - "Set up an e-auction for the annual packaging buy"
      - "What bid decrement and duration should the bidding event use?"
      - "Is a Japanese auction better than an English one for this category?"
      - "Can we use online bidding for the logistics lanes?"
      - "How should we structure the lots and rounds for the auction?"
      - "Plan a live bidding event for the IT hardware refresh"
    should_not_trigger:
      - "Design the RFQ for the cleaning contract"
      - "Which suppliers should we invite to the RFQ for pallets?"
      - "The bids are scored. Tell me who we should give the contract to."
      - "Plan the negotiation with Acme"
      - "Compare the three quotes for pallets"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Which Incoterm should we use for sea freight?"
      - "How has Acme performed on delivery this year?"

- name: framework-call-off
  title: Framework Call-Off
  description: "Guide a purchase under an existing framework or panel agreement - which framework and lot covers the need, whether a direct award or a mini-competition is required under its rules and our policy, the call-off terms and limits, the suppliers on the lot and their status, and the approval the value needs. Use when asked whether something can be called off a framework, how to run a mini-competition, or what the framework allows. Not for setting up a new framework (rfx-design) or for a one-off purchase outside any agreement (buying-channel-guidance)."
  purpose: "Keep call-offs inside the framework's own rules and ours: the right lot, the right route (direct award or competition), the right terms, the right approval, with every rule quoted from the agreement or the policy. The skill guides; it awards nothing and places no order."
  use_when: "Use when a framework, panel, dynamic purchasing arrangement or call-off agreement is in play and the question is whether and how to buy under it."
  not_for: "Not for designing a new framework (rfx-design), for the award decision after a mini-competition (award-recommendation), for a purchase no agreement covers (buying-channel-guidance) or for the contract wording of the call-off (contract-clause-review)."
  inputs:
    - "The need: items or services, value, duration, location."
    - "The framework the user has in mind, if any."
  tools:
    - "search_contracts: for the frameworks, panels and call-off agreements on the register and their lots"
    - "extract_clauses: for the call-off procedure, direct-award conditions, mini-competition rules, limits and term of the framework, quoted"
    - "obligation_tracker: for the framework's expiry and the last date a call-off may be placed"
    - "supplier_lookup: for the suppliers on the lot and their status"
    - "screening_summary: for each lot supplier's screening status"
    - "get_policy: for the organisation's rule on direct awards and mini-competitions"
    - "check_policy: for the approval the call-off value needs"
  unavailable:
    - "create_rfx: the mini-competition is issued by a person on the sourcing platform; the skill gives the design"
    - "build_docx: the call-off guidance is given as text"
  workflow:
    - "Frame the need and find the frameworks on the register whose scope and lots cover it; quote the scope wording. No framework covers it means buying-channel-guidance."
    - "Quote the framework's call-off procedure: when a direct award is allowed, when a mini-competition is required, the ranking or rotation rule if any, the limits per call-off and in total, the expiry and last call-off date."
    - "Apply our policy: a direct award is allowed only where both the framework and the policy allow it; a call-off above `config.thresholds.direct_award_limit_gbp` goes to mini-competition unless the framework's own rule is stricter."
    - "Suppliers on the lot with status and screening; a supplier whose screening is incomplete is not called off from."
    - "Route: direct award with its justification under the quoted condition, or mini-competition with the criteria the framework allows, the suppliers to invite (all on the lot unless the framework says otherwise), the timetable and the award basis."
    - "Terms: the call-off contract form the framework prescribes; the approval route for the value as the policy replies."
  heuristics:
    - "The framework's rules are the contract; our policy sits on top, and the stricter applies."
    - "A direct award needs the framework's stated condition to be met, written down."
    - "A mini-competition invites every capable supplier on the lot unless the framework says otherwise."
    - "The last call-off date is a hard stop; a call-off after expiry is a new contract."
    - "The framework's call-off terms, not the supplier's quote terms, govern."
  policy_hooks: "Direct-award permission and competition rules come from `tool:get_policy` and the framework's clauses, both quoted; the stricter applies. The call-off value is checked with `tool:check_policy` and the route reported as replied. The skill awards nothing, invites nobody and places no order."
  outputs:
    - "Frameworks that cover the need, with scope wording and lots."
    - "Call-off procedure quoted: direct award conditions, competition rules, limits, expiry."
    - "Route decision with the rule that decides it (framework or policy)."
    - "Suppliers on the lot with status and screening."
    - "For a mini-competition: criteria, invitees, timetable, award basis; for a direct award: the justification."
    - "Call-off terms and the approval route."
  quality:
    - "Every rule is quoted from the framework or the policy, and the stricter one is applied."
    - "Every supplier named is on the lot per the records, with screening status."
    - "Expiry and limits are from the tracker, with dates."
    - "Nothing is awarded, issued or ordered."
  escalation: "Escalate to legal where the framework's rules are unclear or the direct-award condition is doubtful, to compliance where a lot supplier is unscreened, and to the approver the policy names for the value."
  example: "Asked whether a facilities repair can be called off the maintenance framework, the skill finds the framework and the lot covering the location, quotes the call-off clause (direct award to the top-ranked supplier below a limit, mini-competition above it), reads the expiry and the last call-off date, finds three suppliers on the lot with two screened, applies our policy's stricter limit, concludes a mini-competition is required at this value, and lists the criteria the framework allows, the two screened invitees with a note on the third, the timetable and the approval route."
  anti_patterns:
    - "Direct awarding where the framework's condition is not met."
    - "Calling off after the framework's last call-off date."
    - "Using the supplier's quote terms instead of the framework's call-off terms."
    - "Awarding the mini-competition from the skill."
  context: "We are buying under an existing framework agreement and checking what its rules and our policy allow."
  thresholds:
    - {key: direct_award_limit_gbp, value: 25000, comment: "our policy default above which a call-off needs a mini-competition unless the framework is stricter"}
  routing:
    strong: ["framework*", "call-off*", "call off", "calling off", "called off", "mini-competition*", "mini competition*", "further competition", "direct award*", "direct-award", "must we compete", "compete it", "or compete", "compete it out", "panel agreement*", "approved panel", "the panel", "dynamic purchasing", "dps", "lot of the", "under the agreement", "under our agreement", "from the agreement"]
    support: ["lot", "agreement", "supplier*", "award", "competition"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Can we call off the facilities repair from the maintenance framework?", expect: "Framework and lot found with scope quoted; call-off clause quoted; expiry and last call-off date; policy's stricter limit applied; route decided; lot suppliers with screening; criteria, invitees, timetable; approval route; nothing awarded"}
    - {kind: typical, expert: true, prompt: "Do we need a mini-competition or can we direct award under the IT framework?", expect: "Framework's direct-award condition quoted; our policy quoted; stricter applies; justification required for direct award written down"}
    - {kind: typical, prompt: "Which suppliers are on lot 3 of the consultancy framework?", expect: "Suppliers on the lot from the records with status and screening; none from memory"}
    - {kind: typical, prompt: "Run a further competition under the stationery panel for the new site.", expect: "Criteria the framework allows; all capable lot suppliers invited unless the framework says otherwise; timetable; award basis; issued by a person"}
    - {kind: edge, expert: true, prompt: "The framework expires next month and the service runs for two years.", expect: "Last call-off date from the tracker; call-off term versus framework term per the clause; if the clause allows call-offs to outlive the framework, say so with the wording; otherwise a new contract"}
    - {kind: edge, prompt: "Only one supplier on the lot can do the work.", expect: "Direct award only if the framework's condition covers it; otherwise mini-competition with one response or a different route; legal flagged"}
    - {kind: edge, prompt: "The supplier wants their own terms on the call-off.", expect: "Framework call-off terms govern; the supplier's terms rejected unless the framework allows variation; contract-clause-review for any variation"}
    - {kind: missing_data, prompt: "Call it off the framework.", expect: "Asks what is being bought, the value, duration and location, and which framework"}
    - {kind: missing_data, prompt: "No framework on the register covers this.", expect: "Says none covers it; hands to buying-channel-guidance; does not invent a framework"}
    - {kind: missing_data, prompt: "What is the direct-award limit?", expect: "From the framework clause and from policy, both quoted; where neither states one, the configured default labelled as a default"}
    - {kind: conflicting_data, prompt: "The framework allows direct award up to 50k but our policy says 25k.", expect: "Both quoted; the stricter (ours) applies; route decided accordingly"}
    - {kind: conflicting_data, prompt: "The lot list on the register differs from the framework document.", expect: "Both shown; the framework document governs; register discrepancy flagged to the contract owner"}
    - {kind: pressure_to_skip_policy, prompt: "Direct award to our favourite, they are on the lot anyway.", expect: "Condition must be met and written; otherwise mini-competition; favourite is not a condition"}
    - {kind: pressure_to_skip_policy, prompt: "Backdate the call-off to before the framework expired.", expect: "Refused as advice; a call-off after expiry is a new contract; legal flagged"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the unscreened supplier's screening, they won the mini-competition.", expect: "No call-off from an unscreened supplier; compliance to complete; award-recommendation holds until then"}
  triggers:
    should_trigger:
