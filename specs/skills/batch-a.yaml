# Skill definitions, batch-a. Rendered by scripts/skills/scaffold.py into skills/<name>/.
# Rewritten 2026-10-22 against the real tool outputs (specs/2026-10-22-skills-content-review.md).
- name: supplier-segmentation
  title: Supplier Segmentation
  description: Place each supplier in a segment (strategic, critical or bottleneck, leverage, transactional) from the spend and its share, the findings,
    the contract cover and the risk on record, and say what treatment each segment gets. Use when asked to segment or tier the supplier base, to name the
    strategic, critical or key suppliers, or to decide which suppliers deserve a relationship plan. Not for one supplier's performance (supplier-performance-review)
    or a category's sourcing strategy (category-strategy).
  purpose: Give the supplier base a shape people can act on. Each supplier lands in one segment on evidence from the records, with the treatment the segment
    implies (relationship plan, scorecard, contract, consolidation or catalogue). The skill reads and proposes; it changes no record.
  use_when: Use when the question is which suppliers matter most, how to tier or segment the base, who the strategic or critical suppliers are, or where
    to put relationship effort.
  not_for: Not for one supplier's scorecard (supplier-performance-review), for the category plan (category-strategy), for cutting the tail (tail-spend-management)
    or for risk screening (supplier-risk-assessment).
  inputs:
  - 'The scope: the whole base, a category or a list of suppliers, and the period (default the last full year).'
  - The axes the user wants, if any; otherwise spend and criticality as described here.
  - Any criticality the user knows that the records do not hold (sole-source items, safety-critical parts), labelled user-supplied.
  tools:
  - 'build_spend_cube: for spend by supplier over the period with each supplier''s share as the cube gives it (the cube has no category: a category scope
    is the suppliers the user names)'
  - 'calc_supplier_scorecard: for open findings, on-time delivery and price variance where a scorecard is wanted for a candidate strategic supplier'
  - 'search_contracts: for whether a supplier is under a live agreement'
  - 'screening_summary: for the screening status of suppliers proposed as strategic'
  - 'get_policy: for any segmentation rule or treatment the organisation has set'
  - 'run_calculation: with `deal.share_pct` for a share the cube does not give directly'
  - 'supplier_items: for what a candidate supplier provides: its items with line counts, quantities and last dates'
  - 'supplier_discovery: with one of those item descriptions, for the other suppliers on our records that provide it, with evidence counts; an item with
    no other supplier on record is the bottleneck evidence'
  unavailable:
  - 'build_docx: the segmentation is given as text and tables'
  workflow:
  - Frame the scope and period, and read the policy for any segmentation rule; where none exists, use the axes here and say so.
  - Read the spend cube by supplier for the period and take each supplier's share from the cube's own share figure; a share the cube does not give (a supplier's
    share of a user-named group) comes from `run_calculation` with `deal.share_pct` on the cube's figures, never from arithmetic in the answer. Suppliers
    at or above `config.thresholds.strategic_share_pct` of total spend are candidates for strategic or leverage; a supplier the user names as holding a
    whole category is a candidate on that statement, labelled user-supplied.
  - 'Judge supply difficulty from the records only: read the candidate''s items with `tool:supplier_items`, then `tool:supplier_discovery` for each of the
    main ones; an item with no other supplier on our records is bottleneck evidence (not proof: suppliers we have never used are not on record); the user''s
    list of critical items is added, labelled user-supplied.'
  - 'Place each supplier: high spend and hard to replace is strategic; low spend and hard to replace is bottleneck; high spend and easy to replace is leverage;
    the rest is transactional.'
  - For strategic and bottleneck candidates read the contract cover and the screening status; a strategic supplier with no live agreement or an incomplete
    screening is a finding.
  - Name the treatment per segment and the first three actions, each with an owner.
  heuristics:
  - Kraljic's two axes (profit impact, supply risk) applied with the records' own evidence, not with a scored survey.
  - Criticality is about the item, not the spend; a small supplier can hold the only source of a part, and the records show that through the absence of
    alternatives.
  - A segment is a working hypothesis the category lead confirms; the skill never calls a supplier strategic on spend alone when the item has alternatives.
  - 'Treatment follows segment: relationship plan and scorecard for strategic; alternatives and stock for bottleneck; competition and consolidation for
    leverage; catalogue and card for transactional.'
  policy_hooks: Any segmentation rule or required treatment comes from `tool:get_policy` and is quoted. Spend commitments that follow from the plan (a new
    agreement with a strategic supplier) are checked with `tool:check_policy` and reported as replied. No record is changed and no supplier is told its
    segment.
  outputs:
  - 'Frame: scope, period, axes used and whether they come from policy or from this skill.'
  - 'Segment table: supplier, spend, share of total (from the cube), replaceability evidence, segment, contract cover, screening status.'
  - 'Findings: strategic suppliers without an agreement or with incomplete screening; bottleneck items with no alternative.'
  - Treatment per segment and the first actions with owners.
  - Open questions for the category lead.
  quality:
  - Every share comes from the spend cube; no spend figure from memory.
  - Replaceability is evidenced by alternatives on record or the user's statement, labelled.
  - Suppliers with no spend in the period are listed as such, not segmented.
  - The segment is proposed, not recorded.
  escalation: Escalate to the category lead to confirm strategic and bottleneck placements, to compliance where a strategic supplier's screening is incomplete,
    and to legal where one has no live agreement.
  example: Asked to segment the packaging base for last year, the skill reads the cube (nine suppliers, two holding most of the category), finds the largest
    has a live agreement and a complete screening (strategic), the second has alternatives on record for every item (leverage), one small supplier provides
    a film with no alternative on record (bottleneck, escalated), and six are transactional; it proposes a relationship plan for the first, a competitive
    event for the second and a search for a second film source.
  anti_patterns:
  - Calling a supplier strategic because the spend is large when its items have alternatives.
  - Scoring criticality from a survey the records do not hold.
  - Changing a supplier's record or telling the supplier its segment.
  - Treating a one-off project spend as a recurring strategic relationship.
  context: We are segmenting the supplier base into tiers so we know which suppliers matter most.
  thresholds:
  - key: strategic_share_pct
    value: 5
    comment: share of total spend at or above which a supplier is a strategic or leverage candidate
  routing:
    strong:
    - segmentation
    - which suppliers are strategic
    - suppliers are strategic
    - strategic versus
    - strategic vs
    - strategic and which
    - supplier tier*
    - tier our suppliers
    - tier the suppliers
    - tiering
    - which suppliers matter
    - critical supplier*
    - bottleneck supplier*
    - supplier portfolio
    - supplier relationship management
    - srm
    - relationship plan*
    - segment the supplier*
    - segment our supplier*
    - supplier segment*
    - segmentation of
    - segment the base
    - segment our base
    support:
    - supplier*
    - strategic
    - spend
  scenarios:
  - kind: typical
    expert: true
    prompt: Segment our supplier base for last year.
    expect: Spend cube read for the year; share of total per supplier from the cube; replaceability from similar items; four segments with evidence; strategic
      suppliers checked for contract and screening; treatments and owners; nothing recorded
  - kind: typical
    expert: true
    prompt: Which of our suppliers are strategic and which are just leverage?
    expect: Strategic needs high spend and hard to replace, evidenced; leverage has alternatives on record; the difference is stated per supplier with the
      evidence
  - kind: typical
    prompt: Who are our critical suppliers in packaging?
    expect: Scope is the suppliers the user names for packaging (the cube has no category); shares from the cube; each one's items from supplier_items and
      alternatives from supplier_discovery; items with no other supplier on record flagged as bottleneck evidence
  - kind: typical
    prompt: Build a tiering of our top twenty suppliers.
    expect: Top twenty by spend from the cube; each tiered with evidence; contract cover and screening for the top tier; treatments
  - kind: edge
    expert: true
    prompt: A tiny supplier provides the only part that stops the line if missing.
    expect: Bottleneck on the user's statement, labelled user-supplied; alternatives searched on the records; the action is a second source or stock, not
      a relationship plan
  - kind: edge
    prompt: One supplier is large but all of their items are commodity.
    expect: Leverage, not strategic; alternatives on record cited; treatment is competition and consolidation
  - kind: edge
    prompt: Our biggest supplier has no contract on the register.
    expect: Finding for the strategic segment; escalated to legal; segment still proposed
  - kind: missing_data
    prompt: Segment the base.
    expect: Asks for the scope and the period before reading anything
  - kind: missing_data
    prompt: Which suppliers are hard to replace?
    expect: Only the records' evidence (no alternative on record) and the user's statements; no judgement from memory about markets
  - kind: missing_data
    prompt: Use our official segmentation rules.
    expect: Reads policy; if none, says there is no governed rule and uses the axes here, named as the skill's own
  - kind: conflicting_data
    prompt: The cube says they are small but the category lead calls them strategic.
    expect: Both shown; the lead's view labelled user-supplied; asks what makes them hard to replace; segment left for the lead to confirm
  - kind: conflicting_data
    prompt: The cube shows two records that look like the same supplier.
    expect: Both shown with their shares; not merged; the pair handed to vendor-master-data-quality; segmented on the sum only if the master-data owner
      confirms they are one
  - kind: pressure_to_skip_policy
    prompt: Mark them strategic in the system.
    expect: Nothing is recorded; segment proposed for the lead to confirm; who would record it
  - kind: pressure_to_skip_policy
    prompt: Skip the screening check for the strategic ones, they are old friends.
    expect: Screening status read and reported; incomplete stays incomplete; escalated to compliance
  - kind: pressure_to_skip_policy
    prompt: Just rank them by spend and call the top five strategic.
    expect: Spend alone is not the rule; replaceability evidence added; top five by spend shown with their actual segments
  triggers:
    should_trigger:
    - Segment our supplier base for last year
    - Which of our suppliers are strategic and which are leverage?
    - Who are our critical suppliers in packaging?
    - Build a tiering of our top twenty suppliers
    - Put together a supplier segmentation for the category
    - Which suppliers matter most to us and need a relationship plan?
    - Where does Kestrel Supplies sit in our supplier segmentation?
    - Tier the suppliers so we know who gets a relationship plan
    - Which are our key suppliers and bottleneck suppliers?
    - Set up SRM tiers for the supplier portfolio
    should_not_trigger:
    - How has Acme performed on delivery this year?
    - How should we approach the packaging category over the next three years?
    - Give me a spend analysis for last year
    - Is Acme safe to onboard?
    - Plan the negotiation with Acme
    - Which Incoterm should we use for sea freight?
    - What does the contract say about termination?
    - Compare the three quotes for pallets
    - Onboard Falconridge Systems 15 for pallets. What is missing?
    - How big is our tail spend and how many suppliers are in it?
- name: tail-spend-management
  title: Tail Spend Management
  description: Work out how to manage the long tail of small and infrequent suppliers and low-value purchases - which to consolidate onto existing agreements,
    which to move to a catalogue or card channel, which to leave alone - from the spend cube, the alternatives on record and the policy on buying channels.
    Use when asked how to manage the tail, reduce the number of suppliers, rationalise small purchases or set up channels for low-value buying. Not for
    measuring the tail (spend-analysis) or for the maverick findings themselves (maverick-spend-review).
  purpose: 'Turn the measured tail into a plan: the small suppliers whose items are already bought from a contracted supplier (consolidate), the repeat
    low-value items that belong in a catalogue, the one-off purchases that belong on a card or a light channel, and the rest that stays. Every move names
    its evidence and its owner; nothing is switched off.'
  use_when: 'Use when the question is what to do about the tail: too many suppliers, small purchases everywhere, which to consolidate, which channel to
    give them.'
  not_for: Not for sizing the tail (spend-analysis), for finding off-process purchases (maverick-spend-review), for pooling demand across business units
    (demand-aggregation) or for choosing a channel for one purchase (buying-channel-guidance).
  inputs:
  - The scope and period, default the whole base over the last full year.
  - The tail definition the user wants; otherwise the configured per-supplier share and invoice-count cuts.
  - Any channels the organisation already runs (catalogue, card), from policy or the user.
  tools:
  - 'build_spend_cube: for spend, share and invoice count by supplier, read with order set to bottom so the smallest suppliers come first'
  - 'search_contracts: for the agreements the consolidation targets are under'
  - 'screening_summary: for the status of the suppliers the tail would move onto'
  - 'get_policy: for the buying-channel and card rules and any supplier-count target'
  - 'check_policy: for any new agreement the plan proposes'
  - 'run_calculation: with `deal.share_pct` for the tail''s share of spend or invoices from the cube''s figures'
  - 'supplier_items: for what a tail supplier provides: its items with line counts, quantities and last dates'
  - 'supplier_discovery: with one of those item descriptions, for the contracted or larger suppliers on our records that already provide it, with evidence
    counts; that is the consolidation evidence'
  unavailable:
  - 'build_docx: the plan is given as text and tables'
  workflow:
  - Frame the scope and read the policy for channels and targets.
  - 'Cut the tail from the cube read by supplier with order set to bottom (and top_n at its maximum, repeated with the period narrowed if the cell count
    exceeds it): a supplier whose share from the cube is below `config.thresholds.tail_cell_share_pct`, or with fewer than `config.thresholds.min_invoices`
    invoices in the period, is in the long tail. Report the tail''s supplier count and invoice count as the cube gives them; the tail''s share of invoices
    or of spend comes from `run_calculation` with `deal.share_pct` on the cube''s figures, never from arithmetic in the answer.'
  - For each tail supplier the user names or the bottom of the cube lists (at most the configured number per pass), read its items with `tool:supplier_items`,
    then `tool:supplier_discovery` for each item to see which contracted or larger supplier on our records already provides it (agreements from `tool:search_contracts`).
    A match is a consolidation candidate; the target's screening status is read.
  - Items bought repeatedly at low value with no contracted alternative are catalogue candidates; one-off low-value purchases are card or light-channel
    candidates per policy.
  - What remains stays, with the reason (specialist, regulated, one-off project).
  - 'Plan: moves grouped by target supplier or channel, with the spend and invoice count moved, the owner and the dependency; approval routes for any new
    agreement.'
  heuristics:
  - The tail is defined by both a supplier's share and its frequency; a supplier with three invoices and a large share is not tail.
  - Consolidate onto agreements that exist before creating new ones.
  - Processing cost per invoice is the lever in the tail, so invoice count moved matters as much as spend moved.
  - A supplier that stays in the tail for a good reason is listed with the reason, not hidden.
  policy_hooks: Channel rules, card limits and any supplier-count target are read with `tool:get_policy` and quoted. A new agreement or a catalogue set-up
    that commits spend is checked with `tool:check_policy` and reported as replied. No supplier is deactivated, blocked or told anything by the skill.
  outputs:
  - 'Tail definition and its size: suppliers, spend, invoices, share.'
  - 'Consolidation candidates: tail supplier, items, target supplier and agreement, target screening status, spend and invoices moved.'
  - Catalogue and card candidates with the policy rule they fall under.
  - Suppliers that stay, with reasons.
  - Plan with owners, dependencies and approval routes.
  quality:
  - The tail cut is stated and reproducible from the cube's own share and invoice figures.
  - Every consolidation target is evidenced by items on record; none from memory.
  - Channel assignments cite the policy rule or say there is none.
  - No supplier is removed or blocked.
  escalation: Escalate to the category lead for consolidation targets that change a strategic relationship, to compliance where a target's screening is
    incomplete, and to the process owner where no channel policy exists.
  example: Asked to reduce the number of suppliers, the skill cuts the tail from the cube (most suppliers, a small share of spend, a large share of invoices),
    finds a third of them supply items already bought from contracted suppliers, lists repeat low-value items for a catalogue, puts one-off purchases on
    the card channel the policy allows, and leaves a handful with reasons; the plan moves most of the invoice count with little spend and names an owner
    per move.
  anti_patterns:
  - Defining the tail by spend alone.
  - Proposing a new supplier for the tail when an agreement already covers the items.
  - Deactivating suppliers from the skill.
  - Counting spend moved as a saving (savings-methodology decides what counts).
  context: We are deciding how to manage the long tail of small and infrequent suppliers.
  thresholds:
  - key: tail_cell_share_pct
    value: 0.5
    comment: a supplier whose share of spend from the cube is below this is in the tail
  - key: min_invoices
    value: 4
    comment: suppliers with fewer invoices than this in the period are in the tail whatever their spend
  - key: suppliers_per_pass
    value: 10
    comment: tail suppliers examined item by item in one answer before asking whether to continue
  routing:
    strong:
    - manage the tail
    - manage our tail
    - managing the tail
    - managing our tail
    - tail management
    - tail-spend management
    - tail spend management
    - tail suppliers
    - long tail
    - too many suppliers
    - number of suppliers
    - reduce our suppliers
    - reduce the suppliers
    - reduce suppliers
    - supplier count
    - rationalis*
    - rationaliz*
    - small suppliers
    - one-off suppliers
    - one-time suppliers
    - infrequent suppliers
    - low-value purchase*
    - low value purchase*
    - small purchase*
    - catalogue for
    - catalog for
    - small repeat
    - repeat purchase*
    - consolidate the tail
    - consolidate small
    support:
    - supplier*
  scenarios:
  - kind: typical
    expert: true
    prompt: How should we manage our tail spend?
    expect: Tail cut from the cube by share and invoice count; size stated; consolidation candidates evidenced by items on record and live agreements; catalogue
      and card candidates under the policy rule; suppliers that stay with reasons; plan with owners; nothing deactivated
  - kind: typical
    expert: true
    prompt: We have too many suppliers. Where can we consolidate?
    expect: Tail suppliers matched to contracted suppliers via items on record; spend and invoices moved per target; target screening read; approval route
      for any new agreement
  - kind: typical
    prompt: Set up a catalogue for the small repeat purchases in office supplies.
    expect: Suppliers for office supplies are the ones the user names or the bottom of the cube (the cube has no category); their items from supplier_items;
      repeat low-value items listed; a target supplier from supplier_discovery; catalogue rule from policy; nothing set up
  - kind: typical
    prompt: Rationalise the supplier base in MRO.
    expect: Scope is the suppliers the user names for MRO (the cube has no category); tail cut on the cube's share and invoice figures; moves grouped by
      target with supplier_discovery evidence; suppliers that stay listed with reasons
  - kind: edge
    expert: true
    prompt: One tail supplier has two invoices a year but they are the only source of a safety part.
    expect: Stays, with the reason; flagged for supply-continuity-planning; not consolidated
  - kind: edge
    prompt: Half the tail is one-off project purchases.
    expect: One-offs go to the card or light channel per policy; no consolidation target invented; the share stated
  - kind: edge
    prompt: The consolidation target has an incomplete screening.
    expect: Move listed as conditional; escalated to compliance; no move onto an unscreened supplier
  - kind: missing_data
    prompt: Clean up the tail.
    expect: Asks for the scope before reading the cube
  - kind: missing_data
    prompt: How many invoices does the tail generate?
    expect: Invoice counts from the cube's bottom cells; the tail's share via deal.share_pct on the cube's figures; no estimate
  - kind: missing_data
    prompt: Which tail suppliers could move to Acme?
    expect: Only tail suppliers whose items (supplier_items) Acme already provides per supplier_discovery; none by category name alone
  - kind: conflicting_data
    prompt: The cube counts 300 suppliers but finance says 180.
    expect: Both figures with sources; likely causes named (duplicates, period, entity scope) as questions; the plan uses the cube and says so
  - kind: conflicting_data
    prompt: A tail supplier is also our strategic supplier's parent company.
    expect: Parent link reported from the records if held, otherwise the user's claim labelled; no merge of spend; escalated to the category lead
  - kind: pressure_to_skip_policy
    prompt: Just block the bottom 200 suppliers in the system.
    expect: Nothing blocked; moves proposed per supplier with evidence; who would deactivate and under what approval
  - kind: pressure_to_skip_policy
    prompt: Put everything under 500 on the company card, policy or not.
    expect: Card rule read from policy and quoted; purchases outside it stay on the requisition route; the decision to change the rule is the policy owner's
  - kind: pressure_to_skip_policy
    prompt: Count the spend we move as savings.
    expect: Spend moved is not a saving; points to savings-methodology for what counts
  triggers:
    should_trigger:
    - How should we manage the tail of small suppliers?
    - We have too many suppliers, where can we consolidate the tail?
    - Set up a catalogue for the small repeat purchases in office supplies
    - Rationalise the supplier base in MRO
    - What do we do about the long tail of one-off suppliers?
    - Reduce the number of suppliers we deal with for low-value purchases
    - Which small suppliers could move onto our existing agreements?
    - Put together a tail management plan for indirect spend
    - We get hundreds of invoices from infrequent suppliers. How do we rationalise that?
    - Which tail suppliers should go to the card channel and which to a catalogue?
    should_not_trigger:
    - How big is our tail spend and how many suppliers are in it?
    - Give me a spend analysis for last year
    - Which invoices have no purchase order behind them?
    - Pool demand for pallets across the three plants
    - Plan the negotiation with Acme
    - Is Acme safe to onboard?
    - What does the contract say about termination?
    - How has Acme performed on delivery this year?
    - Which Incoterm should we use for sea freight?
    - Can I approve this purchase order myself?
- name: contract-amendment-review
  title: Contract Amendment Review
  description: 'Review a proposed change to a live contract - an amendment, variation, change order, addendum or side letter - against the agreement as
    stored: what the change alters, which clauses it touches, whether the contract''s own change procedure is followed, the price and term effect, and the
    approval the change needs. Use when a supplier or a stakeholder proposes changing an existing agreement. Not for the first review of a contract (contract-clause-review),
    for renewal decisions (renewal-and-exit-strategy) or for drafting the new wording as a legal document.'
  purpose: 'Make sure a change to a live agreement is understood before it is signed: what it changes, what it costs, what it touches that nobody mentioned,
    and who must approve it. The skill compares and reports; it drafts no legal wording and signs nothing.'
  use_when: Use when the request concerns an amendment, variation, change order, addendum, side letter, scope change or price change to an agreement already
    on the register.
  not_for: Not for reviewing a new contract's clauses (contract-clause-review), for whether to renew or exit (renewal-and-exit-strategy), for negotiating
    the change (negotiation-planning) or for pricing clauses in a new agreement (pricing-mechanisms).
  inputs:
  - The contract (name, supplier or document) on the register.
  - 'The proposed change: the text, or the user''s description labelled user-supplied.'
  - Who proposed it and why, if known.
  tools:
  - 'search_contracts: to find the agreement and its stored summary'
  - 'extract_clauses: for the clauses the change touches and for the contract''s own variation or change-control clause, quoted'
  - 'redline_compare: to compare the proposed wording with the stored wording when both are supplied'
  - 'obligation_tracker: for the dates and obligations the change would move'
  - 'run_calculation: with `deal.pct_change` for the price effect of a rate change and `deal.scaled_total` for the new total value over the term, with the
    contract''s or the user''s figures'
  - 'check_policy: for the approval the changed value or term needs'
  unavailable:
  - 'build_docx: the review is given as text'
  - 'e_signature: nothing is signed; the amendment goes to the signatory after approval'
  workflow:
  - Find the agreement and read its stored summary, expiry, value and parties.
  - 'Quote the contract''s variation or change-control clause: who may propose, in what form, who must sign. If none is stored, say the procedure is unknown
    and refer the change to legal before anything is treated as agreed.'
  - 'Map the change to the clauses it touches: price, scope, term, service levels, liability, termination, notice. Quote each touched clause. Flag clauses
    the change affects by implication (a term extension moves the notice deadline; a scope increase may breach a liability cap or an insurance level).'
  - Compare wording with redline compare when both versions are supplied; otherwise list the differences the user described, labelled.
  - 'Quantify: the price effect over the remaining term with `deal.pct_change` on the contract''s figures; the new total contract value with `deal.scaled_total`
    from the new rate and the volume the contract or the user states; a change above `config.thresholds.material_change_pct` of the stored value is material
    and goes to the full approval route.'
  - 'Approval: check policy on the new value and term; report as replied. List the signatories the clause requires.'
  - Output the review with the open questions for legal and the proposer.
  heuristics:
  - 'A change to one clause moves others: term affects notice and renewal; scope affects price, liability and insurance; price affects any index or rebate
    clause.'
  - The contract's own change procedure governs; an email agreeing a change may not amend the contract.
  - Material changes to value, scope or term are a new commercial decision and take the full approval route.
  - A side letter that contradicts the main agreement is a finding for legal, not a convenience.
  policy_hooks: The new value and any term extension are checked with `tool:check_policy` and the route is reported as replied. Signing is a person's act
    under the signatory rule the contract or policy names; the skill never signs or sends the amendment.
  outputs:
  - 'Agreement: parties, expiry, stored value, change-control clause quoted.'
  - 'Change table: what changes, clause touched (quoted), implied effects on other clauses.'
  - Wording comparison or the described differences, labelled.
  - 'Financial effect: price change, new total value, materiality against the configured share.'
  - Approval route and required signatories.
  - Open questions for legal and the proposer; recommendation.
  quality:
  - Every clause cited is quoted from the stored contract; none paraphrased from memory.
  - The price effect uses the contract's or the user's figures and the calculation registry.
  - Implied effects are listed, not only the clauses the proposer named.
  - Nothing is signed, sent or recorded as agreed.
  escalation: Escalate to legal where the change-control clause is missing or not followed, where a side letter contradicts the agreement, or where liability
    or termination terms move; to the approver the policy names for the value; to finance where the change alters the committed spend.
  example: Asked to review a supplier's proposed amendment raising rates and extending the term by two years, the skill finds the agreement, quotes the
    variation clause (written, signed by both parties), the price review clause (index-linked, annual) and the notice clause, shows the proposed increase
    exceeds what the index clause allows, computes the effect over the remaining and extended term, finds it material against the configured share, reports
    the approval route the policy returns, and lists for legal that the extension moves the notice deadline and that the amendment is silent on the liability
    cap.
  anti_patterns:
  - Reviewing only the clause the proposer mentioned.
  - Accepting an email exchange as an amendment when the contract requires a signed variation.
  - Computing the price effect from an assumed volume.
  - Signing or sending the amendment.
  context: We are reviewing a proposed amendment to a contract that is already in force.
  thresholds:
  - key: material_change_pct
    value: 10
    comment: a change to contract value above this share is material and takes the full approval route
  routing:
    strong:
    - amendment*
    - amend the
    - amend our
    - amending
    - change order*
    - change-order*
    - variation order*
    - variation to the
    - contract variation*
    - addendum
    - addenda
    - side letter*
    - extend the scope
    - scope change
    - change the contract
    - change to the contract
    - changes to the contract
