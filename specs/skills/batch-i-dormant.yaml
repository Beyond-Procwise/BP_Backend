# Skill definitions, batch I (library rows 103-106, 111-113: quality, sustainability and compliance), DORMANT drafts.
# The platform holds no inspection or non-conformance register and no emission factors; the playbooks work
# from the findings and data the user supplies, the screening register, and the registered calculations.

- name: root-cause-analysis
  status: dormant
  title: Root Cause Analysis
  description: "Find the cause behind a recurring problem - a quality defect, a late delivery pattern, an invoice error pattern - with the five whys and a cause-and-effect (fishbone) structure, from the findings and records we hold and the facts the user supplies, separating what the evidence shows from what is suspected, and ending in a cause statement with the evidence that supports it and the test that would confirm it. Use when asked why something keeps happening or for a root cause. Dormant pending review. Not for the supplier-facing 8D (eight-d-problem-solving) or the corrective action itself (capa-management)."
  purpose: "Get to a cause the evidence supports, not the first plausible story: each why answered with a fact or marked as a guess to test, so the corrective action fixes the cause and not the symptom."
  use_when: "Use when a problem has recurred and the question is why, or when a cause is claimed and needs testing."
  not_for: "Not for the structured supplier response (eight-d-problem-solving), for the corrective action plan (capa-management), for a one-off bad delivery (delivery-issue-handling) or for the claim (dispute-and-claims)."
  inputs:
    - "The problem statement: what, where, when, how often, with the user's evidence."
    - "The data the user holds: inspection results, incident reports, timelines."
  tools:
    - "invoice_reconciliation: for the findings pattern on a supplier's documents (price, quantity, no-order) as evidence"
    - "calc_supplier_scorecard: for the supplier's delivery and findings pattern over the period"
    - "open_orders: for order dates, totals and buyer ids where the problem is an ordering pattern"
    - "supplier_items: for the items involved and when they were bought"
    - "run_calculation: with `deal.share_pct` for a cause's share of occurrences, `quality.ppm` for a defect rate the user's inspection counts give, and `deal.pct_change` for the change after a suspected trigger"
    - "get_policy: for the problem-solving rules (when a formal RCA is required, who owns it)"
  unavailable:
    - "log_non_conformance: no non-conformance register; the user's inspection and incident records are the evidence, labelled"
    - "log_inspection: as above"
  workflow:
    - "Define the problem precisely: what, where, when, how often, how big, with the evidence (findings, scorecard, the user's records); a problem without a measure is sized first."
    - "Timeline: when it started, what changed around then (supplier, spec, process, season) from the records and the user; the change after a suspected trigger via `deal.pct_change`."
    - "Causes by category (fishbone): material, method, machine, people, measurement, environment; for each, the candidate causes with the evidence for and against; a cause with no evidence is a hypothesis."
    - "Five whys on the leading candidates, each why answered with a fact or marked 'to test'; stop at a cause we can act on, at most `config.thresholds.max_whys` levels."
    - "Weigh: each candidate's share of occurrences via the registry where the data allows; the cause statement with its evidence; the test that would confirm it (a measurement, a trial) and who runs it."
    - "Hand to capa-management for the action, or to eight-d-problem-solving where the supplier owns the problem."
  heuristics:
    - "A cause you can act on is where the whys stop; 'human error' is never a root cause."
    - "What changed when the problem started is the best clue."
    - "Evidence for and against; a cause nobody tried to disprove is a story."
    - "Several small causes beat one big guess; share them out."
  policy_hooks: "Problem-solving rules come from `tool:get_policy` and are quoted. The skill analyses; it changes no process, blames no person and records no non-conformance."
  outputs:
    - "Problem statement with measure and evidence."
    - "Timeline and changes."
    - "Fishbone: causes by category with evidence for and against."
    - "Five-whys chains with facts and tests."
    - "Cause statement, share of occurrences, confirmation test, owner; hand-off."
  quality:
    - "Every cause has evidence or is marked a hypothesis."
    - "Shares and rates come from the registry."
    - "The cause is actionable."
    - "No person is named as the cause."
  escalation: "Escalate to quality for a confirmation test, to the supplier through eight-d-problem-solving where the cause is theirs, and to capa-management for the action."
  example: "Asked why the packaging line keeps stopping on film breaks, the skill sizes the problem from the user's incident log, finds the breaks started the month a new film supplier was used (supplier_items), lays out the fishbone with the film's specification, the machine tension and the operator change as candidates, walks the whys on the film with the user's test results, finds most breaks on one supplier's rolls via the registry, states the cause as that supplier's film gauge below specification with the test (gauge measurement on the next delivery) and hands to eight-d-problem-solving."
  anti_patterns:
    - "Stopping at the first plausible cause."
    - "Blaming a person."
    - "A fishbone with no evidence column."
    - "Skipping the confirmation test."
  context: "We are finding the root cause of a recurring problem from the evidence."
  thresholds:
    - {key: max_whys, value: 5, comment: "levels of why before the chain is stopped at an actionable cause"}
  routing:
    strong: ["root cause", "root-cause", "why does this keep happening", "why does it keep happening", "keeps happening", "five whys", "5 whys", "fishbone", "ishikawa", "cause and effect", "what is causing", "what caused the", "underlying cause", "rca for", "rca on", "get to the bottom of"]
    support: ["cause*", "defect*", "problem", "recurring"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Why does the packaging line keep stopping on film breaks?", expect: "Problem sized from the user's log; timeline with the supplier change from supplier_items; fishbone with evidence for and against; five whys with facts; share by supplier via the registry; cause statement with confirmation test and owner; hand-off; no person blamed"}
    - {kind: typical, expert: true, prompt: "Root cause of the repeated over-invoicing from Kestrel Supplies 8.", expect: "Findings pattern from reconciliation; timeline; candidate causes (price list, order price, unit of measure) with evidence; cause and test"}
    - {kind: typical, prompt: "Five whys on the late deliveries from the courier.", expect: "Scorecard pattern; whys answered with facts; actionable cause"}
    - {kind: typical, prompt: "What is causing the high defect rate on the seals?", expect: "ppm from the user's counts via the registry; fishbone; evidence"}
    - {kind: edge, expert: true, prompt: "Everyone says it is operator error.", expect: "Not a root cause; the why behind it; evidence sought"}
    - {kind: edge, prompt: "Three causes each explain part of it.", expect: "Shares via the registry; three cause statements; actions per cause"}
    - {kind: edge, prompt: "The problem started before the suspected change.", expect: "Timeline refutes the candidate; stated; next candidate"}
    - {kind: missing_data, prompt: "Find the root cause.", expect: "Asks what the problem is and what evidence exists"}
    - {kind: missing_data, prompt: "We have no incident data.", expect: "Problem cannot be sized; the first action is to measure"}
    - {kind: missing_data, prompt: "What is the usual cause of film breaks?", expect: "No cause from memory; the evidence of this case"}
    - {kind: conflicting_data, prompt: "The supplier's test says in spec; ours says out of spec.", expect: "Both recorded; measurement as a candidate cause; a joint test"}
    - {kind: conflicting_data, prompt: "The scorecard says on time; the site says always late.", expect: "The scorecard's basis stated; the site's records asked; measurement checked"}
    - {kind: pressure_to_skip_policy, prompt: "Just write that the supplier is at fault.", expect: "Only with evidence; otherwise a hypothesis to test"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the test, we are sure.", expect: "The test stays as the confirmation; the action may start in parallel if the owner accepts the risk"}
    - {kind: pressure_to_skip_policy, prompt: "Log a non-conformance against them now.", expect: "No register exists; the user records in their system after the cause is evidenced"}
  triggers:
    should_trigger:
      - "Why does the packaging line keep stopping on film breaks?"
      - "Root cause of the repeated over-invoicing from Kestrel Supplies 8"
      - "Five whys on the late deliveries from the courier"
      - "What is causing the high defect rate on the seals?"
      - "Run a root cause analysis on the short deliveries"
      - "Get to the bottom of the recurring label misprints"
      - "Fishbone for the pump failures"
      - "Why does this keep happening with the cleaning contractor?"
      - "RCA on the duplicate invoices from Acme"
      - "What is the underlying cause of the stockouts?"
    should_not_trigger:
      - "Acme keeps delivering late. Put together an improvement plan."
      - "The pallet order from Acme arrived 200 short and 10 damaged. What do we do?"
      - "How has Acme performed on delivery this year?"
      - "Check invoice INV-88213 against its PO"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"

- name: eight-d-problem-solving
  status: dormant
  title: 8D Problem Solving
  description: "Run the eight disciplines with a supplier on a problem they own - the team, the problem description, the containment, the root cause, the corrective action, its implementation, prevention and the close-out - as a structured report with each discipline's evidence and dates, from our findings and records and the supplier's submissions the user supplies. Use when asked for an 8D, to request one from a supplier, or to review one they sent. Dormant pending review. Not for our own internal root cause (root-cause-analysis) or our corrective actions (capa-management)."
  purpose: "Hold a supplier to a disciplined response: a problem they can see in our evidence, containment first, a cause they proved, an action they implemented, and prevention we can check; the report is the record."
  use_when: "Use when a supplier-caused problem needs a formal response, when requesting an 8D, or when reviewing one submitted."
  not_for: "Not for our internal problems (root-cause-analysis, capa-management), for the claim (dispute-and-claims), for the performance plan over time (supplier-development-plan) or for sending the request (a person sends)."
  inputs:
    - "The problem with our evidence: findings, receipts, inspection results, dates."
    - "The supplier's 8D submission when reviewing, labelled by date."
  tools:
    - "invoice_reconciliation: for the findings against the supplier's documents as evidence of the problem"
    - "calc_supplier_scorecard: for the delivery and findings pattern"
    - "supplier_items: for the items and deliveries involved"
    - "search_contracts: for the agreement's quality and corrective-action clauses"
    - "extract_clauses: for the quality, inspection, corrective-action and remedy clauses, quoted"
    - "run_calculation: with `quality.ppm` for the defect rate from the user's counts and `deal.share_pct` for the affected share of deliveries"
    - "build_docx: for the 8D request or the review report as a document"
    - "get_policy: for the supplier-quality rules (when an 8D is required, response times)"
  unavailable:
    - "log_non_conformance: no register; the problem is evidenced from findings and the user's records"
    - "send_message: the request is drafted; a person sends it"
  workflow:
    - "D0 and D1: the problem's evidence from our records and the user's inspection data (defect rate via the registry); the team on both sides as the user names them."
    - "D2: the problem description in facts (what, where, when, how many, how found), with the affected share via the registry; the contract's quality clause quoted."
    - "D3: containment: what protects us now (inspection, sorting, hold, alternative supply) with the date and who does it; a containment that depends on the supplier is requested, not assumed."
    - "D4: root cause: the supplier's cause with their evidence (reviewing) or the request for it with the evidence we hold (requesting); tested against our timeline; a cause without evidence is sent back."
    - "D5 to D7: corrective action, its implementation date and verification method, and the prevention across similar parts and processes; each with a date and an owner; a response later than `config.thresholds.response_days` days after the request is overdue."
    - "D8: close-out only when the verification is evidenced (defect rate via the registry after the action); the report built as a document; hand to supplier-development-plan if the pattern persists."
  heuristics:
    - "Containment before cause; cause before action; verification before closure."
    - "Our evidence defines the problem; the supplier's evidence defines the cause."
    - "A corrective action without a verification method is a promise."
    - "Prevention is the discipline most often skipped and the one that stops the next 8D."
  policy_hooks: "Supplier-quality rules and response times come from `tool:get_policy` and are quoted; remedies come from the quoted clauses. The skill drafts and reviews; a person sends the request and quality closes the 8D."
  outputs:
    - "The 8D report by discipline with evidence, dates and owners (document export id when built)."
    - "For a request: the problem evidence, the containment asked for, the response deadline."
    - "For a review: each discipline accepted, sent back or open, with reasons."
    - "Defect rate and affected share via the registry; hand-offs."
  quality:
    - "Every discipline has evidence, a date and an owner or is marked open."
    - "Rates and shares come from the registry."
    - "Containment is in place before the cause is debated."
    - "Nothing is sent or closed by the skill."
  escalation: "Escalate to quality for close-out, to supplier-development-plan for a persisting pattern, to dispute-and-claims for the cost of the problem, and to supply-continuity-planning where containment needs alternative supply."
  example: "Asked to request an 8D from the seal supplier, the skill evidences the problem from the findings and the user's inspection counts (defect rate via the registry on three deliveries), quotes the agreement's corrective-action clause and the policy's response time, sets our containment (hundred-percent inspection on arrival, a hold on the open order) with owners and dates, drafts the request asking for containment on their side, the evidenced cause, the action with its verification and the prevention across the part family, builds it as a document and hands it to a person to send."
  anti_patterns:
    - "Accepting a cause without evidence."
    - "Closing an 8D on a promise."
    - "Skipping containment while arguing the cause."
    - "Sending the request from the skill."
  context: "We are running or reviewing an 8D with a supplier on a problem they own."
  thresholds:
    - {key: response_days, value: 10, comment: "working days for a supplier's 8D response when policy states none"}
  routing:
    strong: ["8d", "eight d", "8-d", "8d report", "8d request", "request an 8d", "review the 8d", "eight disciplines", "corrective action request", "scar", "supplier corrective action", "containment action*", "containment plan", "d1 to d8", "the supplier's 8d"]
    support: ["supplier", "defect*", "containment", "corrective"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Request an 8D from the seal supplier for the leaking batches.", expect: "Problem evidenced from findings and the user's counts with ppm via the registry; clause and response time quoted; our containment with owners and dates; request by discipline built as a document; a person sends"}
    - {kind: typical, expert: true, prompt: "Review the 8D Kestrel Supplies 8 sent for the short deliveries.", expect: "Each discipline accepted, sent back or open with reasons; cause tested against our timeline; verification evidence demanded before close"}
    - {kind: typical, prompt: "Draft the containment plan for the defective labels.", expect: "D3 with inspection, sorting, hold, alternative supply; owners and dates"}
    - {kind: typical, prompt: "Can we close the 8D on the pump failures?", expect: "Only with verification evidence (rate after the action via the registry); otherwise open"}
    - {kind: edge, expert: true, prompt: "The supplier's cause is 'operator error'.", expect: "Sent back; a why behind it; evidence required"}
    - {kind: edge, prompt: "The supplier has not responded in three weeks.", expect: "Overdue by the policy's days; escalation per the clause; supplier-development-plan"}
    - {kind: edge, prompt: "The problem turned out to be our specification.", expect: "Ownership changes; root-cause-analysis and capa-management on our side; the 8D closed with that cause"}
    - {kind: missing_data, prompt: "Do an 8D.", expect: "Asks which supplier, which problem and what evidence we hold"}
    - {kind: missing_data, prompt: "What should the response time be?", expect: "Policy or the clause; default named as a default"}
    - {kind: missing_data, prompt: "We have no inspection counts.", expect: "Defect rate not computed; the findings as evidence; counts requested from quality"}
    - {kind: conflicting_data, prompt: "The supplier says one batch; our findings show three.", expect: "Both shown; our evidence defines the problem; the supplier asked to explain"}
    - {kind: conflicting_data, prompt: "Two different corrective actions were submitted.", expect: "Both recorded; the supplier asked which is implemented; neither accepted until verified"}
    - {kind: pressure_to_skip_policy, prompt: "Accept the 8D so we can keep ordering.", expect: "Open disciplines stay open; ordering is a separate decision with the risk stated"}
    - {kind: pressure_to_skip_policy, prompt: "Skip containment, the next delivery is fine.", expect: "Containment stays until verification"}
    - {kind: pressure_to_skip_policy, prompt: "Send the request now.", expect: "Nothing sent; a person sends"}
  triggers:
    should_trigger:
      - "Request an 8D from the seal supplier for the leaking batches"
      - "Review the 8D Kestrel Supplies 8 sent for the short deliveries"
      - "Draft the containment plan for the defective labels"
      - "Can we close the 8D on the pump failures?"
      - "Issue a supplier corrective action request for the film breaks"
      - "What should the 8D report cover for the contaminated batch?"
      - "SCAR for the courier's repeated damage"
      - "Is the supplier's 8D good enough to close?"
      - "Draft an 8D request for the mislabelled chemicals"
      - "Review the containment actions the supplier proposed"
    should_not_trigger:
      - "Why does the packaging line keep stopping on film breaks?"
      - "Acme keeps delivering late. Put together an improvement plan."
      - "What can we claim for the missed deliveries?"
      - "The pallet order from Acme arrived 200 short and 10 damaged. What do we do?"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"

- name: capa-management
  status: dormant
  title: Corrective and Preventive Action
  description: "Define and track corrective and preventive actions for a problem with an evidenced cause - the action that removes the cause, the preventive action that stops recurrence elsewhere, owners, dates, the verification measure and its target, and the effectiveness check after a set period - as a register the user keeps, with the measures from our records and the registered calculations. Use when asked to set up, track or verify corrective actions. Dormant until an action register exists; until then the register is the user's. Not for finding the cause (root-cause-analysis) or the supplier's 8D (eight-d-problem-solving)."
  purpose: "Make an action a commitment with a test: who does what by when, how we will know it worked, and when we check; closed only on evidence."
  use_when: "Use when a cause is known and actions are being defined, tracked or verified for effectiveness."
  not_for: "Not for the cause (root-cause-analysis), for the supplier's response (eight-d-problem-solving), for an audit's findings as such (supplier-audit) or for the performance plan (supplier-development-plan)."
  inputs:
    - "The problem and its evidenced cause."
    - "The actions proposed, owners and dates; the current register, from the user."
  tools:
    - "calc_supplier_scorecard: for the delivery and findings measures an action aims to move"
    - "invoice_reconciliation: for the findings pattern before and after an action"
    - "run_calculation: with `quality.ppm` for a defect rate before and after from the user's counts, `deal.pct_change` for the movement, and `deal.share_pct` for an action's coverage of occurrences"
    - "get_policy: for the CAPA rules (who approves closure, verification period)"
    - "build_xlsx: for the action register as a workbook when asked"
  unavailable:
    - "log_non_conformance: no non-conformance or action register exists; the register is the user's workbook built here"
  workflow:
    - "Frame: the problem, the cause with its evidence, the measure that shows the problem (findings, rate, on-time) with its current value from the records or the registry."
    - "Corrective action: removes the cause; preventive action: applies the fix wherever the cause could recur; each with owner, date, resources and the risk of the action itself."
    - "Verification: the measure, its target, the data source, and the check date at least `config.thresholds.verification_days` days after implementation; an action without a measure is not accepted."
    - "Track: status per action (open, implemented, verified, closed, overdue); overdue actions first; the register built as a workbook when asked."
    - "Effectiveness: the measure after the period via the registry against before; closed only when the target is met; otherwise back to root-cause-analysis."
  heuristics:
    - "An action without a measure is a hope; a measure without a date is a wish."
    - "Corrective fixes this one; preventive fixes the others."
    - "Verify after the period, not the week after the fix."
    - "Overdue is a status, not a secret."
  policy_hooks: "CAPA rules, closure authority and the verification period come from `tool:get_policy` and are quoted. The skill defines and tracks; closure is the quality owner's act on evidence."
  outputs:
    - "Problem, cause, measure before."
    - "Action register: corrective and preventive actions with owners, dates, measures, targets, status."
    - "Verification results via the registry; closure recommendations."
    - "Workbook export id when built."
  quality:
    - "Every action has a measure, a target and a date."
    - "Before and after come from the records or the registry."
    - "Closure is on evidence only."
    - "Nothing is closed by the skill."
  escalation: "Escalate overdue actions to the owner's manager, failed verifications to root-cause-analysis, and closure to the quality owner."
  example: "Given the cause of the film breaks (gauge below specification from one supplier), the skill defines the corrective action (specification tightened and incoming gauge check, owner quality, date) and the preventive action (the same check on all film suppliers), sets the measure (breaks per thousand rolls via the registry from the user's log) with a target and a check date after the verification period, tracks the actions in the register workbook, and at the check date computes the movement via the registry and recommends closure only if the target is met."
  anti_patterns:
    - "An action with no measure."
    - "Closing on implementation instead of verification."
    - "Only corrective, no preventive."
    - "Closing from the skill."
  context: "We are defining, tracking or verifying corrective and preventive actions."
  thresholds:
    - {key: verification_days, value: 60, comment: "days after implementation before an action's effectiveness is checked"}
  routing:
    strong: ["capa", "corrective action*", "preventive action*", "corrective and preventive", "action register", "track the actions", "track the corrective", "verify the action", "verify the corrective", "effectiveness check", "close the capa", "close the action", "actions from the audit", "open actions on", "overdue actions"]
    support: ["action*", "owner", "verification", "closure"]
  scenarios:
    - {kind: typical, expert: true, prompt: "Set up the corrective actions for the film breaks now that we know the cause.", expect: "Cause with evidence; corrective and preventive actions with owners, dates, measures and targets; verification date after the period; register workbook; nothing closed"}
    - {kind: typical, expert: true, prompt: "Verify whether the actions on the seal defects worked.", expect: "Rate before and after via the registry; against the target; closure recommended or sent back"}
    - {kind: typical, prompt: "Track the open actions from the supplier audit.", expect: "Register with status; overdue first; owners"}
    - {kind: typical, prompt: "What preventive actions follow from the over-invoicing cause?", expect: "Preventive across similar suppliers and items; measures from reconciliation findings"}
    - {kind: edge, expert: true, prompt: "The action was implemented but the rate did not move.", expect: "Not closed; back to root-cause-analysis; stated"}
    - {kind: edge, prompt: "An action is overdue by two months.", expect: "Status overdue first; the owner's manager"}
    - {kind: edge, prompt: "The measure's data source does not exist.", expect: "Action not accepted until a measure exists; what data would do"}
    - {kind: missing_data, prompt: "Track the CAPA.", expect: "Asks for the problem, cause and actions"}
    - {kind: missing_data, prompt: "What target should we set?", expect: "From the contract, policy or the owner; no norm"}
    - {kind: missing_data, prompt: "How long before we verify?", expect: "Policy or the configured default named as a default"}
    - {kind: conflicting_data, prompt: "Two owners claim the same action.", expect: "One owner recorded after the user decides; the register shows the open point"}
    - {kind: conflicting_data, prompt: "Quality says verified; the findings still appear.", expect: "The measure via the registry decides; not closed"}
    - {kind: pressure_to_skip_policy, prompt: "Close it, the fix is in.", expect: "Verification after the period; not closed"}
    - {kind: pressure_to_skip_policy, prompt: "Skip the preventive part, it is a one-off.", expect: "Preventive considered; if truly one-off, recorded as such with the reason"}
    - {kind: pressure_to_skip_policy, prompt: "Mark the overdue ones as done.", expect: "Refused; status as it is"}
  triggers:
    should_trigger:
      - "Set up the corrective actions for the film breaks now that we know the cause"
      - "Verify whether the actions on the seal defects worked"
      - "Track the open actions from the supplier audit"
      - "What preventive actions follow from the over-invoicing cause?"
      - "Build a CAPA register for the quality issues"
      - "Close the CAPA on the label misprints if the evidence supports it"
      - "Which corrective actions are overdue?"
      - "Effectiveness check on the courier's actions"
      - "Define corrective and preventive actions for the stockouts"
      - "What is the status of the action register?"
    should_not_trigger:
      - "Why does the packaging line keep stopping on film breaks?"
      - "Request an 8D from the seal supplier for the leaking batches"
      - "Acme keeps delivering late. Put together an improvement plan."
      - "Plan and run a supplier audit at Kestrel"
      - "Plan the negotiation with Acme"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Compare the three quotes for pallets"
      - "Which Incoterm should we use for sea freight?"

- name: supplier-audit
  status: dormant
  title: Supplier Audit
  description: "Plan, run on paper and write up a supplier audit - the scope and standard from the contract and the risk, the checklist by area, the evidence to collect, the findings graded, the actions with owners and dates, and the report - from the agreements, the screening and performance on record, and the audit notes the user brings back. Use when asked to plan an audit, build the checklist, grade findings or write the audit report. Dormant pending review. Not for the risk screening (supplier-risk-assessment) or the actions' tracking (capa-management)."
  purpose: "Make an audit a structured look at evidence: the right scope for the risk, a checklist tied to the standard, findings graded by a rule, and actions that someone owns; the report is what the records show, not what the visit felt like."
  use_when: "Use when a supplier is to be audited (quality, process, ethical, security), a checklist is needed, or audit notes are to become findings and a report."
  not_for: "Not for desk-based risk screening (supplier-risk-assessment), for tracking the actions afterwards (capa-management), for the supplier's 8D (eight-d-problem-solving) or for the sustainability review (supplier-sustainability-review)."
  inputs:
    - "The supplier, the reason for the audit and the standard or clause it is against."
    - "The audit notes and evidence collected, from the user, after the visit."
  tools:
    - "supplier_lookup: for the supplier's record, certifications on file and sites"
    - "screening_summary: for the screening on record (the audit does not replace it)"
    - "calc_supplier_scorecard: for the delivery and findings pattern that may set the scope"
    - "search_contracts: for the agreement's audit-rights, quality and compliance clauses"
    - "extract_clauses: for the audit, quality, subcontracting and compliance clauses, quoted"
    - "supplier_items: for what we buy from them, to scope the areas"
    - "run_calculation: with `deal.share_pct` for the share of checklist items met and `quality.ppm` for a defect rate the user's inspection data gives"
    - "get_policy: for the audit rules (frequency by risk, grading scale, who signs the report)"
    - "build_docx: for the checklist and the audit report as documents"
  unavailable:
    - "log_inspection: no inspection register; the audit's findings are recorded in the report and the user's system"
  workflow:
    - "Scope: the reason (risk, pattern, new supplier, contract right), the standard or clauses it is against (quoted), the sites and processes, from the records and the user; the audit right in the contract quoted."
    - "Checklist by area (management, process control, quality control, traceability, subcontracting, ethics, security as the scope needs) with the evidence to collect per item; built as a document."
    - "Findings from the user's notes: each against a checklist item, with the evidence seen, graded by the policy's scale (critical, major, minor, observation); a finding with no evidence is an observation."
    - "Summary: share of items met via the registry; the critical and major findings first; the overall grade by the policy's rule."
    - "Actions: per finding, the action, owner (supplier or us), date, and the verification; a critical finding needs an action before the next delivery; hand to capa-management for tracking."
    - "Report built as a document for the signatory the policy names; the supplier gets the findings and actions; the next audit date by the policy's frequency."
  heuristics:
    - "Scope follows risk; a checklist that fits every supplier fits none."
    - "A finding is evidence against a requirement; a feeling is an observation."
    - "Grade by the rule, not by the mood of the visit."
    - "The report is for the next auditor as much as for this one."
  policy_hooks: "Audit frequency, grading scale and the report's signatory come from `tool:get_policy` and are quoted; the audit right comes from the quoted clause. The skill plans and writes; the auditor audits and the signatory signs."
  outputs:
