    - {kind: typical, prompt: "What share of our spend is with suppliers that have an ESG rating?", expect: "Coverage share via the registry from the register; by spend not count"}
    - {kind: typical, prompt: "Build the ESG data pack for the auditors.", expect: "Workbook with a source per figure; gaps and estimates listed"}
    - {kind: edge, expert: true, prompt: "No factor exists for the chemicals category.", expect: "Lines counted as without factor; the category's emissions a lower bound; the reporting team asked for a factor"}
    - {kind: edge, prompt: "A supplier gave a specific emissions figure.", expect: "Used as supplier-specific with their factor source stated; replaces the spend-based line; labelled"}
    - {kind: edge, prompt: "The taxonomy maps half the spend.", expect: "Unmapped share stated; emissions only on mapped lines or on a category the user assigns, labelled"}
    - {kind: missing_data, prompt: "Report our emissions.", expect: "Asks for the period, the method and the factors"}
    - {kind: missing_data, prompt: "Use standard factors.", expect: "No factor from memory; the reporting team's source"}
    - {kind: missing_data, prompt: "How many suppliers did we audit?", expect: "From the records only; if audits are not recorded, said so"}
