    - {kind: missing_data, prompt: "Make the tender sustainable.", expect: "Asks which category and event; reads the impact and policy"}
    - {kind: missing_data, prompt: "What emission factors should we use?", expect: "None from memory; the policy's or the bidder's, stated"}
