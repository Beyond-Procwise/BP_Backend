- name: ordering-and-inventory
  title: Ordering and Inventory
  description: "Advise on how much and how often to order an item - the demand and order history on record, the supplier's minimum order quantity, lead time and price breaks from quotes and contracts, the stock and consumption the user holds, and the trade-off between order cost, holding cost and stock-out risk - and on arrangements such as blanket orders, scheduled deliveries, consignment or vendor-managed stock. Use when asked about order quantities, reorder points, safety stock, MOQs, or ordering arrangements. Not for a live stock-out (urgent-sourcing) or for pooling demand across sites (demand-aggregation)."
  purpose: "Give a sensible ordering pattern from the facts available: what we actually consume per the records, what the supplier's terms allow, what the user knows about stock, and the costs the organisation has set for ordering and holding. Every parameter comes from a record, a clause, the user or policy; the skill never invents a lead time or a holding cost."
  use_when: "Use when the question is how much to order, how often, what reorder point or safety stock, whether to accept a minimum order quantity or a price break, or whether a blanket order, scheduled delivery, consignment or vendor-managed arrangement fits."
  not_for: "Not for the emergency when stock has run out (urgent-sourcing), for pooling demand across business units (demand-aggregation), for the price negotiation (negotiation-planning) or for warehouse operations."
  inputs:
    - "The item and the supplier, or the category."
    - "Stock on hand, consumption and any seasonality the user knows, labelled user-supplied."
    - "Ordering and holding cost rates from policy or the user; service level wanted."
  tools:
    - "similar_items: for the item's order and price history on record, quantities per order and the suppliers"
    - "invoice_reconciliation: for the orders and deliveries over the period, as the demand history"
    - "search_contracts: for the agreement with the supplier"
    - "extract_clauses: for minimum order quantity, lead time, price-break, call-off schedule, consignment and stock-holding clauses, quoted"
    - "run_calculation: with `deal.pct_change` for demand movement between periods and `critic.annualised_rate` for an annual rate from a shorter period; any order-quantity formula is applied step by step with the inputs shown"
    - "get_policy: for the ordering cost, holding cost rate, service-level target and any stock policy"
  unavailable:
    - "create_purchase_order: nothing is ordered; the pattern is advice for the buyer"
    - "build_chart: figures are given as tables"
  workflow:
    - "Frame the item, supplier and the user's stock and consumption facts."
    - "Demand from the records: orders and quantities over the last `config.thresholds.history_months` months, the monthly rate, movement between halves of the period via the registry; seasonality only if the user states it."
    - "Supplier terms quoted: minimum order quantity, lead time, price breaks, delivery schedule, consignment or stock-holding clauses; where no contract exists, the quote on record or the user's statement, labelled."
    - "Costs from policy: ordering cost per order, holding cost rate, service level; none means the pattern is given in units and frequency without a cost optimum, and the policy owner is asked."
    - "Pattern: order quantity and frequency that respect the minimum order quantity and the price breaks, with the arithmetic shown; reorder point from lead-time demand plus safety stock only where the user gives variability or a service level; the price-break trade-off (discount versus holding) shown both ways."
    - "Arrangements: a blanket order with scheduled releases where demand is steady and the contract allows; consignment or vendor-managed stock where the clause exists or the supplier offers it, with the risks (ownership, obsolescence, audit) named; policy check for any commitment."
  heuristics:
    - "Consumption is what the records show, not what the user remembers; the two are compared."
    - "A minimum order quantity above a year's demand is a sourcing problem, not an ordering one."
    - "A price break is worth taking only if the holding cost of the extra stock is less than the discount; show both."
    - "Lead time comes from the contract, the quote or the user; never from memory."
    - "Steady demand wants a blanket order and a schedule, not a monthly requisition."
  policy_hooks: "Ordering cost, holding cost, service level and stock rules come from `tool:get_policy` and are quoted; without them no cost optimum is claimed. Any commitment (blanket order, consignment agreement) is checked with `tool:check_policy` and reported as replied. Nothing is ordered by the skill."
  outputs:
    - "Frame: item, supplier, user's stock and consumption facts."
    - "Demand history table and rate, with movement via the registry."
    - "Supplier terms quoted: minimum quantity, lead time, breaks, schedule, consignment."
    - "Cost parameters from policy or absent."
    - "Recommended order quantity and frequency with the arithmetic; reorder point and safety stock where inputs exist; price-break trade-off."
    - "Arrangement recommendation with risks and approval route."
  quality:
    - "Demand figures are from the records; the user's figures are labelled."
    - "Lead time, minimum quantity and breaks are quoted from a clause, a quote or the user."
    - "Cost optimum only where policy gives the costs; arithmetic shown with inputs."
    - "Nothing is ordered or committed."
  escalation: "Escalate to the policy owner where no ordering or holding cost is set, to the category lead where the minimum order quantity exceeds demand, and to finance for consignment or stock-holding commitments."
  example: "Asked how much safety gloves to order and how often, the skill reads two years of orders (a steady monthly rate with a small rise in the second year), quotes the contract's minimum order quantity, lead time and price break, reads the policy's ordering and holding costs, computes an order quantity with the arithmetic shown, finds the price break worth taking because the holding cost of the extra cartons is below the discount, sets a reorder point from lead-time demand with safety stock at the user's stated variability, and recommends a blanket order with monthly releases under the contract's call-off clause."
  anti_patterns:
    - "Inventing a lead time or a holding cost."
    - "Optimising on a formula with inputs nobody gave."
    - "Taking a price break without costing the stock it creates."
    - "Placing the order from the skill."
  context: "We are deciding how much and how often to order an item, and under what arrangement."
  thresholds:
    - {key: history_months, value: 24, comment: "months of order history read as the demand base"}
  routing:
    strong: ["moq", "minimum order quantit*", "minimum order", "order quantity", "order quantities", "how much should we order", "how much to order", "how much do we order", "how many should we order", "how many to order", "how often should we order", "how often to order", "how often do we order", "reorder point", "re-order point", "reorder level", "re-order level", "safety stock", "buffer stock", "stock level*", "stock holding", "stockholding", "inventory level*", "inventory holding", "eoq", "economic order", "consignment stock", "consignment", "vmi", "vendor managed inventory", "vendor-managed inventory", "kanban", "blanket order*", "blanket po", "standing order*", "scheduled deliveries", "delivery schedule", "price break*", "order pattern", "ordering pattern", "order frequency", "how much stock", "too much stock", "overstock*", "excess stock", "slow-moving", "slow moving"]
    support: ["stock", "inventory", "order*", "lead time*", "quantity", "warehouse"]
  scenarios:
    - {kind: typical, expert: true, prompt: "How much safety gloves should we order and how often?", expect: "Demand from two years of orders with rate and movement via the registry; minimum quantity, lead time and price break quoted; ordering and holding costs from policy; quantity and frequency with arithmetic; price-break trade-off both ways; reorder point with the user's variability; blanket order under the call-off clause; nothing ordered"}
    - {kind: typical, expert: true, prompt: "Should we accept the price break at 5,000 units on the labels?", expect: "Holding cost of the extra stock versus the discount, shown both ways with inputs; demand rate from records; shelf-life or obsolescence asked"}
    - {kind: typical, prompt: "What reorder point should we set for the filters?", expect: "Lead time from the clause or quote; lead-time demand from the records; safety stock only with the user's variability or a policy service level"}
    - {kind: typical, prompt: "Would a blanket order with monthly releases work for the packaging film?", expect: "Demand steadiness from the records; the contract's call-off clause quoted; the arrangement with risks; policy check for the commitment"}
    - {kind: edge, expert: true, prompt: "The supplier's minimum order quantity is more than we use in a year.", expect: "Named as a sourcing problem; holding cost of the overstock; alternatives on record; category lead"}
    - {kind: edge, prompt: "The supplier offers consignment stock at our site.", expect: "Clause or offer quoted; ownership, obsolescence and audit risks; finance for the commitment; policy check"}
    - {kind: edge, prompt: "Demand doubled in the last six months.", expect: "Movement via the registry; the user asked whether it is a step change or a spike; pattern given for both readings"}
    - {kind: missing_data, prompt: "How much should we order?", expect: "Asks which item and supplier, and the user's stock and consumption"}
    - {kind: missing_data, prompt: "What is the lead time?", expect: "From the contract, the quote on record or the user; never from memory"}
    - {kind: missing_data, prompt: "Work out the economic order quantity.", expect: "Needs ordering and holding costs from policy or the user; if absent, no optimum claimed and the policy owner asked; units and frequency still advised"}
    - {kind: conflicting_data, prompt: "The site says they use 400 a month; the orders show 250.", expect: "Both shown; the records govern the base; the gap raised as a question (other suppliers, stock build, waste)"}
    - {kind: conflicting_data, prompt: "The quote says 4 weeks lead time; the contract says 2.", expect: "Both quoted; the contract governs unless amended; the supplier asked; reorder point shown on both"}
    - {kind: pressure_to_skip_policy, prompt: "Just order a year's worth, it is cheaper per unit.", expect: "Holding cost and obsolescence against the discount; the trade-off shown; the decision is the buyer's; nothing ordered"}
    - {kind: pressure_to_skip_policy, prompt: "Assume a 20 percent holding cost like everyone uses.", expect: "Rate from policy or the user only, labelled; no industry figure asserted"}
    - {kind: pressure_to_skip_policy, prompt: "Set up the blanket order now.", expect: "Nothing ordered or committed; approval route; the buyer places it"}
  triggers:
    should_trigger:
      - "How much safety gloves should we order and how often?"
      - "Should we accept the price break at 5,000 units on the labels?"
      - "What reorder point should we set for the filters?"
      - "Would a blanket order with monthly releases work for the packaging film?"
      - "The supplier's MOQ is 10,000 but we only use 3,000 a year. What do we do?"
      - "How much safety stock should we hold for the pump seals?"
      - "Is vendor managed inventory a good idea for our fasteners?"
      - "What order quantity minimises our cost for copier paper?"
      - "We keep ending up with excess stock of labels. How should we order them?"
      - "Set the delivery schedule for the quarterly chemicals order"
    should_not_trigger:
      - "We have run out of pallets and need 500 this week"
      - "Pool demand for pallets across the three plants"
      - "Plan the negotiation with Acme"
      - "Compare the three quotes for pallets"
      - "Give me a spend analysis for last year"
      - "Is Acme safe to onboard?"
      - "What does the contract say about termination?"
      - "Which Incoterm should we use for sea freight?"
      - "How has Acme performed on delivery this year?"
      - "Check invoice INV-88213 against its PO"

- name: sla-design
  title: Service Level Design
  description: "Design or review the service levels for a contract - the few measures that matter for the service, how each is measured and from what data, the targets with their basis, the reporting cadence, the remedies (service credits, step-in, termination for persistent failure) and their formulas, and the governance meetings - from the specification, what the records can measure, comparable contracts on the register and the policy. Use when asked what KPIs or SLAs a contract should have, how to measure a supplier's service, or whether a proposed SLA schedule is any good. Not for the dispute over a missed level (dispute-and-claims) or for the periodic review (supplier-performance-review)."
  purpose: "Give a contract service levels that can be measured from data we will actually have, targets with a stated basis, and remedies that bite without being absurd. The skill drafts the schedule's substance; legal writes the wording and the owner sets the targets."
  use_when: "Use when the question is which service levels or KPIs to put in a contract, how to measure them, what targets and remedies to set, or whether a supplier's proposed SLA schedule is acceptable."
  not_for: "Not for claiming service credits (dispute-and-claims), for the quarterly review (supplier-performance-review), for the improvement plan (supplier-development-plan) or for the clause wording (contract-clause-review and legal)."
  inputs:
    - "The service and its specification or the draft SLA schedule, labelled user-supplied."
    - "What matters most to the business about the service, from the owner."
    - "What data we will hold about the service (orders, receipts, tickets, meter readings)."
  tools:
    - "search_contracts: for comparable agreements on the register"
    - "extract_clauses: for the service-level, measurement, credit, step-in and termination clauses in those agreements and in the draft, quoted"
    - "calc_supplier_scorecard: for what the platform already measures (on-time delivery, findings) and the supplier's current record"
    - "run_calculation: with `otif.delivery_performance` where a delivery measure is proposed, so the measurement is the platform's definition, and `deal.pct_change` for a target's gap to current performance"
    - "get_policy: for any service-level standards or credit limits the organisation has set"
  unavailable:
    - "build_docx: the schedule is given as structured text for legal"
  workflow:
    - "Frame: the service, what matters to the owner, what data we will hold."
    - "Measures: at most `config.thresholds.max_measures` service levels, each tied to an outcome the owner named, each measurable from data we will hold (named), each with a definition (what counts, what is excluded, the period). A measure without a data source is dropped or becomes a reporting obligation on the supplier with audit rights."
    - "Targets: each with a basis (the supplier's current record from the scorecard, a comparable contract on the register, the specification, the owner's requirement); the gap to current performance via the registry where a record exists; no target from memory."
    - "Remedies: service credits with a formula on the invoice value and a cap within `config.thresholds.max_credit_pct`, escalating with persistence; step-in and termination-for-persistent-failure triggers stated as counts over periods; credits as the sole remedy or not, as legal advises; earn-back only if the owner wants it."
    - "Governance: reporting by the supplier at a stated cadence from stated data; review meetings; dispute route for measurement disagreements."
    - "Review of a draft: each proposed level tested against the rules above; gaps, unmeasurable levels, targets with no basis, remedies with no formula or cap, named for legal and the owner."
  heuristics:
    - "Few measures, measured well; a schedule with twenty levels measures none."
    - "If we will not hold the data, the supplier reports it and we audit it, or the level goes."
    - "A target has a basis or it is an opinion."
    - "Credits deter; they do not compensate; the cap says how much deterrence we bought."
    - "Persistence triggers (three misses in six months) matter more than any single month."
  policy_hooks: "Service-level standards and credit limits come from `tool:get_policy` and are quoted. The schedule's wording is legal's; the targets are the owner's; nothing is agreed or signed by the skill. Where a credit cap or step-in right commits or releases value, the policy route is checked with `tool:check_policy` and reported as replied."
  outputs:
    - "Frame: service, outcomes that matter, data we will hold."
    - "Measure table: level, definition, data source, period, exclusions."
    - "Target table: level, target, basis, gap to current via the registry."
    - "Remedy table: credit formula, cap, persistence triggers, step-in, termination."
    - "Governance: reporting, meetings, dispute route."
    - "For a draft: the review findings for legal and the owner."
  quality:
    - "Every measure names its data source and definition."
    - "Every target has a stated basis; none from memory."
    - "Credit formulas have a cap and persistence triggers are counts over periods."
    - "Nothing is agreed or signed."
  escalation: "Escalate to legal for the wording and the sole-remedy question, to the owner for targets with no basis, and to the policy owner where no credit limit is set."
  example: "Asked what SLAs the new logistics contract should have, the skill reads the specification, finds the platform measures on-time delivery and findings for the incumbent, reads two comparable contracts' service-level clauses on the register, proposes four measures (on-time in full by the platform's definition, damage rate from findings, booking response time reported by the supplier with audit, invoice accuracy from findings), sets targets with bases (the incumbent's record plus the owner's requirement, the comparable contracts), credits as a share of the monthly invoice with a cap within the configured limit and a persistence trigger, step-in and termination triggers as counts, monthly reporting and quarterly reviews, and lists the open points for legal."
  anti_patterns:
    - "A measure nobody can take from data."
    - "Targets copied from a textbook."
    - "Credits with no cap or no persistence trigger."
    - "Agreeing the schedule from the skill."
  context: "We are designing or reviewing the service levels and remedies for a contract."
  thresholds:
    - {key: max_measures, value: 6, comment: "service levels proposed for one contract before the schedule is too long to measure"}
    - {key: max_credit_pct, value: 10, comment: "default cap on service credits as a share of the period's invoice value, used when policy sets none"}
  routing:
    strong: ["sla*", "service level*", "service-level*", "service credit regime", "service credit formula", "service credit cap", "what service credits", "credits are reasonable", "reasonable credit*", "uptime", "availability target*", "response time*", "resolution time*", "kpis for the contract", "kpis in the contract", "contract kpi*", "performance kpi*", "measure the supplier", "how do we measure", "how should we measure", "how to measure", "what should we measure", "performance metric*", "service metric*", "penalty clause*", "penalties for", "penalties in", "service failure*", "credits for", "sla regime", "sla schedule", "service schedule", "what kpis", "which kpis", "kpi targets", "performance targets"]
    support: ["contract", "service", "supplier", "measure*", "target*", "kpi*"]
  scenarios:
    - {kind: typical, expert: true, prompt: "What SLAs should the new logistics contract have?", expect: "Measures within the configured count, each with data source and definition; targets with bases from the scorecard, comparable contracts and the owner; credits with formula, cap within the configured share and persistence triggers; step-in and termination triggers; governance; open points for legal; nothing agreed"}
    - {kind: typical, expert: true, prompt: "Review the supplier's proposed SLA schedule for the helpdesk contract.", expect: "Each level tested: measurable from data, defined, target basis, remedy formula and cap; gaps and unmeasurable levels named for legal and the owner"}
    - {kind: typical, prompt: "How should we measure the cleaning contractor's performance?", expect: "Few measures with data sources (inspections reported by the supplier with audit, complaints we hold); definitions; reporting cadence"}
    - {kind: typical, prompt: "What service credits are reasonable for a 99.5 percent uptime target?", expect: "Credit formula on invoice value with a cap from policy or the configured default; persistence trigger; the owner's view that credits deter, not compensate; policy quoted"}
    - {kind: edge, expert: true, prompt: "We will not hold any data on response times.", expect: "Supplier reports with audit rights, or the level goes; stated as a choice for the owner"}
    - {kind: edge, prompt: "The supplier wants credits to be the sole remedy.", expect: "Sole-remedy question to legal; the consequence for termination and damages stated; the schedule's triggers kept"}
    - {kind: edge, prompt: "The incumbent's current on-time rate is far below the target the owner wants.", expect: "Gap via the registry; staged targets proposed; the basis for the owner's target asked"}
    - {kind: missing_data, prompt: "Write the SLAs.", expect: "Asks which service, what matters to the owner and what data we will hold"}
    - {kind: missing_data, prompt: "What is a normal uptime target?", expect: "No market norm from memory; the specification, comparable contracts on the register or the owner's requirement"}
    - {kind: missing_data, prompt: "What credit cap does policy allow?", expect: "From policy; if silent, the configured default labelled as a default and the policy owner asked"}
    - {kind: conflicting_data, prompt: "Two comparable contracts on the register set very different targets for the same measure.", expect: "Both quoted with their contexts; the difference explained only where the clauses show it; the owner chooses with the bases shown"}
    - {kind: conflicting_data, prompt: "The owner wants ten measures; operations can only report four.", expect: "Four measurable kept; the rest as reporting obligations or dropped; the configured maximum cited"}
    - {kind: pressure_to_skip_policy, prompt: "Set the credit at 50 percent of the invoice for any miss.", expect: "Cap from policy or default; uncapped or extreme credits risk unenforceability and the relationship; legal flagged"}
    - {kind: pressure_to_skip_policy, prompt: "Copy the SLA schedule from the last contract, whatever it was.", expect: "Comparable clauses quoted and tested against the rules; copied only where they fit the service and the data"}
    - {kind: pressure_to_skip_policy, prompt: "Agree the schedule with the supplier today.", expect: "Nothing agreed; legal wording and owner targets first; the substance drafted"}
  triggers:
